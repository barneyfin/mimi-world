/* MeeMee World kit styles. Colours, sizes and type come only from tokens (generated from design/gen_tokens.py). */

/* ---------------------------------------------------------------- page and stage */
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--night);
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
body { position: fixed; inset: 0; touch-action: none; font-family: var(--font-andika); color: var(--moon); }
button { font-family: var(--font-andika); }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; overflow: hidden; background: var(--night); }
.mw-screen { position: absolute; inset: 0; display: none; }
.mw-screen.is-shown { display: block; }
.mw-fill { width: 1280px; height: 800px; pointer-events: none; }

/* ---------------------------------------------------------------- from the design system (components/bundle.css) */
.mw-abs { position: absolute; }
.mw-layer { position: absolute; left: 0; top: 0; }

.mw-circle { position: absolute; box-sizing: border-box; border-radius: var(--radius-round);
  background: var(--moon); border: var(--rim) solid var(--mint); box-shadow: var(--halo-mint); }
.mw-circle--whole { width: var(--circle-whole); height: var(--circle-whole);
  display: flex; align-items: center; justify-content: center; color: var(--numeral); }
.mw-circle--part { width: var(--circle-part); height: var(--circle-part); }
.mw-circle.is-waiting { background: var(--moon-dim); border-style: dashed; box-shadow: none; }
.mw-circle.is-success { box-shadow: var(--ring-success); }

.mw-pill { position: absolute; box-sizing: border-box; width: var(--pill-width); height: var(--pill-height);
  border-radius: var(--radius-pill); background: var(--moon); border: 5px solid var(--mint);
  display: flex; align-items: center; justify-content: center; color: var(--numeral); box-shadow: var(--halo-mint); }
.mw-pill.is-waiting { background: var(--moon-dim); border-style: dashed; box-shadow: none; }
.mw-pill.is-success { box-shadow: var(--ring-success); }

.mw-equation { position: absolute; display: flex; align-items: center; justify-content: center; gap: 22px; color: var(--moon); }
.mw-equation .op { color: var(--peach); }

.mw-btn { padding: 0; border: none; border-radius: var(--radius-round); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; }
.mw-btn:focus-visible { outline: 4px solid var(--mint); outline-offset: 4px; }
.mw-btn--main { width: var(--button-main); height: var(--button-main); background: var(--peach); color: var(--numeral); box-shadow: var(--press-peach); }
.mw-btn--play { width: var(--button-play); height: var(--button-play); background: var(--peach); color: var(--numeral); box-shadow: var(--press-peach); }
.mw-btn--nav { width: var(--button-nav); height: var(--button-nav); background: var(--night-button); color: var(--moon);
  border: 5px solid var(--mint); box-shadow: var(--press-ink); }
.mw-btn--grownups { width: var(--button-grownups); height: var(--button-grownups); background: var(--night); color: var(--text-3); border: 3px solid var(--text-3); }
.mw-btn--main:active, .mw-btn--play:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--peach-dark); }
.mw-btn--nav:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }

.mw-stars { position: absolute; display: flex; gap: var(--space-s); line-height: 0; }
.mw-panel { background: var(--night-raised); border-radius: var(--radius-panel); box-sizing: border-box; color: var(--moon); }
.mw-chip { box-sizing: border-box; min-width: 48px; height: 48px; border-radius: var(--radius-round); display: inline-flex;
  align-items: center; justify-content: center; border: 3px solid var(--mint); color: var(--moon); background: transparent; }
.mw-chip.is-on { background: var(--mint); color: var(--numeral); }
.mw-off { display: none !important; }

/* ---------------------------------------------------------------- the diagram in play */
.mw-circle, .mw-pill { transition: box-shadow 450ms cubic-bezier(.2,.8,.2,1), background-color 260ms; }
.mw-circle.is-hinting { box-shadow: 0 0 0 14px rgba(127, 217, 196, 0.22); }
.mw-equation { opacity: 0; transition: opacity 300ms ease-out; pointer-events: none; }
.mw-equation.is-shown { opacity: 1; }

/* ---------------------------------------------------------------- the MeeMee (counters) */
.mw-counters .mw-mimi, .mw-mimi { position: absolute; left: 0; top: 0; width: var(--mimi-grab); height: var(--mimi-grab);
  margin: -60px 0 0 -60px; display: flex; align-items: center; justify-content: center; line-height: 0;
  pointer-events: none; will-change: transform; }
.mw-mimi-art { transition: transform 120ms ease-out; transform-origin: 50% 50%; overflow: visible; }
.mw-mimi.is-moving { transition: transform 260ms cubic-bezier(.2,.8,.2,1); }
.mw-mimi.is-moving .mw-mimi-art { transition: transform 260ms cubic-bezier(.2,.8,.2,1); }
.mw-mimi.is-lifted { z-index: 5; }
.mw-mimi.is-lifted .mw-mimi-art { filter: drop-shadow(0 14px 8px rgba(0,0,0,0.45)); }
.mw-mimi.is-arriving { animation: mw-arrive 360ms ease-out both; }
.mw-mimi.is-rescued { transition: transform 600ms cubic-bezier(.4,0,.6,1), opacity 600ms ease-in; opacity: 0; }
.mw-mimi.is-rescued .mw-mimi-art { transition: transform 600ms cubic-bezier(.4,0,.6,1); }
.mw-mimi.is-hop .mw-mimi-art, .mw-mimi-art.is-hop { animation: mw-hop 420ms ease-out; }
@keyframes mw-arrive { from { opacity: 0; } to { opacity: 1; } }
@keyframes mw-hop { 0% { translate: 0 0; } 40% { translate: 0 -18px; } 100% { translate: 0 0; } }
.mw-start-mimi { display: flex; gap: 16px; line-height: 0; }

/* numbers mode (0.6.0, NumbersMode): a numbered MeeMee in a circle; it pops up to carry a right answer */
.mw-numbered { width: 140px; height: 209px; transform-origin: 70px 102.5px; line-height: 0; pointer-events: none; }
.mw-numbered > svg { position: absolute; left: 0; top: 0; }
.mw-numbered-sign { position: absolute; left: 0; top: 102.4px; width: 140px; height: 100px; box-sizing: border-box; padding: 4.5px 4.5px 10.5px;
  display: flex; align-items: center; justify-content: center; color: var(--numeral); white-space: nowrap; }
.mw-numbered.is-popping { animation: mw-carry 260ms cubic-bezier(.2,.8,.2,1) both; }   /* the snap: 260 ms, ease-out */
@keyframes mw-carry { from { opacity: 0; translate: 0 40px; scale: 0.6; } to { opacity: 1; translate: 0 0; scale: 1; } }
/* the number track along the bottom: its rail, a dashed ring where a tile is out, and the tiles (84, in a 120 box) */
.mw-track { transition: transform 260ms cubic-bezier(.2,.8,.2,1), opacity 260ms ease-out; }
.mw-track.is-away { transform: translateY(140px); }
.mw-track-place { position: absolute; box-sizing: border-box; width: 72px; height: 72px; border-radius: var(--radius-round);
  border: 4px dashed var(--text-3); display: none; }
.mw-track-place.is-out { display: block; }
.mw-number-tile { position: absolute; left: 0; top: 0; width: 84px; height: 84px; margin: -42px 0 0 -42px; pointer-events: none; will-change: transform; }
.mw-number-tile.is-moving { transition: transform 260ms cubic-bezier(.2,.8,.2,1); }
.mw-number-tile.is-lifted { z-index: 5; }
.mw-number-tile-body { position: relative; width: 100%; height: 100%; transition: transform 120ms ease-out; }
.mw-number-tile-body svg { position: absolute; left: -3px; top: -3px; }
.mw-number-tile-n { position: absolute; inset: 0; box-sizing: border-box; padding: 6px 6px 10px; display: flex; align-items: center;
  justify-content: center; color: var(--numeral); white-space: nowrap; }
.mw-number-tile.is-lifted .mw-number-tile-body { transform: scale(1.1) rotate(-5deg); filter: drop-shadow(var(--lift)); }

/* hint ghosts: where the missing MeeMee would sit */
.mw-ghost { position: absolute; box-sizing: border-box; border-radius: var(--radius-round);
  border: 3px dashed var(--mimi); opacity: 0.6; transition: background-color 200ms, opacity 200ms; }
.mw-ghost.is-lit { background: rgba(140, 124, 214, 0.35); opacity: 1; }

/* sparkles: grow in 300 ms, fade by 1.2 s; once, never blinking */
.mw-spark { position: absolute; pointer-events: none; animation: mw-spark 1200ms ease-out forwards; }
@keyframes mw-spark { 0% { transform: scale(0.2); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 55% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

/* ---------------------------------------------------------------- Scruffles's pod (a button in the game) */
.mw-pod { position: absolute; padding: 0; margin: 0; border: 0; background: none; line-height: 0; cursor: pointer; }
.mw-pod:disabled { cursor: default; }
/* the picture inside a button never takes the tap, so changing Scruffles's face mid-tap can't swallow it */
.mw-pod svg, .mw-btn svg, .gu-btn svg { pointer-events: none; }
.mw-pod:focus-visible { outline: 4px solid var(--mint); outline-offset: 4px; border-radius: 40px; }

/* the rescue ship's lights: unlit until a right answer, then about 4 s of flashing (6 × 0.66 s; the beacon 4 × 1 s).
   Only the small lights flash, each on and off 1.5 times a second, in three groups chasing round the rim. */
.mw-ship-light, .mw-ship-glow, .mw-ship-beacon, .mw-ship-beacon-glow { opacity: 0; }
.mw-pod.is-celebrating .mw-ship-light, .mw-pod.is-celebrating .mw-ship-beacon { animation: mw-ship-flash 0.66s steps(1, end) 6; }
.mw-pod.is-celebrating .mw-ship-glow, .mw-pod.is-celebrating .mw-ship-beacon-glow { animation: mw-ship-glow 0.66s steps(1, end) 6; }
.mw-pod.is-celebrating .mw-ship-beacon, .mw-pod.is-celebrating .mw-ship-beacon-glow { animation-duration: 1s; animation-iteration-count: 4; }
.mw-pod.is-celebrating .mw-ship-p1 { animation-delay: -0.22s; }
.mw-pod.is-celebrating .mw-ship-p2 { animation-delay: -0.44s; }
/* ready to check (tap mode, something in the circle): the lights glow steadily; nothing flashes */
.mw-pod.is-ready .mw-ship-light, .mw-pod.is-ready .mw-ship-beacon { opacity: 1; }
.mw-pod.is-ready .mw-ship-glow, .mw-pod.is-ready .mw-ship-beacon-glow { opacity: 0.3; }
@keyframes mw-ship-flash { 0% { opacity: 1; } 50% { opacity: 0.15; } 100% { opacity: 0.15; } }
@keyframes mw-ship-glow { 0% { opacity: 0.45; } 50% { opacity: 0; } 100% { opacity: 0; } }

/* ---------------------------------------------------------------- the home map */
.mw-planet { padding: 0; margin: 0; border: 0; background: transparent; border-radius: var(--radius-round); cursor: pointer; }
.mw-planet:focus-visible, .mw-planet-badge:focus-visible { outline: 4px solid var(--mint); outline-offset: 4px; }
.mw-planet-badge { box-sizing: border-box; padding: 0; margin: 0; border-radius: var(--radius-round); background: var(--moon);
  border: 5px solid var(--mint); box-shadow: 0 0 0 10px rgba(127, 217, 196, 0.18); display: flex; align-items: center; justify-content: center;
  line-height: 0; cursor: pointer; }
.mw-planet-badge.is-hop { animation: mw-hop 420ms ease-out; }
.mw-planet-lock { box-sizing: border-box; border-radius: var(--radius-round); background: var(--night-button); border: 4px solid var(--text-3);
  color: var(--text-3); display: flex; align-items: center; justify-content: center; line-height: 0; }
.mw-map-crew { line-height: 0; pointer-events: none; }

/* ---------------------------------------------------------------- tap to start */
.mw-pulse { animation: mw-pulse 2s ease-in-out infinite; }
@keyframes mw-pulse { 0%, 100% { scale: 1; } 50% { scale: 1.06; } }

/* ---------------------------------------------------------------- the grown-ups lock */
.mw-gate { z-index: 50; overflow: visible; }
.mw-gate-ring { position: absolute; left: -13px; top: -13px; width: 64px; height: 64px; pointer-events: none; opacity: 0; }
.mw-gate.is-holding .mw-gate-ring { opacity: 1; transition: opacity 150ms 250ms; }

/* ---------------------------------------------------------------- the grown-ups area */
.mw-grownups { position: absolute; inset: 0; z-index: 100; display: none; background: rgba(15, 18, 54, 0.92); }
.mw-grownups.is-open { display: block; }
.gu-panel { position: absolute; left: 24px; top: 24px; width: 1232px; height: 752px; display: flex; flex-direction: column; padding: 24px 32px 0; }
.gu-head { display: flex; align-items: center; gap: 24px; margin-bottom: 10px; }
.gu-title { margin: 0; }
.gu-tabs { display: flex; gap: 8px; flex: 1; }
.gu-tab { height: 52px; padding: 0 22px; border-radius: 26px; border: 3px solid var(--night-button); background: transparent; color: var(--text-2); cursor: pointer; }
.gu-tab.is-on { background: var(--night-button); color: var(--moon); border-color: var(--mint); }
.gu-btn { min-height: 52px; padding: 0 22px; border-radius: 26px; border: 3px solid var(--mint); background: var(--night-button); color: var(--moon); cursor: pointer; }
.gu-btn:active { transform: translateY(2px); }
.gu-btn.is-on { background: var(--mint); color: var(--numeral); }
.gu-btn:focus-visible, .gu-tab:focus-visible { outline: 4px solid var(--mint); outline-offset: 3px; }
.gu-quiet { border-color: var(--text-3); }
.gu-small { min-height: 44px; margin-bottom: 8px; }
.gu-clip { min-height: 46px; font-size: 19px; padding: 0 16px; }
.gu-chip { width: 52px; height: 52px; min-height: 0; padding: 0; }
.gu-body { flex: 1; overflow-y: auto; touch-action: pan-y; padding: 4px 4px 32px 0; -webkit-overflow-scrolling: touch; }
.gu-h3 { font-size: 22px; line-height: 26px; font-weight: 700; margin: 22px 0 10px; color: var(--moon); }
.gu-p { margin: 0 0 10px; color: var(--text-2); max-width: 1060px; }
.gu-p b { color: var(--moon); }
.gu-lead { color: var(--moon); margin-top: 6px; }
.gu-note { font-size: 17px; line-height: 22px; }
.gu-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.gu-group { color: var(--text-3); margin: 12px 0 6px; }
.gu-table { border-collapse: collapse; width: 100%; max-width: 1120px; margin: 4px 0 12px; }
.gu-table td, .gu-table th { padding: 7px 10px; border-bottom: 1px solid var(--night-button); text-align: left; vertical-align: top; }
.gu-table th { color: var(--text-3); font-weight: 400; }
.gu-table td:first-child { color: var(--text-2); width: 220px; }
.gu-table .ok { color: var(--mint); }
.gu-table .warn { color: var(--peach); }

/* the progress grid (the design system's BondGrid) */
.gu-grid { margin: 6px 0 14px; }
.gu-grid-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.gu-grid-whole { width: 44px; text-align: right; margin-right: 6px; font-size: 28px; line-height: 1; font-weight: 700; color: var(--moon); }
.mw-cell { box-sizing: border-box; height: 44px; min-width: 84px; padding: 0 10px; border-radius: var(--radius-cell);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 17px;
  background: var(--night-button); color: var(--moon); border: 2px solid var(--night-button); }
.mw-cell.is-secure { background: var(--mint); border-color: var(--mint); color: var(--numeral); }
.mw-cell.is-practising { background: var(--night-button); border: 2px dashed var(--peach); color: var(--moon); }
.mw-cell.is-notyet { background: var(--night-raised); border-color: var(--star-empty); color: var(--text-3); }
.mw-cell svg { flex: none; }
.gu-legend { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin: 4px 0 10px; }

/* ---------------------------------------------------------------- the crew (phase 4, 0.4.1) */
.mw-cat { position: relative; line-height: 0; }
.mw-cat-body { position: relative; width: 100%; height: 100%; transform-origin: 50% 80%; }
.mw-cat-body.is-hop { animation: mw-hop 420ms ease-out; }
.mw-badge { position: absolute; }
.mw-map-crew-btn { padding: 0; margin: 0; border: 0; background: transparent; border-radius: 120px; cursor: pointer; }
.mw-map-crew-btn:focus-visible { outline: 4px solid var(--mint); outline-offset: 4px; }
/* the crew screen */
.mw-crew-cat { position: absolute; left: 0; top: 0; z-index: 3; cursor: grab; }
.mw-crew-cat.is-moving { transition: transform 320ms cubic-bezier(.2,.8,.2,1); }
.mw-crew-cat.is-lifted { z-index: 6; }
.mw-crew-cat.is-lifted .mw-cat-body { transform: scale(1.06); filter: drop-shadow(0 18px 10px rgba(0, 0, 0, 0.45)); }
.mw-station { box-sizing: border-box; border-radius: 28px; background: var(--night-raised); border: 3px solid var(--night-button); }
.mw-station-disc { box-sizing: border-box; width: 124px; height: 124px; border-radius: var(--radius-round); background: var(--moon);
  border: 4px dashed var(--mint); display: flex; align-items: center; justify-content: center; line-height: 0; }
.mw-station.is-taken .mw-station-disc { border-style: solid; box-shadow: 0 0 0 10px rgba(127, 217, 196, 0.18); }
.mw-station-spot { position: absolute; left: 0; top: 0; }
.mw-spot-fill { opacity: 0.08; }
.mw-spot-rim { opacity: 0.8; stroke-dasharray: 2 10; }
.mw-station.is-taken .mw-spot-fill { opacity: 0.18; }
.mw-station.is-taken .mw-spot-rim { stroke-dasharray: none; }
/* the job moments: never over the diagram or the asteroid, nothing to tap */
.mw-moments, .mw-moment { pointer-events: none; }
.mw-moment { position: absolute; line-height: 0; }
.mw-peek { overflow: hidden; }
.mw-peek-inner { position: absolute; left: 0; top: 0; transform: translateY(190px); transition: transform 450ms cubic-bezier(.2,.8,.2,1); }
.mw-peek.is-shown .mw-peek-inner { transform: translateY(0); }
.mw-held-scope { position: absolute; transform: rotate(36deg); transform-origin: 43px 98px; }
.mw-moment-pop { opacity: 0; transform: translateY(18px); transition: opacity 300ms ease-out, transform 300ms ease-out; }
.mw-moment-pop.is-shown { opacity: 1; transform: none; }
.mw-spanner { position: absolute; transform-origin: 22% 78%; transform: rotate(-8deg); }   /* held by the ring */
.mw-spanner svg { transform: scaleX(-1); }                                                    /* jaw towards the ship */
.mw-spanner.is-tapping { animation: mw-spanner-tap 800ms ease-in-out 2; }
@keyframes mw-spanner-tap { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(12deg); } }
.mw-star-map { position: absolute; transform: rotate(-8deg); }
.mw-cook-pan { scale: 0; transition: scale 380ms cubic-bezier(.3,1.5,.5,1); }
.mw-cook-pan.is-flipped svg { transform: scaleX(-1); }
.mw-cook-pan.is-shown { scale: 1; }

/* ---------------------------------------------------------------- title banners (0.6.0, TitleBanner)
   The set's or a game's name on a moon plaque, while it is spoken. Above the screens and below the grown-ups lock:
   taps under it do nothing, and the lock still opens the grown-ups area. */
.mw-banner { position: absolute; inset: 0; z-index: 40; display: none; }
.mw-banner.is-up { display: block; }
.mw-banner-card { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 640px 380px;
  opacity: 0; transform: scale(0.88); transition: opacity 260ms ease-out, transform 260ms cubic-bezier(.2,.8,.2,1); }
.mw-banner.is-in .mw-banner-card { opacity: 1; transform: none; }
.mw-banner.is-going .mw-banner-card { opacity: 0; transform: none; }
.mw-banner-row { position: absolute; left: 0; top: 292px; width: 1280px; display: flex; justify-content: center; }
.mw-banner-plaque { display: inline-flex; align-items: center; gap: 22px; padding: 22px 40px 22px 30px; box-sizing: border-box;
  border-radius: 48px; background: var(--moon); border: 8px solid var(--mint); box-shadow: 0 0 0 4px var(--ink), 0 12px 0 4px var(--ink); }
.mw-banner-art { line-height: 0; }
.mw-banner-name { color: var(--numeral); padding-bottom: 8px; white-space: nowrap; }
.mw-banner-spark { position: absolute; width: 28px; height: 28px; line-height: 0; }

/* ---------------------------------------------------------------- turn me sideways */
.mw-sideways { position: fixed; inset: 0; display: none; z-index: 200; background: var(--night); color: var(--moon);
  align-items: center; justify-content: center; flex-direction: column; gap: 24px; font-size: 22px; }
@media (orientation: portrait) { .mw-sideways { display: flex; } }

/* ---------------------------------------------------------------- reduce motion: movement becomes an instant change or a fade */
@media (prefers-reduced-motion: reduce) {
  .mw-mimi.is-moving, .mw-mimi.is-moving .mw-mimi-art, .mw-mimi-art { transition: none !important; }
  .mw-mimi.is-rescued { transition: opacity 400ms ease-in !important; }
  .mw-mimi.is-hop .mw-mimi-art, .mw-mimi-art.is-hop { animation: none; }
  .mw-pulse { animation: none; }
  .mw-planet-badge.is-hop { animation: none; }
  .mw-spark { animation: mw-spark-fade 1200ms ease-out forwards; }
  .mw-circle, .mw-pill { transition: none; }
  .mw-btn--main:active, .mw-btn--play:active, .mw-btn--nav:active { transform: none; }
  .mw-pod.is-celebrating .mw-ship-light, .mw-pod.is-celebrating .mw-ship-beacon { animation: none; opacity: 1; }
  .mw-pod.is-celebrating .mw-ship-glow, .mw-pod.is-celebrating .mw-ship-beacon-glow { animation: none; opacity: 0.3; }
  .mw-cat-body.is-hop { animation: none; }
  .mw-crew-cat.is-moving { transition: none; }
  .mw-peek-inner { transform: none; opacity: 0; transition: opacity 300ms ease-out; }
  .mw-peek.is-shown .mw-peek-inner { transform: none; opacity: 1; }
  .mw-moment-pop { transform: none; }
  .mw-spanner.is-tapping { animation: none; }
  .mw-cook-pan { scale: 1; opacity: 0; transition: opacity 300ms ease-out; }
  .mw-cook-pan.is-shown { opacity: 1; }
  .mw-banner-card, .mw-banner.is-in .mw-banner-card, .mw-banner.is-going .mw-banner-card { transform: none; transition: opacity 260ms ease-out; }
  .mw-numbered.is-popping { animation: mw-arrive 300ms ease-out both; }
  .mw-track { transition: opacity 260ms ease-out; }
  .mw-track.is-away { transform: none; opacity: 0; }
  .mw-number-tile.is-moving, .mw-number-tile-body { transition: none; }
}
@keyframes mw-spark-fade { 0% { opacity: 0; } 20% { opacity: 1; } 55% { opacity: 1; } 100% { opacity: 0; } }

/* MeeMee Rescue's own styles (colour tokens only).
   Numbers mode's lookout (moments.js) peeks up from behind the right-hand end of the number track. It is mirrored so its
   telescope points left, towards the part-whole diagram, as it does at the MeeMee from behind the asteroid in counting
   mode. The window it peeks through keeps its place; the cat and its telescope are mirrored about the window's middle
   (the window is 250 wide), so both stay inside it. The scale property leaves the kit's rise (or, with reduce motion,
   its fade) on transform untouched. */
.rescue-peek-flip .mw-peek-inner { width: 250px; scale: -1 1; transform-origin: 125px 50%; }

/* MeeMee Rockets' own styles. Colours only through tokens: var(--token), or the f-/s-/bg-/c- classes. */

/* ---------------------------------------------------------------- Find: the rockets on the launch pad */
.words-rocket { width: 270px; height: 553px; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer; line-height: 0; }
.words-rocket:focus-visible { outline: 4px solid var(--mint); outline-offset: 6px; border-radius: 28px; }
.words-rocket svg { pointer-events: none; }
.words-rocket-art { position: absolute; overflow: visible; }
.words-rocket .words-fire { display: none; }
.words-rocket.is-lit .words-fire { display: inline; }
.words-panel { position: absolute; display: flex; align-items: center; justify-content: center; pointer-events: none;
  border-radius: 16px; box-sizing: border-box; }
.words-panel-word { font-family: var(--font-andika); font-weight: 700; line-height: 1; color: var(--numeral); padding-bottom: 8px; white-space: nowrap; }
/* the hint: a steady spark ring round the right word (no flashing) */
.words-rocket.is-hint .words-panel { outline: 12px solid var(--spark); outline-offset: 6px; }

/* ---------------------------------------------------------------- Build: the rocket on its side, the tray and the tiles */
.words-ship { position: absolute; transform-origin: 50% 50%; pointer-events: none; }
.words-ship-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.words-part { position: absolute; }
.words-ship .words-fire { display: none; }
.words-ship.is-launch .words-fire { display: inline; }
.words-ship.is-launch { transform: translate(40px, -40px) rotate(-10deg); transition: transform 700ms cubic-bezier(.3, 0, .3, 1); }
.words-ship.is-launch.is-away { transform: translate(1500px, -760px) rotate(-10deg); transition: transform 1300ms cubic-bezier(.5, 0, .9, .5); }
/* the launch lights (LaunchLights card): off (peach-shade) while the word is built; as the engines light, each is on for
   a third of a second and off for two thirds, once a second, its group starting 0, 1/3 or 2/3 of a second in (the game
   sets each light's delay), so the lights chase from the back to the nose. Small lights: within the flash-safety rule. */
.words-lamp-on { opacity: 0; }
.words-ship.is-launch .words-lamp-on { animation: words-lamp 1000ms steps(1, end) infinite; }
@keyframes words-lamp { 0% { opacity: 1; } 33.333% { opacity: 0; } 100% { opacity: 0; } }

.words-tray { position: absolute; box-sizing: border-box; border-radius: 26px; border: 4.5px solid var(--ink); overflow: hidden;
  background: linear-gradient(to bottom, var(--asteroid-light) 0, var(--asteroid-light) 8%, var(--asteroid) 8%, var(--asteroid) 86%, var(--asteroid-crater) 86%); }
.words-tray::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 12px;
  background: repeating-linear-gradient(-50deg, var(--asteroid-deep) 0, var(--asteroid-deep) 12px, var(--peach) 12px, var(--peach) 20px); }
.words-tray-light { position: absolute; left: 13px; bottom: 11px; width: 10px; height: 10px; border-radius: var(--radius-round);
  background: var(--spark); border: 2px solid var(--ink); }
.words-tray-light--r { left: auto; right: 13px; }

.words-tile { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
.words-tile.is-moving { transition: transform 260ms cubic-bezier(.2, .8, .2, 1); }
.words-tile.is-lifted { z-index: 5; }
.words-tile-body { position: relative; width: 100%; height: 100%; transition: transform 120ms ease-out; }
.words-tile.is-lifted .words-tile-body { transform: scale(1.12); filter: drop-shadow(var(--lift)); }
.words-tile-body svg { position: absolute; left: 0; top: 0; }
.words-tile-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 8px;
  font-family: var(--font-andika); font-weight: 700; font-size: 60px; line-height: 1; color: var(--numeral); white-space: nowrap; }
/* the tricky part, marked the class's way (style B, chosen 10 October): the letters in darker peach */
.words-tile.is-tricky .words-tile-text { color: var(--peach-dark); }
.words-tile .words-glow, .words-tile .words-set { display: none; }
.words-tile.is-glow .words-glow { display: inline; }
.words-tile.is-set .words-loose { display: none; }
.words-tile.is-set .words-set { display: inline; }

/* ---------------------------------------------------------------- the end of a round: the launched rockets */
.words-end-rockets { display: flex; gap: 24px; line-height: 0; }
.words-end-rocket { width: 100px; height: 140px; animation: words-rise 900ms cubic-bezier(.2, .8, .2, 1) both; }
@keyframes words-rise { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }

/* ---------------------------------------------------------------- the crew's job moments (moments.js; the kit's moment styles do the rest) */
.words-moment-flip { position: absolute; transform: scaleX(-1); }       /* the board's cats facing left */
.words-moment-held { line-height: 0; }
.words-moment-flip .words-moment-held { position: absolute; }
.words-spanner { line-height: 0; }                                       /* turned as on the board (the game sets it) */
.words-spanner-swing { transform-origin: 74% 74%; }                      /* held by its ring */
.words-spanner-swing.is-tapping { animation: words-spanner-tap 1000ms ease-in-out 2; }
@keyframes words-spanner-tap { 0%, 100% { transform: none; } 50% { transform: rotate(-14deg); } }

/* ---------------------------------------------------------------- grown-ups: the Words tab */
.words-week { border-color: var(--night-button); background: transparent; }
.words-week.is-on { background: var(--mint); border-color: var(--mint); color: var(--numeral); }
.words-grid { display: grid; grid-template-columns: 158px 1fr; column-gap: 0; row-gap: 12px; align-items: start; margin: 14px 0 12px; max-width: 1120px; }
.words-grid-label { color: var(--text-2); padding-top: 10px; }
.words-grid-cells { display: flex; flex-wrap: wrap; gap: 10px; }
.words-cell { box-sizing: border-box; height: 44px; min-width: 92px; padding: 0 14px; border-radius: var(--radius-cell);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 19px; font-weight: 700;
  background: var(--night-button); color: var(--moon); border: 2px dashed var(--night-button); }
.words-cell svg { flex: none; }
.words-tag { font-size: 14px; font-weight: 700; }
.words-cell.is-notyet { background: var(--night-raised); border: 2px solid var(--star-empty); color: var(--text-3); }
.words-cell.is-tiles { border-color: var(--peach); }
.words-cell.is-tiles .words-tag { color: var(--peach); }
.words-cell.is-letters { border-color: var(--mint); }
.words-cell.is-letters .words-tag { color: var(--mint); }
.words-cell.is-harder { border-color: var(--spark); }
.words-cell.is-harder .words-tag { color: var(--spark); }
.words-cell.is-secure { background: var(--mint); border: 2px solid var(--mint); color: var(--numeral); }
.words-legend { display: flex; flex-wrap: wrap; gap: 18px; margin: 6px 0 12px; }

/* ---------------------------------------------------------------- reduce motion: no movement, a fade or an instant change */
@media (prefers-reduced-motion: reduce) {
  .words-tile.is-moving, .words-tile-body { transition: none; }
  .words-ship.is-launch { transform: none; transition: none; }
  .words-ship.is-launch.is-away { transform: none; opacity: 0; transition: opacity 500ms ease-in; }
  .words-end-rocket { animation: words-fade 600ms ease-out both; }
  .words-ship.is-launch .words-lamp-on { animation: none; opacity: 1; }   /* every light lit and steady */
  .words-spanner-swing.is-tapping { animation: none; }
}
@keyframes words-fade { from { opacity: 0; } to { opacity: 1; } }

</style>
