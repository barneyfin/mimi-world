/* MeeMee World kit styles. Colours, sizes and type come only from tokens (generated from design/gen_tokens.py). */

/* ---------------------------------------------------------------- page and stage */
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--night);
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
body { position: fixed; inset: 0; touch-action: none; font-family: var(--font-andika); color: var(--moon); }
button { font-family: var(--font-andika); }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; overflow: hidden; background: var(--night); }
.mw-screen { position: absolute; inset: 0; display: none; }
.mw-screen.is-shown { display: block; }
.mw-fill { width: 1280px; height: 800px; pointer-events: none; }

/* ---------------------------------------------------------------- from the design system (components/bundle.css) */
.mw-abs { position: absolute; }
.mw-layer { position: absolute; left: 0; top: 0; }

.mw-circle { position: absolute; box-sizing: border-box; border-radius: var(--radius-round);
  background: var(--moon); border: var(--rim) solid var(--mint); box-shadow: var(--halo-mint); }
.mw-circle--whole { width: var(--circle-whole); height: var(--circle-whole);
  display: flex; align-items: center; justify-content: center; color: var(--numeral); }
.mw-circle--part { width: var(--circle-part); height: var(--circle-part); }
.mw-circle.is-waiting { background: var(--moon-dim); border-style: dashed; box-shadow: none; }
.mw-circle.is-success { box-shadow: var(--ring-success); }

.mw-pill { position: absolute; box-sizing: border-box; width: var(--pill-width); height: var(--pill-height);
  border-radius: var(--radius-pill); background: var(--moon); border: 5px solid var(--mint);
  display: flex; align-items: center; justify-content: center; color: var(--numeral); box-shadow: var(--halo-mint); }
.mw-pill.is-waiting { background: var(--moon-dim); border-style: dashed; box-shadow: none; }
.mw-pill.is-success { box-shadow: var(--ring-success); }

.mw-equation { position: absolute; display: flex; align-items: center; justify-content: center; gap: 22px; color: var(--moon); }
.mw-equation .op { color: var(--peach); }

.mw-btn { padding: 0; border: none; border-radius: var(--radius-round); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; }
.mw-btn:focus-visible { outline: 4px solid var(--mint); outline-offset: 4px; }
.mw-btn--main { width: var(--button-main); height: var(--button-main); background: var(--peach); color: var(--numeral); box-shadow: var(--press-peach); }
.mw-btn--play { width: var(--button-play); height: var(--button-play); background: var(--peach); color: var(--numeral); box-shadow: var(--press-peach); }
.mw-btn--nav { width: var(--button-nav); height: var(--button-nav); background: var(--night-button); color: var(--moon);
  border: 5px solid var(--mint); box-shadow: var(--press-ink); }
.mw-btn--grownups { width: var(--button-grownups); height: var(--button-grownups); background: var(--night); color: var(--text-3); border: 3px solid var(--text-3); }
.mw-btn--main:active, .mw-btn--play:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--peach-dark); }
.mw-btn--nav:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }

.mw-stars { position: absolute; display: flex; gap: var(--space-s); line-height: 0; }
.mw-panel { background: var(--night-raised); border-radius: var(--radius-panel); box-sizing: border-box; color: var(--moon); }
.mw-chip { box-sizing: border-box; min-width: 48px; height: 48px; border-radius: var(--radius-round); display: inline-flex;
  align-items: center; justify-content: center; border: 3px solid var(--mint); color: var(--moon); background: transparent; }
.mw-chip.is-on { background: var(--mint); color: var(--numeral); }
.mw-caption { color: var(--text-2); }

/* ---------------------------------------------------------------- the diagram in play */
.mw-circle, .mw-pill { transition: box-shadow 450ms cubic-bezier(.2,.8,.2,1), background-color 260ms; }
.mw-circle.is-hinting { box-shadow: 0 0 0 14px rgba(127, 217, 196, 0.22); }
.mw-equation { opacity: 0; transition: opacity 300ms ease-out; pointer-events: none; }
.mw-equation.is-shown { opacity: 1; }

/* ---------------------------------------------------------------- the MeeMee (counters) */
.mw-counters .mw-mimi, .mw-mimi { position: absolute; left: 0; top: 0; width: var(--mimi-grab); height: var(--mimi-grab);
  margin: -60px 0 0 -60px; display: flex; align-items: center; justify-content: center; line-height: 0;
  pointer-events: none; will-change: transform; }
.mw-mimi-art { transition: transform 120ms ease-out; transform-origin: 50% 50%; overflow: visible; }
.mw-mimi.is-moving { transition: transform 260ms cubic-bezier(.2,.8,.2,1); }
.mw-mimi.is-moving .mw-mimi-art { transition: transform 260ms cubic-bezier(.2,.8,.2,1); }
.mw-mimi.is-lifted { z-index: 5; }
.mw-mimi.is-lifted .mw-mimi-art { filter: drop-shadow(0 14px 8px rgba(0,0,0,0.45)); }
.mw-mimi.is-arriving { animation: mw-arrive 360ms ease-out both; }
.mw-mimi.is-rescued { transition: transform 600ms cubic-bezier(.4,0,.6,1), opacity 600ms ease-in; opacity: 0; }
.mw-mimi.is-rescued .mw-mimi-art { transition: transform 600ms cubic-bezier(.4,0,.6,1); }
.mw-mimi.is-hop .mw-mimi-art, .mw-mimi-art.is-hop { animation: mw-hop 420ms ease-out; }
@keyframes mw-arrive { from { opacity: 0; } to { opacity: 1; } }
@keyframes mw-hop { 0% { translate: 0 0; } 40% { translate: 0 -18px; } 100% { translate: 0 0; } }
.mw-start-mimi { display: flex; gap: 16px; line-height: 0; }

/* hint ghosts: where the missing MeeMee would sit */
.mw-ghost { position: absolute; box-sizing: border-box; border-radius: var(--radius-round);
  border: 3px dashed var(--mimi); opacity: 0.6; transition: background-color 200ms, opacity 200ms; }
.mw-ghost.is-lit { background: rgba(140, 124, 214, 0.35); opacity: 1; }

/* sparkles: grow in 300 ms, fade by 1.2 s; once, never blinking */
.mw-spark { position: absolute; pointer-events: none; animation: mw-spark 1200ms ease-out forwards; }
@keyframes mw-spark { 0% { transform: scale(0.2); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 55% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

/* ---------------------------------------------------------------- Scruffles's pod (a button in the game) */
.mw-pod { position: absolute; padding: 0; margin: 0; border: 0; background: none; line-height: 0; cursor: pointer; }
.mw-pod:disabled { cursor: default; }
/* the picture inside a button never takes the tap, so changing Scruffles's face mid-tap can't swallow it */
.mw-pod svg, .mw-btn svg, .gu-btn svg { pointer-events: none; }
.mw-pod:focus-visible { outline: 4px solid var(--mint); outline-offset: 4px; border-radius: 40px; }

/* the rescue ship's lights: unlit until a right answer, then about 4 s of flashing (6 × 0.66 s; the beacon 4 × 1 s).
   Only the small lights flash, each on and off 1.5 times a second, in three groups chasing round the rim. */
.mw-ship-light, .mw-ship-glow, .mw-ship-beacon, .mw-ship-beacon-glow { opacity: 0; }
.mw-pod.is-celebrating .mw-ship-light, .mw-pod.is-celebrating .mw-ship-beacon { animation: mw-ship-flash 0.66s steps(1, end) 6; }
.mw-pod.is-celebrating .mw-ship-glow, .mw-pod.is-celebrating .mw-ship-beacon-glow { animation: mw-ship-glow 0.66s steps(1, end) 6; }
.mw-pod.is-celebrating .mw-ship-beacon, .mw-pod.is-celebrating .mw-ship-beacon-glow { animation-duration: 1s; animation-iteration-count: 4; }
.mw-pod.is-celebrating .mw-ship-p1 { animation-delay: -0.22s; }
.mw-pod.is-celebrating .mw-ship-p2 { animation-delay: -0.44s; }
/* ready to check (tap mode, something in the circle): the lights glow steadily; nothing flashes */
.mw-pod.is-ready .mw-ship-light, .mw-pod.is-ready .mw-ship-beacon { opacity: 1; }
.mw-pod.is-ready .mw-ship-glow, .mw-pod.is-ready .mw-ship-beacon-glow { opacity: 0.3; }
@keyframes mw-ship-flash { 0% { opacity: 1; } 50% { opacity: 0.15; } 100% { opacity: 0.15; } }
@keyframes mw-ship-glow { 0% { opacity: 0.45; } 50% { opacity: 0; } 100% { opacity: 0; } }

/* ---------------------------------------------------------------- tap to start */
.mw-pulse { animation: mw-pulse 2s ease-in-out infinite; }
@keyframes mw-pulse { 0%, 100% { scale: 1; } 50% { scale: 1.06; } }

/* ---------------------------------------------------------------- the grown-ups lock */
.mw-gate { z-index: 50; overflow: visible; }
.mw-gate-ring { position: absolute; left: -13px; top: -13px; width: 64px; height: 64px; pointer-events: none; opacity: 0; }
.mw-gate.is-holding .mw-gate-ring { opacity: 1; transition: opacity 150ms 250ms; }

/* ---------------------------------------------------------------- the grown-ups area */
.mw-grownups { position: absolute; inset: 0; z-index: 100; display: none; background: rgba(15, 18, 54, 0.92); }
.mw-grownups.is-open { display: block; }
.gu-panel { position: absolute; left: 24px; top: 24px; width: 1232px; height: 752px; display: flex; flex-direction: column; padding: 24px 32px 0; }
.gu-head { display: flex; align-items: center; gap: 24px; margin-bottom: 10px; }
.gu-title { margin: 0; }
.gu-tabs { display: flex; gap: 8px; flex: 1; }
.gu-tab { height: 52px; padding: 0 22px; border-radius: 26px; border: 3px solid var(--night-button); background: transparent; color: var(--text-2); cursor: pointer; }
.gu-tab.is-on { background: var(--night-button); color: var(--moon); border-color: var(--mint); }
.gu-btn { min-height: 52px; padding: 0 22px; border-radius: 26px; border: 3px solid var(--mint); background: var(--night-button); color: var(--moon); cursor: pointer; }
.gu-btn:active { transform: translateY(2px); }
.gu-btn.is-on { background: var(--mint); color: var(--numeral); }
.gu-btn:focus-visible, .gu-tab:focus-visible { outline: 4px solid var(--mint); outline-offset: 3px; }
.gu-quiet { border-color: var(--text-3); }
.gu-small { min-height: 44px; margin-bottom: 8px; }
.gu-clip { min-height: 46px; font-size: 19px; padding: 0 16px; }
.gu-chip { width: 52px; height: 52px; min-height: 0; padding: 0; }
.gu-body { flex: 1; overflow-y: auto; touch-action: pan-y; padding: 4px 4px 32px 0; -webkit-overflow-scrolling: touch; }
.gu-h3 { font-size: 22px; line-height: 26px; font-weight: 700; margin: 22px 0 10px; color: var(--moon); }
.gu-p { margin: 0 0 10px; color: var(--text-2); max-width: 1060px; }
.gu-p b { color: var(--moon); }
.gu-lead { color: var(--moon); margin-top: 6px; }
.gu-note { font-size: 17px; line-height: 22px; }
.gu-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.gu-group { color: var(--text-3); margin: 12px 0 6px; }
.gu-table { border-collapse: collapse; width: 100%; max-width: 1120px; margin: 4px 0 12px; }
.gu-table td, .gu-table th { padding: 7px 10px; border-bottom: 1px solid var(--night-button); text-align: left; vertical-align: top; }
.gu-table th { color: var(--text-3); font-weight: 400; }
.gu-table td:first-child { color: var(--text-2); width: 220px; }
.gu-table .ok { color: var(--mint); }
.gu-table .warn { color: var(--peach); }

/* ---------------------------------------------------------------- turn me sideways */
.mw-sideways { position: fixed; inset: 0; display: none; z-index: 200; background: var(--night); color: var(--moon);
  align-items: center; justify-content: center; flex-direction: column; gap: 24px; font-size: 22px; }
@media (orientation: portrait) { .mw-sideways { display: flex; } }

/* ---------------------------------------------------------------- reduce motion: movement becomes an instant change or a fade */
@media (prefers-reduced-motion: reduce) {
  .mw-mimi.is-moving, .mw-mimi.is-moving .mw-mimi-art, .mw-mimi-art { transition: none !important; }
  .mw-mimi.is-rescued { transition: opacity 400ms ease-in !important; }
  .mw-mimi.is-hop .mw-mimi-art, .mw-mimi-art.is-hop { animation: none; }
  .mw-pulse { animation: none; }
  .mw-spark { animation: mw-spark-fade 1200ms ease-out forwards; }
  .mw-circle, .mw-pill { transition: none; }
  .mw-btn--main:active, .mw-btn--play:active, .mw-btn--nav:active { transform: none; }
  .mw-pod.is-celebrating .mw-ship-light, .mw-pod.is-celebrating .mw-ship-beacon { animation: none; opacity: 1; }
  .mw-pod.is-celebrating .mw-ship-glow, .mw-pod.is-celebrating .mw-ship-beacon-glow { animation: none; opacity: 0.3; }
}
@keyframes mw-spark-fade { 0% { opacity: 0; } 20% { opacity: 1; } 55% { opacity: 1; } 100% { opacity: 0; } }

</style>

<script>
/* MeeMee World kit: core.
   The 1280x800 stage and its scaling, what each tablet remembers, and small helpers.
   Every other kit file adds to window.MW. */
(function () {
  'use strict';
  const MW = window.MW = window.MW || {};

  // ---------------------------------------------------------------- the stage
  // Every screen is drawn on a 1280x800 stage and scaled to fit (0.82 on the Fire, 1.0 on the Doogee).
  const stage = MW.stage = { el: null, W: 1280, H: 800, scale: 1, offX: 0, offY: 0 };
  stage.fit = function () {
    const w = window.innerWidth, h = window.innerHeight;
    stage.scale = Math.min(w / stage.W, h / stage.H);
    stage.offX = (w - stage.W * stage.scale) / 2;
    stage.offY = (h - stage.H * stage.scale) / 2;
    if (stage.el) stage.el.style.transform = 'translate(' + stage.offX + 'px,' + stage.offY + 'px) scale(' + stage.scale + ')';
  };
  stage.toStage = function (clientX, clientY) {
    return { x: (clientX - stage.offX) / stage.scale, y: (clientY - stage.offY) / stage.scale };
  };
  stage.init = function (el) {
    stage.el = el;
    stage.fit();
    window.addEventListener('resize', stage.fit);
    window.addEventListener('orientationchange', function () { setTimeout(stage.fit, 250); });
  };

  // ---------------------------------------------------------------- reduce motion
  const rm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  MW.reduceMotion = !!(rm && rm.matches);
  if (rm && rm.addEventListener) rm.addEventListener('change', function () { MW.reduceMotion = rm.matches; });

  // ---------------------------------------------------------------- what this tablet remembers
  // One localStorage entry. Browser storage can be cleared, so this is a convenience, not a record.
  const KEY = 'mimi-world';
  const DEFAULTS = { v: 1, music: true, settings: { check: 'tap', wholes: [2, 3, 4, 5, 6, 7, 8, 9, 10] }, answers: [] };
  let data = null;
  function load() {
    if (data) return data;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
    data = JSON.parse(JSON.stringify(DEFAULTS));
    if (saved && saved.v === 1) {
      if (typeof saved.music === 'boolean') data.music = saved.music;
      if (saved.settings) Object.assign(data.settings, saved.settings);
      if (Array.isArray(saved.answers)) data.answers = saved.answers;
    }
    return data;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); MW.store.ok = true; } catch (e) { MW.store.ok = false; }
  }
  MW.store = {
    ok: null,
    get: function (k) { return load()[k]; },
    setting: function (k, v) {
      const s = load().settings;
      if (v === undefined) return s[k];
      s[k] = v; save(); return v;
    },
    setMusic: function (on) { load().music = !!on; save(); },
    recordAnswer: function (a) {
      const d = load();
      d.answers.push(a);
      if (d.answers.length > 3000) d.answers.splice(0, d.answers.length - 3000);
      save();
    },
    clear: function () {
      const d = load();
      d.answers = [];
      save();
    },
    bytes: function () { try { return (localStorage.getItem(KEY) || '').length; } catch (e) { return 0; } },
    check: function () {
      try {
        localStorage.setItem(KEY + '-test', '1');
        const ok = localStorage.getItem(KEY + '-test') === '1';
        localStorage.removeItem(KEY + '-test');
        MW.store.ok = ok;
      } catch (e) { MW.store.ok = false; }
      return MW.store.ok;
    }
  };

  // ---------------------------------------------------------------- helpers
  MW.$ = function (id) { return document.getElementById(id); };
  MW.make = function (tag, cls, attrs, html) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (attrs) Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    if (html !== undefined) el.innerHTML = html;
    return el;
  };
  // A tap on a button the player uses. Detected from the finger lifting on the button rather than from "click",
  // which browsers sometimes swallow right after a drag. The keyboard still works (Enter or Space).
  // Lifting the finger counts as a user gesture, so full screen and sound can start from here.
  MW.onTap = function (el, fn) {
    let down = null;
    el.addEventListener('pointerdown', function (e) {
      if (e.button > 0) return;
      down = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
    });
    el.addEventListener('pointerup', function (e) {
      if (!down || e.pointerId !== down.id) return;
      const d = down; down = null;
      if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 40 || performance.now() - d.t > 1500) return;
      const r = el.getBoundingClientRect();
      if (e.clientX < r.left - 8 || e.clientX > r.right + 8 || e.clientY < r.top - 8 || e.clientY > r.bottom + 8) return;
      if (el.disabled) return;
      fn(e);
    });
    el.addEventListener('pointercancel', function () { down = null; });
    el.addEventListener('click', function (e) { if (e.detail === 0 && !el.disabled) fn(e); });
  };
  // A copy of a drawing. Its ids (clip paths) get a number of their own, so the same drawing can be on the page twice.
  let artCopies = 0;
  MW.art = function (name) {
    const t = document.getElementById('art-' + name);
    if (!t) throw new Error('No art called ' + name);
    const el = t.content.firstElementChild.cloneNode(true);
    const named = el.querySelectorAll('[id]');
    if (named.length) {
      const n = ++artCopies, map = {};
      Array.prototype.forEach.call(named, function (e) { map[e.id] = e.id + '-' + n; e.id = map[e.id]; });
      Array.prototype.forEach.call(el.querySelectorAll('[clip-path]'), function (e) {
        const m = /^url\(#([^)]+)\)$/.exec(e.getAttribute('clip-path'));
        if (m && map[m[1]]) e.setAttribute('clip-path', 'url(#' + map[m[1]] + ')');
      });
    }
    return el;
  };
  MW.wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  MW.pick = function (list) { return list[Math.floor(Math.random() * list.length)]; };
  MW.shuffle = function (list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  MW.esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  };

  // A short log of what happened, read by the tests and the grown-ups checks.
  MW.events = [];
  MW.log = function (type, detail) {
    MW.events.push({ t: Math.round(performance.now()), type: type, detail: detail });
    if (MW.events.length > 800) MW.events.splice(0, 200);
  };
})();

/* MeeMee World kit: sound.
   Voice lines built from Barney's recorded pieces, sound effects, and the looping music that dips under speech.
   All files are at one loudness reference (-20 LUFS, made by tools/make_audio.py), so mixing is plain gains.

   Browsers only allow sound after a tap: call MW.audio.unlock() from the first tap (TapToStart does). */
(function () {
  'use strict';
  const MW = window.MW;
  const A = MW.audio = {};
  const CONFIG = A.config = {
    base: 'audio/',
    pieceGap: 0.03,        // seconds between pieces inside a sentence ("three" "and" "four")
    sentenceGap: 0.35,     // seconds between sentences
    musicDb: -12,          // music under everything
    musicDuckDb: -22,      // music while a line is spoken
    musicFadeIn: 1.5,
    musicRate: 32000       // music is decoded at 32 kHz mono to keep memory low on the Fire (about 20 MB)
  };
  const manifest = window.MW_AUDIO || { voice: {}, effects: {}, music: null };
  A.manifest = manifest;

  let ctx = null, voiceBus = null, sfxBus = null, musicUser = null, musicDuck = null;
  const buffers = {};
  const waiting = {};
  const failed = [];
  let unlocked = false;

  function dbToGain(db) { return Math.pow(10, db / 20); }

  // ---------------------------------------------------------------- loading and decoding
  // Files are fetched and decoded straight away (before the first tap) in offline contexts,
  // which browsers allow without a tap. The decoded buffers then play in the real context.
  const dec = {};
  function decoder(rate) {
    if (!dec[rate]) {
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      dec[rate] = new OAC(1, 1, rate);
    }
    return dec[rate];
  }
  function decode(bytes, rate) {
    return new Promise(function (resolve, reject) {
      const p = decoder(rate).decodeAudioData(bytes, resolve, reject);
      if (p && p.catch) p.catch(reject);
    });
  }
  let queue = Promise.resolve();
  A.load = function (key) {
    if (buffers[key]) return Promise.resolve(buffers[key]);
    if (waiting[key]) return waiting[key];
    const rate = key === 'music' ? CONFIG.musicRate : 44100;
    const bytes = fetch(CONFIG.base + key + '.mp3').then(function (r) {
      if (!r.ok) throw new Error(r.status + ' for ' + key);
      return r.arrayBuffer();
    });
    // decode one file at a time so the Fire stays smooth
    waiting[key] = queue = queue.then(function () { return bytes; }).then(function (b) { return decode(b, rate); })
      .then(function (buf) { buffers[key] = buf; return buf; })
      .catch(function (err) { failed.push(key); MW.log('audio-fail', key + ': ' + err); delete waiting[key]; return null; });
    return waiting[key];
  };
  A.ready = function (keys) { return Promise.all(keys.map(A.load)); };
  A.preloadAll = function () {
    const keys = Object.keys(manifest.effects || {}).map(function (k) { return 'sfx/' + k; })
      .concat(Object.keys(manifest.voice || {}).map(function (k) { return 'voice/' + k; }));
    const all = A.ready(keys);
    if (manifest.music) all.then(function () { return A.load('music'); }).then(function () { if (unlocked) A.music.start(); });
    return all;
  };
  A.status = function () {
    const total = Object.keys(manifest.voice || {}).length + Object.keys(manifest.effects || {}).length + (manifest.music ? 1 : 0);
    return { state: ctx ? ctx.state : 'not started', rate: ctx ? ctx.sampleRate : null,
      decoded: Object.keys(buffers).length, total: total, failed: failed.slice() };
  };
  A.has = function (key) { return !!buffers[key]; };

  // ---------------------------------------------------------------- the first tap
  A.unlock = function () {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return 'no web audio';
    if (!ctx) {
      try { ctx = new AC(); } catch (e) { MW.log('audio-fail', 'context: ' + e.message); return 'failed'; }
      voiceBus = ctx.createGain(); voiceBus.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.connect(ctx.destination);
      musicDuck = ctx.createGain(); musicDuck.gain.value = dbToGain(CONFIG.musicDb); musicDuck.connect(ctx.destination);
      musicUser = ctx.createGain(); musicUser.gain.value = 0; musicUser.connect(musicDuck);
    }
    if (ctx.state === 'suspended') { const p = ctx.resume(); if (p && p.catch) p.catch(function () {}); }
    if (!unlocked) {
      unlocked = true;
      if (buffers.music) A.music.start();
    }
    return ctx.state;
  };
  A.running = function () { return !!ctx && ctx.state === 'running'; };
  A.now = function () { return ctx ? ctx.currentTime : 0; };

  // Pause sound when the tablet hides the page; carry on when it comes back.
  document.addEventListener('visibilitychange', function () {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend(); } else if (unlocked) { ctx.resume(); }
  });
  // Some tablets suspend sound after the screen sleeps: any tap wakes it.
  window.addEventListener('pointerdown', function () { if (unlocked && ctx && ctx.state === 'suspended') ctx.resume(); }, true);

  // ---------------------------------------------------------------- voice
  // A line is a list of sentences; a sentence is a list of clip ids.
  // say([['q-lets-make', 'num-end-7'], ['q-weve-got', 'num-end-3'], ['q-how-many-more']])
  const speech = { token: 0, sources: [], resolve: null, endsAt: 0, timer: 0 };
  A.say = function (sentences, opts) {
    opts = opts || {};
    A.hush();
    const token = speech.token;
    const ids = [].concat.apply([], sentences);
    MW.log('say', ids.join(' '));
    return A.ready(ids.map(function (id) { return 'voice/' + id; })).then(function () {
      if (token !== speech.token) return false;
      if (!A.running()) return false;
      const missing = ids.filter(function (id) { return !buffers['voice/' + id]; });
      if (missing.length) { MW.log('audio-fail', 'missing ' + missing.join(', ')); return false; }
      const start = ctx.currentTime + 0.06;
      let t = start;
      const timeline = [];
      sentences.forEach(function (sent, si) {
        if (si > 0) t += CONFIG.sentenceGap;
        sent.forEach(function (id, pi) {
          if (pi > 0) t += CONFIG.pieceGap;
          const b = buffers['voice/' + id];
          const s = ctx.createBufferSource();
          s.buffer = b; s.connect(voiceBus); s.start(t);
          speech.sources.push(s);
          timeline.push({ id: id, at: t - start, dur: b.duration });
          t += b.duration;
        });
      });
      speech.endsAt = t;
      duck(true, start);
      if (opts.onStart) opts.onStart(timeline);
      return new Promise(function (resolve) {
        speech.resolve = resolve;
        const finish = function () {
          if (token !== speech.token || !speech.resolve) return;
          speech.resolve = null; speech.sources = [];
          clearTimeout(speech.timer);
          duck(false);
          resolve(true);
        };
        speech.sources[speech.sources.length - 1].onended = finish;
        // In case a browser never fires onended: check the audio clock (which stops while the tablet sleeps).
        const backstop = function () {
          if (token !== speech.token || !speech.resolve) return;
          if (ctx.state === 'running' && ctx.currentTime >= t + 0.3) finish();
          else speech.timer = setTimeout(backstop, 500);
        };
        speech.timer = setTimeout(backstop, (t - ctx.currentTime) * 1000 + 600);
      });
    });
  };
  A.hush = function () {
    speech.token++;
    speech.sources.forEach(function (s) { try { s.onended = null; s.stop(); } catch (e) {} });
    speech.sources = [];
    clearTimeout(speech.timer);
    if (ctx) duck(false);
    if (speech.resolve) { const r = speech.resolve; speech.resolve = null; r(false); }
  };
  A.speaking = function () { return !!speech.resolve; };
  // How long a line will take, in seconds (for timing pictures to the voice).
  A.lengthOf = function (sentences) {
    let t = 0;
    sentences.forEach(function (sent, si) {
      if (si > 0) t += CONFIG.sentenceGap;
      sent.forEach(function (id, pi) {
        if (pi > 0) t += CONFIG.pieceGap;
        const b = buffers['voice/' + id];
        t += b ? b.duration : ((manifest.voice[id] || {}).dur || 0.8);
      });
    });
    return t;
  };

  function duck(down, at) {
    if (!musicDuck) return;
    const g = musicDuck.gain, now = ctx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    if (down) g.setTargetAtTime(dbToGain(CONFIG.musicDuckDb), Math.max(now, (at || now) - 0.1), 0.04);
    else g.setTargetAtTime(dbToGain(CONFIG.musicDb), now + 0.15, 0.25);
  }

  // ---------------------------------------------------------------- effects
  A.sfx = function (name) {
    const b = buffers['sfx/' + name];
    MW.log('sfx', name);
    if (!b || !A.running()) return 0;
    const s = ctx.createBufferSource();
    s.buffer = b; s.connect(sfxBus); s.start();
    return b.duration;
  };

  // ---------------------------------------------------------------- music
  // "Paws in the Milky Way" loops: each copy's last 1.5 s fades (baked into the file) while the next copy starts.
  const music = { sources: [], next: 0, timer: 0, playing: false };
  A.music = {
    isOn: function () { return MW.store.get('music') !== false; },
    setOn: function (on) {
      MW.store.setMusic(on);
      MW.log('music', on ? 'on' : 'off');
      if (on) A.music.start(); else A.music.stop();
      document.dispatchEvent(new CustomEvent('mw-music', { detail: on }));
    },
    start: function (offset) {
      if (!A.music.isOn() || !ctx || !buffers.music) return false;
      if (music.playing && offset === undefined) return true;
      stopSources(0);
      const buf = buffers.music;
      const fade = (manifest.music && manifest.music.fade) || 1.5;
      let t = ctx.currentTime + 0.05, off = offset || 0;
      const plan = function () {
        const s = ctx.createBufferSource();
        s.buffer = buf; s.connect(musicUser); s.start(t, off);
        const end = t + (buf.duration - off);
        music.sources.push({ s: s, end: end });
        t = end - fade; off = 0;
        music.next = t;
      };
      plan(); plan();
      clearInterval(music.timer);
      music.timer = setInterval(function () {
        if (!ctx) return;
        music.sources = music.sources.filter(function (x) { return x.end > ctx.currentTime; });
        if (music.next - ctx.currentTime < 40) plan();
      }, 4000);
      const g = musicUser.gain, now = ctx.currentTime;
      g.cancelScheduledValues(now); g.setValueAtTime(offset ? 1 : 0, now);
      if (!offset) g.linearRampToValueAtTime(1, now + CONFIG.musicFadeIn);
      music.playing = true;
      MW.log('music', 'start ' + (offset || 0).toFixed(1));
      return true;
    },
    stop: function () {
      if (!ctx) return;
      const g = musicUser.gain, now = ctx.currentTime;
      g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(0, now + 0.4);
      stopSources(0.45);
      music.playing = false;
    },
    // For the grown-ups check: start 6 seconds before a loop join.
    jumpToJoin: function () {
      if (!buffers.music) return false;
      const fade = (manifest.music && manifest.music.fade) || 1.5;
      return A.music.start(Math.max(0, buffers.music.duration - fade - 6));
    },
    playing: function () { return music.playing; },
    level: function () { return musicUser && musicDuck ? musicUser.gain.value * musicDuck.gain.value : 0; }
  };
  function stopSources(after) {
    clearInterval(music.timer);
    const when = ctx ? ctx.currentTime + after : 0;
    music.sources.forEach(function (x) { try { x.s.stop(when); } catch (e) {} });
    music.sources = [];
  }
})();

/* MeeMee World kit: counters and dragging.
   A counter (a MeeMee) is drawn at 80 stage px inside an invisible 120 px grab circle.
   One finger drags at a time; where grab circles overlap, the counter nearest the finger is picked up. */
(function () {
  'use strict';
  const MW = window.MW;
  const GRAB_R = 60;          // half of mimi-grab (120)
  const BASE = 80;            // mimi-size

  // ---------------------------------------------------------------- counters
  MW.counter = function (layer, opts) {
    opts = opts || {};
    const el = MW.make('div', 'mw-mimi' + (opts.fixed ? ' is-fixed' : ''), { role: 'img', 'aria-label': 'MeeMee' });
    const art = MW.art('mimi');
    el.appendChild(art);
    layer.appendChild(el);
    const c = { el: el, art: art, x: 0, y: 0, size: BASE, draggable: !opts.fixed, home: null, where: null, data: {} };
    c.moveTo = function (x, y, size, animate) {
      c.x = x; c.y = y;
      if (size) c.size = size;
      el.classList.toggle('is-moving', !!animate && !MW.reduceMotion);
      el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      art.style.transform = 'scale(' + (c.size / BASE * (c.lifted ? 1.12 : 1)) + ')';
    };
    c.lift = function (on) { c.lifted = !!on; el.classList.toggle('is-lifted', !!on); };
    c.remove = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    c.moveTo(opts.x || 0, opts.y || 0, opts.size || BASE, false);
    return c;
  };

  // Counting patterns (design system: CountingPatterns): offsets from a circle's centre, and the MeeMee size.
  MW.pattern = function (n) {
    if (n <= 0) return { size: BASE, pts: [] };
    if (n === 1) return { size: 80, pts: [[0, 0]] };
    if (n === 2) return { size: 80, pts: [[-45, 0], [45, 0]] };
    if (n === 3) return { size: 80, pts: [[0, -46], [-45, 34], [45, 34]] };
    if (n === 4) return { size: 80, pts: [[-45, -45], [45, -45], [-45, 45], [45, 45]] };
    if (n === 5) return { size: 56, pts: [[-46, -46], [46, -46], [0, 0], [-46, 46], [46, 46]] };
    if (n === 6) return { size: 56, pts: [[-64, -32], [0, -32], [64, -32], [-64, 32], [0, 32], [64, 32]] };
    const four = [-81, -27, 27, 81], three = [-54, 0, 54];
    const row = function (xs, y) { return xs.map(function (x) { return [x, y]; }); };
    if (n === 7) return { size: 46, pts: row(four, -27).concat(row(three, 27)) };
    if (n === 8) return { size: 46, pts: row(four, -27).concat(row(four, 27)) };
    if (n === 9) return { size: 46, pts: row(three, -54).concat(row(three, 0), row(three, 54)) };
    return { size: 46, pts: row(three, -54).concat(row(four, 0), row(three, 54)) };
  };
  // Positions for n counters in a circle centred at (cx, cy); k scales the pattern (0.9 in the smaller whole circle).
  MW.layout = function (cx, cy, n, k) {
    k = k || 1;
    const p = MW.pattern(Math.min(10, n));
    return p.pts.map(function (d) { return { x: cx + d[0] * k, y: cy + d[1] * k, size: p.size * k }; });
  };

  // ---------------------------------------------------------------- dragging
  // MW.dragger(stageEl, { counters: () => [...], onPick(c), onDrop(c, x, y) })
  MW.dragger = function (surface, opts) {
    let drag = null;
    const stats = MW.dragStats = MW.dragStats || { last: null };

    function nearest(p) {
      let best = null, bestD = GRAB_R;
      opts.counters().forEach(function (c) {
        if (!c.draggable) return;
        const d = Math.hypot(c.x - p.x, c.y - p.y);
        if (d <= bestD) { best = c; bestD = d; }
      });
      return best;
    }

    surface.addEventListener('pointerdown', function (e) {
      if (drag || (opts.enabled && !opts.enabled())) return;
      if (e.button !== undefined && e.button > 0) return;
      const p = MW.stage.toStage(e.clientX, e.clientY);
      const c = nearest(p);
      if (!c) return;
      e.preventDefault();
      try { surface.setPointerCapture(e.pointerId); } catch (err) {}
      drag = { c: c, id: e.pointerId, dx: c.x - p.x, dy: c.y - p.y, tx: c.x, ty: c.y, frames: [], lastT: null, raf: 0 };
      c.lift(true);
      c.el.classList.remove('is-moving');
      c.size = BASE;
      c.moveTo(c.x, c.y, BASE, false);   // .is-lifted puts it above the other counters
      if (opts.onPick) opts.onPick(c);
      MW.lastInput = e.pointerType || 'unknown';
      drag.raf = requestAnimationFrame(frame);
    });

    function frame(t) {
      if (!drag) return;
      if (drag.lastT !== null) drag.frames.push(t - drag.lastT);
      drag.lastT = t;
      drag.c.moveTo(drag.tx, drag.ty, BASE, false);
      drag.raf = requestAnimationFrame(frame);
    }

    surface.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      const p = MW.stage.toStage(e.clientX, e.clientY);
      drag.tx = Math.max(0, Math.min(MW.stage.W, p.x + drag.dx));
      drag.ty = Math.max(0, Math.min(MW.stage.H, p.y + drag.dy));
    }, { passive: true });

    // cancelled: the touch was taken away (a system swipe, the tablet turning) rather than lifted.
    function end(e, cancelled) {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      cancelAnimationFrame(drag.raf);
      const d = drag; drag = null;
      d.c.lift(false);
      d.c.moveTo(d.tx, d.ty, BASE, false);
      record(d.frames);
      if (opts.onDrop) opts.onDrop(d.c, d.tx, d.ty, !!cancelled);
    }
    surface.addEventListener('pointerup', function (e) { end(e, false); });
    surface.addEventListener('pointercancel', function (e) { end(e, true); });
    surface.addEventListener('lostpointercapture', function (e) { end(e, true); });

    function record(frames) {
      if (frames.length < 5) return;
      let sum = 0, worst = 0, slow = 0;
      frames.forEach(function (f) { sum += f; if (f > worst) worst = f; if (f > 34) slow++; });
      stats.last = { fps: Math.round(1000 / (sum / frames.length)), worst: Math.round(worst), slow: slow, n: frames.length };
    }

    return { dragging: function () { return !!drag; }, cancel: function () { if (drag) end(null, true); } };
  };
})();

/* MeeMee World kit: the pieces of a game screen.
   The part–whole diagram, the asteroid tray, Scruffles's pod, progress stars, the equation, sparkles and hint ghosts.
   Positions follow the design system's GameScreen (1280x800 stage). */
(function () {
  'use strict';
  const MW = window.MW;

  const L = MW.LAYOUT = {
    whole: { x: 380, y: 205, r: 115, k: 0.9 },

    right: { x: 550, y: 470, r: 125, k: 1 },
    pillTop: 612,

    tray: { x: 745, y: 515 },

  for (let row = 0; row < 2; row++) for (let i = 0; i < 5; i++) L.traySlots.push({ x: L.tray.x + 82 + i * 94, y: L.tray.y + (row ? 180 : 85) });

    lines.setAttribute('viewBox', '0 0 1280 800'); lines.setAttribute('aria-hidden', 'true');
    lines.innerHTML = '<g class="s-mint" stroke-width="10" stroke-linecap="round" opacity="0.75">'
      + '<line x1="' + L.whole.x + '" y1="' + L.whole.y + '" x2="' + L.left.x + '" y2="' + L.left.y + '"/>'
      + '<line x1="' + L.whole.x + '" y1="' + L.whole.y + '" x2="' + L.right.x + '" y2="' + L.right.y + '"/></g>';
    parent.appendChild(lines);

    const circles = {}, pills = {}, nums = {};
    ['whole', 'left', 'right'].forEach(function (k) {
      const c = L[k];
      const el = abs(MW.make('div', 'mw-circle ' + (k === 'whole' ? 'mw-circle--whole' : 'mw-circle--part')), c.x - c.r, c.y - c.r);
      parent.appendChild(el);
      circles[k] = el;
      if (k === 'whole') {
        nums.whole = MW.make('span', 'numeral-whole');
        el.appendChild(nums.whole);
      } else {
        const p = abs(MW.make('div', 'mw-pill'), c.x - 45, L.pillTop);

        p.appendChild(nums[k]);
        parent.appendChild(p);
        pills[k] = p;
      }
    });
    d.circles = circles; d.pills = pills;

    // q = { whole, left, right, missing: 'left' | 'right' | 'whole' }
    d.set = function (q) {
      ['whole', 'left', 'right'].forEach(function (k) {
        const waiting = q.missing === k;
        circles[k].classList.toggle('is-waiting', waiting);
        circles[k].classList.remove('is-success', 'is-hinting');
        if (pills[k]) pills[k].classList.toggle('is-waiting', waiting);
        if (pills[k]) pills[k].classList.remove('is-success');
        nums[k].textContent = waiting ? '?' : String(q[k]);
        nums[k].style.visibility = '';
        circles[k].setAttribute('aria-label', k === 'whole' ? 'The whole' : 'A part');
      });
    };
    // The live count in the waiting circle: its pill shows the number of MeeMee in it ("?" when empty).
    d.count = function (k, n) {
      if (k === 'whole') nums.whole.style.visibility = (n > 0 || circles.whole.classList.contains('is-hinting')) ? 'hidden' : '';
      else nums[k].textContent = n > 0 ? String(n) : '?';
    };
    d.success = function (k, value) {
      circles[k].classList.remove('is-waiting', 'is-hinting');
      circles[k].classList.add('is-success');
      nums[k].textContent = String(value);
      nums[k].style.visibility = '';
      if (pills[k]) { pills[k].classList.remove('is-waiting'); pills[k].classList.add('is-success'); }
    };
    d.hinting = function (k, on) {
      circles[k].classList.toggle('is-hinting', !!on);
      if (k === 'whole' && on) nums.whole.style.visibility = 'hidden';   // the ghosts take the "?"'s place
      if (k === 'whole' && !on && !circles.whole.classList.contains('is-success')) nums.whole.style.visibility = '';
    };
    // Which circle a drop landed in, or null.

    pod.ready = function (on) { btn.classList.toggle('is-ready', !!on && !btn.classList.contains('is-celebrating')); };
    pod.celebrate = function () {
      pod.lightsOff();
      void btn.getBoundingClientRect();                    // so the flashing starts again from the beginning
      btn.classList.add('is-celebrating');
      lightsTimer = setTimeout(pod.lightsOff, 4100);
    };
    pod.face('thinking');
    return pod;
  };

  // ---------------------------------------------------------------- progress stars
  MW.stars = function (parent, x, y, size) {
    const el = abs(MW.make('div', 'mw-stars', { role: 'img' }), x, y);
    parent.appendChild(el);
    const STAR = '24,5 29.3,17.7 43,18.8 32.6,27.8 35.8,41.2 24,34 12.2,41.2 15.4,27.8 5,18.8 18.7,17.7';
    const cls = { done: 'class="f-peach s-peach" stroke-width="3"', current: 'class="f-night s-mint" stroke-width="4"',
      todo: 'class="s-star-empty" fill="none" stroke-width="3"' };
    size = size || 38;
    return {
      el: el,
      set: function (done, total) {
        total = total || 5;
        let html = '';
        for (let i = 0; i < total; i++) {
          const s = i < done ? 'done' : (i === done ? 'current' : 'todo');
          html += '<svg width="' + size + '" height="' + size + '" viewBox="0 0 48 48" aria-hidden="true" data-state="' + s + '">'
            + '<polygon ' + cls[s] + ' stroke-linejoin="round" points="' + STAR + '"/></svg>';
        }

        el.setAttribute('aria-label', 'Question ' + Math.min(done + 1, total) + ' of ' + total);
      }
    };
  };

  // ---------------------------------------------------------------- the equation
  MW.equation = function (parent) {
    const e = L.equation;
    const el = abs(MW.make('div', 'mw-equation equation', { 'aria-live': 'polite' }), e.x, e.y);
    el.style.width = e.w + 'px'; el.style.height = e.h + 'px';
    parent.appendChild(el);
    return {
      el: el,
      show: function (a, b, w) {
        el.innerHTML = '<span>' + a + '</span><span class="op">+</span><span>' + b + '</span><span class="op">=</span><span>' + w + '</span>';
        el.classList.add('is-shown');
      },
      hide: function () { el.classList.remove('is-shown'); el.innerHTML = ''; }
    };

  // ---------------------------------------------------------------- sparkles: grow in 300 ms, fade by 1.2 s, never blink
  MW.sparkles = function (parent, cx, cy, r) {
    const n = 5;

      s.classList.add('mw-spark');

/* MeeMee World kit: the shell around every game.
   Screens, full screen and landscape on the first tap, "turn me sideways", the buttons the player taps,
   and the grown-ups lock (press and hold for 3 seconds). */
(function () {
  'use strict';
  const MW = window.MW;
  const S = MW.shell = { screen: null, paused: false };
  MW.device = { full: 'Not tried yet', fullOk: null, orient: '', loadMs: null };

  S.show = function (id) {
    Array.prototype.forEach.call(document.querySelectorAll('.mw-screen'), function (s) {
      s.classList.toggle('is-shown', s.id === id);
    });
    S.screen = id;
    MW.log('screen', id);
    S.reloadIfIdle();
  };
  S.reloadIfIdle = function () {
    if (S.updateReady && S.screen === 'screen-start' && !(MW.grownups && MW.grownups.open)) location.reload();
  };

  // ---------------------------------------------------------------- full screen and landscape (needs a tap)
  S.fullscreen = function () {
    const el = document.documentElement;
    const isFull = document.fullscreenElement || document.webkitFullscreenElement;
    const mm = window.matchMedia;
    const app = mm && (mm('(display-mode: fullscreen)').matches || mm('(display-mode: standalone)').matches);
    if (isFull || app) { MW.device.full = app ? 'Opened as an app (already full screen)' : 'Already full screen'; MW.device.fullOk = true; lock(); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) { MW.device.full = 'Not available in this browser'; MW.device.fullOk = false; return; }
    try {
      const p = req.call(el, { navigationUI: 'hide' });
      const ok = function () { MW.device.full = 'Worked'; MW.device.fullOk = true; lock(); };
      if (p && p.then) p.then(ok).catch(function (err) { MW.device.full = 'Refused (' + err.name + ')'; MW.device.fullOk = false; });
      else setTimeout(ok, 300);
    } catch (err) { MW.device.full = 'Failed: ' + err.message; MW.device.fullOk = false; }
  };
  function lock() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').then(function () { MW.device.orient = 'locked to landscape'; })
        .catch(function (err) { MW.device.orient = 'could not lock (' + err.name + ')'; });
    } else { MW.device.orient = 'lock not available'; }
  }

  // ---------------------------------------------------------------- buttons the player taps (pictures, never words)
  // Positions from the design system: Home top-left, Music and Hear-again top-right.
  S.buttons = function (parent, which, handlers) {
    const out = {};
    if (which.indexOf('home') >= 0) {
      out.home = button(parent, 'mw-btn mw-btn--nav', 24, 20, 'Home', 'icon-home', 44);
      MW.onTap(out.home, function () { if (handlers.home) handlers.home(); });
    }
    if (which.indexOf('music') >= 0) {
      out.music = button(parent, 'mw-btn mw-btn--nav mw-music', which.indexOf('hear') >= 0 ? 1052 : 1172, 26, 'Music', null, 40);
      MW.onTap(out.music, function () { MW.audio.music.setOn(!MW.audio.music.isOn()); });
      paintMusic(out.music);
    }
    if (which.indexOf('hear') >= 0) {
      out.hear = button(parent, 'mw-btn mw-btn--main', 1160, 20, 'Hear it again', 'icon-hear', 54);
      MW.onTap(out.hear, function () { if (handlers.hear) handlers.hear(); });
    }

  };
  function button(parent, cls, x, y, label, icon, size) {
    const b = MW.make('button', cls + ' mw-abs', { type: 'button', 'aria-label': label });
    b.style.left = x + 'px'; b.style.top = y + 'px';
    if (icon) { const i = MW.art(icon); i.setAttribute('width', size); i.setAttribute('height', size); b.appendChild(i); }
    b.setAttribute('data-icon-size', size);
    parent.appendChild(b);
    return b;
  }

    const on = MW.audio.music.isOn();
    const size = +b.getAttribute('data-icon-size');
    b.innerHTML = '';

  // A quick tap does nothing and shows nothing. Holding fills a mint ring over 3 s, then opens the grown-ups area.
  S.gate = function (parent, onOpen) {

    const b = MW.make('button', 'mw-btn mw-btn--grownups mw-gate mw-abs', { type: 'button', 'aria-label': 'Grown-ups (press and hold)' });

    const icon = MW.art('icon-lock'); icon.setAttribute('width', 24); icon.setAttribute('height', 24);
    b.appendChild(icon);

    // One finger only, held still on the lock: a palm, two fingers or a thumb sliding off don't count.
    let timer = 0, hold = null;
    const fill = svg.querySelector('.mw-gate-fill');
    function start(e) {
      e.preventDefault();
      if (hold) { stop(); return; }                      // a second finger cancels
      hold = { id: e.pointerId, x: e.clientX, y: e.clientY };
      b.classList.add('is-holding');
      fill.style.transition = 'stroke-dashoffset ' + HOLD + 'ms linear';
      fill.style.strokeDashoffset = '0';
      clearTimeout(timer);
      timer = setTimeout(function () { stop(); onOpen(); }, HOLD);
    }
    function stop() {
      hold = null;
      clearTimeout(timer);
      b.classList.remove('is-holding');
      fill.style.transition = 'none';
      fill.style.strokeDashoffset = '182.2';
    }

  };

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  S.offline = { text: 'Checking…', ok: null };

    navigator.serviceWorker.addEventListener('message', function (e) {

    });

      const check = function () { if (navigator.onLine) reg.update().catch(function () {}); };
      setTimeout(check, 8000);
      setInterval(check, 3600 * 1000);
      return navigator.serviceWorker.ready;
    }).then(function () {
      S.offline = controlled ? { text: 'Opened from the saved copy', ok: true } : { text: 'Saved for offline; works from the next visit', ok: true };
    }).catch(function (err) { S.offline = { text: 'Could not save (' + err.name + ')', ok: false }; });

})();

/* MeeMee Rescue (trial round, phase 3).
   Five part–whole questions in Barney's voice. The player drags MeeMee from the asteroid into the waiting circle.

(function () {
  'use strict';
  const MW = window.MW;
  const ROUND = 5;

  const N = function (n) { return 'num-mid-' + n; };
  const E = function (n) { return 'num-end-' + n; };

  const st = { token: 0, paused: false, pauses: {}, hintTimers: [], phase: 'idle', round: null, qi: 0, q: null, target: null, answer: 0,

    buildGame();
    buildEnd();

    document.addEventListener('visibilitychange', function () { if (document.hidden) pause('hidden'); else resume('hidden'); });
    // 9 October: "tap Scruffles to check" became the default. A tablet still on the old default moves to it once;
    // a mode a grown-up picks in Settings from now on is kept.
    if (!MW.store.setting('checkPicked') && MW.store.setting('check') !== 'tap') MW.store.setting('check', 'tap');
    MW.shell.registerOffline();
    MW.audio.preloadAll();
    MW.shell.show('screen-start');

      const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];

    });

    const s = MW.$('screen-start');

  function pause(why) {

    const token = st.token;

  // ---------------------------------------------------------------- a round
  function makeRound() {
    if (R.nextRound) { const r = R.nextRound; R.nextRound = null; return r.map(function (q) { return Object.assign({}, q); }); }
    let wholes = (MW.store.setting('wholes') || []).filter(function (w) { return w >= 2 && w <= 10; });

      const c = MW.counter(layer, { x: p.x, y: p.y });
      c.home = p; c.where = 'tray'; c.slot = i;
      c.el.classList.add('is-arriving');
      c.el.addEventListener('animationend', function () { c.el.classList.remove('is-arriving'); }, { once: true });
      st.counters.push(c);
    });
    st.prompt = promptFor(q);
    // tap mode: the first two questions of a round end with "Tap Scruffles when you're ready."
    if (check() === 'tap' && st.qi < 2) st.prompt = st.prompt.concat([['tap-scruffles']]);
    st.phase = 'asking';
    MW.log('question', JSON.stringify(q));
    await speak(st.prompt);
    if (token !== st.token) return;
    if (st.phase === 'asking') st.phase = 'open';
  }

  function promptFor(q) {
    if (q.missing === 'whole') return [['q-weve-got', N(q.left), 'and', E(q.right)], ['q-how-many-altogether']];
    const given = q[OTHER[q.missing]];
    return [['q-lets-make', E(q.whole)], ['q-weve-got', E(given)], ['q-how-many-more']];
  }

  // ---------------------------------------------------------------- dragging and dropping
  function inTarget() { return st.counters.filter(function (c) { return c.where === st.target; }); }
  function tidy(animate) {
    const placed = inTarget();
    const n = placed.length;
    const slots = diagram.slots(st.target, st.hinted && n <= st.answer ? st.answer : n);
    placed.forEach(function (c, i) { c.moveTo(slots[i].x, slots[i].y, slots[i].size, animate); });
    diagram.count(st.target, n);
    pod.ready(check() === 'tap' && n > 0 && st.phase !== 'celebrate');
  }
  function check() { return MW.store.setting('check') === 'tap' ? 'tap' : 'auto'; }

  function onDrop(c, x, y, cancelled) {
    if (st.counters.indexOf(c) < 0) return;                 // left over from a question that has ended
    const was = c.where;
    // Not answering now (paused, celebrating, or a touch taken away by the tablet): just put it back.
    if (cancelled || st.paused || !(st.phase === 'open' || st.phase === 'asking')) {
      if (was === st.target) tidy(true);                    // it was already in the circle: back to its place there
      else floatHome(c);
      return;
    }
    const hit = diagram.hit(x, y);
    if (hit === st.target) {
      if (was === st.target) { tidy(true); return; }
      if (check() === 'auto' && inTarget().length >= st.answer) { floatHome(c); return; }
      c.where = st.target;
      MW.audio.sfx('pop');
      tidy(true);
      pod.face('thinking');
      MW.log('drop', 'in ' + inTarget().length);
      if (check() === 'auto' && inTarget().length === st.answer) success();
      return;
    }
    // anywhere else: the MeeMee floats back to its own spot on the asteroid
    const far = Math.hypot(x - c.home.x, y - c.home.y) > 70;
    floatHome(c);
    if (was === st.target) { tidy(true); MW.audio.sfx('whoosh'); MW.log('drop', 'out ' + inTarget().length); return; }
    if (!far) return;                       // a nudge on the asteroid isn't a try
    MW.audio.sfx('whoosh');
    MW.log('drop', 'miss');
    if (check() === 'auto') wrongTry('miss');
  }
  function floatHome(c) {
    c.where = 'tray';
    c.moveTo(c.home.x, c.home.y, 80, true);
  }

  // Tapping Scruffles: checks the answer in "tap" mode; otherwise asks the question again.
  function onPodTap() {
    if (st.paused || !(st.phase === 'open' || st.phase === 'asking')) return;
    if (dragger && dragger.dragging()) return;              // one hand holding a MeeMee, the other tapping
    if (check() !== 'tap') { hearAgain(); return; }
    const n = inTarget().length;
    MW.log('check', n + ' of ' + st.answer);
    if (n === st.answer) { success(); return; }
    wrongTry(n > st.answer ? 'too-many' : 'too-few');
  }

  // A wrong try: a wrong check (tap mode) or a MeeMee dropped away from the waiting circle (a miss).
  // No red, no buzzer: Scruffles's try-again face, a calm line, and the hint after the second one.
  function wrongTry(kind) {
    if (kind === 'miss') st.misses++; else st.tries++;
    const count = kind === 'miss' ? st.misses : st.tries;
    pod.face('try-again');
    const token = st.token, qi = st.qi;
    setTimeout(function () { if (token === st.token && qi === st.qi && st.phase !== 'celebrate') pod.face('thinking'); }, 1600);
    if (kind === 'too-many') { speak([['too-many']]); return; }
    if (count >= 2 && !st.hinted) { hint(); return; }
    if (count >= 2) return;
    speak([[kind === 'miss' ? 'again-try-again' : 'again-look-again']]);
  }

  // ---------------------------------------------------------------- the hint: count on together
  async function hint() {
    const q = st.q, token = st.token, qi = st.qi;
    st.hinted = true;
    MW.log('hint', q.missing);
    diagram.hinting(st.target, true);
    tidy(true);
    const placed = inTarget().length;
    const slots = diagram.slots(st.target, Math.max(st.answer, placed));
    if (st.ghosts) st.ghosts.clear();
    st.ghosts = MW.ghosts(ghostLayer, slots.slice(placed, st.answer));
    let lines, actions;
    if (q.missing === 'whole') {
      // "Count them with me. One, two, three…": each MeeMee in the parts hops as its number is said
      const order = st.fixed.slice();
      lines = [['again-count-with-me']];
      actions = [null];
      for (let i = 1; i <= q.whole; i++) {
        lines.push([i === q.whole ? E(i) : N(i)]);
        actions.push((function (c, j) { return function () { hop(c); if (st.ghosts) st.ghosts.light(j - placed); }; })(order[i - 1], i - 1));
      }
    } else {
      // "Let's count on from three. Four, five, six, seven."
      const given = q[OTHER[q.missing]];
      lines = [['q-count-on-from', E(given)]];
      actions = [null];
      for (let i = 1; i <= st.answer; i++) {
        lines.push([given + i === q.whole ? E(given + i) : N(given + i)]);
        actions.push((function (j) {
          return function () {
            const inside = inTarget();
            if (j < inside.length) hop(inside[j]); else if (st.ghosts) st.ghosts.light(j - placed);
          };
        })(i - 1));
      }
    }
    const heard = await speak(lines, {
      onStart: function (timeline) {
        // one entry per clip; the first line may have two clips
        let k = 0;
        lines.forEach(function (sent, si) {
          const at = timeline[k].at;
          k += sent.length;
          if (actions[si]) st.hintTimers.push(setTimeout(function () { if (token === st.token && qi === st.qi) actions[si](); }, at * 1000));
        });
      }
    });
    // Cut short (Hear-again, a pause): take the hint away so the next wrong try gives it again in full.
    if (!heard && token === st.token && qi === st.qi && st.phase !== 'celebrate') {
      clearHint();
      st.hinted = false;
      if (st.ghosts) { st.ghosts.clear(); st.ghosts = null; }
      diagram.hinting(st.target, false);
      tidy(true);
    }
  }
  function clearHint() {
    st.hintTimers.forEach(clearTimeout);
    st.hintTimers = [];
  }
  function hop(c) {
    if (!c) return;
    c.el.classList.remove('is-hop'); void c.el.offsetWidth; c.el.classList.add('is-hop');
  }

  // ---------------------------------------------------------------- a right answer
  async function success() {
    if (st.phase === 'celebrate') return;
    const token = st.token, q = st.q;
    st.phase = 'celebrate';
    clearHint();
    MW.store.recordAnswer({ t: Date.now(), whole: q.whole, left: q.left, right: q.right, missing: q.missing,
      tries: st.tries, misses: st.misses, hint: st.hinted, check: check() });
    if (st.ghosts) { st.ghosts.clear(); st.ghosts = null; }
    diagram.success(st.target, st.answer);
    const c = MW.LAYOUT[st.target];
    MW.sparkles(fxLayer, c.x, c.y, c.r + 34);
    pod.face('got-it');
    pod.celebrate();                                         // the ship's lights flash for about 4 s
    MW.audio.sfx('chime');
    MW.log('success', JSON.stringify(q));
    await MW.wait(550);
    if (!(await ok(token))) return;
    st.praise = st.praise.length ? st.praise : MW.shuffle(PRAISE);
    await speak([[st.praise.pop()]]);
    if (!(await ok(token))) return;
    equation.show(q.left, q.right, q.whole);
    await speak([[N(q.left), 'and', N(q.right), 'make', E(q.whole)]]);
    if (!(await ok(token))) return;
    stars.set(st.qi + 1);
    MW.audio.sfx('twinkle');
    await MW.wait(800);
    if (!(await ok(token))) return;
    // the rescued MeeMee fly up into the pod
    inTarget().concat(st.fixed).forEach(function (m) {
      m.el.classList.add('is-rescued');
      if (!MW.reduceMotion) m.moveTo(1030 + (Math.random() * 60 - 30), 300, 30, true);   // reduce motion: just fade
    });
    await MW.wait(650);
    if (!(await ok(token))) return;
    st.qi++;
    if (st.qi < ROUND) nextQuestion(token); else endRound(token);
  }

  async function endRound(token) {
    st.phase = 'done';
    clearBoard(true);
    MW.shell.show('screen-end');
    endStars.set(ROUND, ROUND);
    MW.audio.sfx('tune');
    endPod.celebrate();
    await MW.wait(300);
    await speak([['round-rescued-all']]);
    if (!(await ok(token))) return;
    // the rescued MeeMee hop once each, left to right
    Array.prototype.forEach.call(endMimi.children, function (m, i) {
      setTimeout(function () { m.classList.remove('is-hop'); void m.getBoundingClientRect(); m.classList.add('is-hop'); }, i * 160);
    });
    await MW.wait(500);
    if (!(await ok(token))) return;
    await speak([['round-another']]);
  }

  function hearAgain() {
    if (st.paused) return;
    if (st.phase === 'open' || st.phase === 'asking') { clearHint(); speak(st.prompt); }
  }
  function goHome() {
    clearHint();
    if (dragger) dragger.cancel();
    st.token++;
    st.phase = 'idle';
    MW.audio.hush();
    pod.lightsOff(); endPod.lightsOff();
    clearBoard(true);
    MW.shell.show('screen-start');
  }

  // ---------------------------------------------------------------- grown-ups: this trial
  function sentence(a) {
    if (a.missing === 'whole') return a.left + ' + ' + a.right + ' = ?';
    if (a.missing === 'left') return '? + ' + a.right + ' = ' + a.whole;
    return a.left + ' + ? = ' + a.whole;
  }
  function progressSection() {
    return {
      id: 'progress', title: 'Progress',
      render: function (el) {
        const answers = MW.store.get('answers') || [];
        const firstTime = answers.filter(function (a) { return !a.tries && !a.hint; }).length;
        MW.grownups.p(el, answers.length
          ? 'Questions answered on this tablet: ' + answers.length + '. Right first time: ' + firstTime + '.'
          : 'No questions answered on this tablet yet.', 'gu-lead');
        MW.grownups.p(el, 'This is the phase 3 trial. The full progress screen, showing which bonds are secure, comes with the finished game.', 'gu-note');
        if (answers.length) {
          const rows = answers.slice(-25).reverse().map(function (a) {
            const d = new Date(a.t);
            const when = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            const parts = [];
            if (a.tries) parts.push(a.tries + (a.tries === 1 ? ' wrong check' : ' wrong checks'));
            if (a.misses) parts.push(a.misses + (a.misses === 1 ? ' missed drop' : ' missed drops'));
            if (a.hint) parts.push('with the hint');
            const how = (parts.length ? parts.join(', ') : 'First time') + (a.check === 'tap' ? ' (tap Scruffles)' : '');
            return [when, sentence(a) + '   (answer ' + (a.missing === 'whole' ? a.whole : a[a.missing]) + ')', how.charAt(0).toUpperCase() + how.slice(1)];
          });
          const t = MW.make('table', 'gu-table gu-table--3 label');
          t.innerHTML = '<tr><th>When</th><th>Question</th><th>How it went</th></tr>' + rows.map(function (r) {
            return '<tr><td>' + MW.esc(r[0]) + '</td><td>' + MW.esc(r[1]) + '</td><td>' + MW.esc(r[2]) + '</td></tr>';
          }).join('');
          el.appendChild(t);
        }
        const row = MW.grownups.row(el);
        let armed = 0;
        MW.grownups.btn(row, 'Clear this tablet\'s progress', function (b) {
          if (Date.now() - armed < 4000) {
            MW.store.clear(); MW.grownups.show('progress');
          } else {
            armed = Date.now(); b.textContent = 'Tap again to clear';
            setTimeout(function () { b.textContent = 'Clear this tablet\'s progress'; }, 4000);
          }
        }, 'gu-quiet');
      }
    };
  }

  function settingsSection() {
    return {
      id: 'settings', title: 'Settings',
      render: function (el) {
        const G = MW.grownups;
        G.h3(el, 'Answer check');
        const r1 = G.row(el);
        const modes = [['tap', 'When your child taps Scruffles'], ['auto', 'As soon as the count is right']];
        const paint = function () {
          Array.prototype.forEach.call(r1.children, function (b, i) { b.classList.toggle('is-on', modes[i][0] === check()); });
        };
        modes.forEach(function (m) {
          G.btn(r1, m[1], function () { MW.store.setting('check', m[0]); MW.store.setting('checkPicked', true); paint(); MW.log('setting', 'check ' + m[0]); }, 'gu-choice');
        });
        paint();
        G.p(el, '<b>When your child taps Scruffles</b> (the usual way): they put in as many MeeMee as they think, then tap Scruffles to check. The first two questions of each round end with "Tap Scruffles when you\'re ready.", and the ship\'s lights glow once there is a MeeMee in the circle. Too many gets "That\'s too many. Take one back."; two wrong checks bring the counting-on hint.', 'gu-note');
        G.p(el, '<b>As soon as the count is right:</b> the question completes when the waiting circle holds the right number of MeeMee. No deciding when to stop, so it is easier but teaches less.', 'gu-note');

        G.h3(el, 'Wholes in play');
        const r2 = G.row(el);
        const paintW = function () {
          const on = MW.store.setting('wholes') || [];
          Array.prototype.forEach.call(r2.children, function (b) { b.classList.toggle('is-on', on.indexOf(+b.textContent) >= 0); });
        };
        for (let w = 2; w <= 10; w++) {
          G.btn(r2, String(w), function () {
            let on = (MW.store.setting('wholes') || []).slice();
            if (on.indexOf(w) >= 0) { if (on.length > 1) on = on.filter(function (x) { return x !== w; }); }
            else on.push(w);
            on.sort(function (a, b) { return a - b; });
            MW.store.setting('wholes', on);
            paintW();
          }, 'mw-chip gu-chip');
        }
        paintW();
        G.p(el, 'Questions use only the wholes switched on. Zero bonds (such as 7 + 0) aren\'t asked yet. Changes start with the next round.', 'gu-note');
      }
    };
  }

  // ---------------------------------------------------------------- test hooks
  R.drop = onDrop; R.podTap = onPodTap; R.start = startRound; R.home = goHome;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
