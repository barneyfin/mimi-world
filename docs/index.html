<script>
/* MeeMee World kit: core.
   The 1280x800 stage and its scaling, what each tablet remembers, and small helpers.
   Every other kit file adds to window.MW. */
(function () {
  'use strict';
  const MW = window.MW = window.MW || {};

  // ---------------------------------------------------------------- the stage
  // Every screen is drawn on a 1280x800 stage and scaled to fit (0.82 on the Fire, 1.0 on the Doogee).
  const stage = MW.stage = { el: null, W: 1280, H: 800, scale: 1, offX: 0, offY: 0 };
  stage.fit = function () {
    const w = window.innerWidth, h = window.innerHeight;
    stage.scale = Math.min(w / stage.W, h / stage.H);
    stage.offX = (w - stage.W * stage.scale) / 2;
    stage.offY = (h - stage.H * stage.scale) / 2;
    if (stage.el) stage.el.style.transform = 'translate(' + stage.offX + 'px,' + stage.offY + 'px) scale(' + stage.scale + ')';
  };
  stage.toStage = function (clientX, clientY) {
    return { x: (clientX - stage.offX) / stage.scale, y: (clientY - stage.offY) / stage.scale };
  };
  stage.init = function (el) {
    stage.el = el;
    stage.fit();
    window.addEventListener('resize', stage.fit);
    window.addEventListener('orientationchange', function () { setTimeout(stage.fit, 250); });
  };

  // ---------------------------------------------------------------- reduce motion
  const rm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  MW.reduceMotion = !!(rm && rm.matches);
  if (rm && rm.addEventListener) rm.addEventListener('change', function () { MW.reduceMotion = rm.matches; });

  // ---------------------------------------------------------------- what this tablet remembers
  // One localStorage entry. Browser storage can be cleared, so this is a convenience, not a record.
  // music and settings are the world's (and MeeMee Rescue's settings, from before phase 5); answers are MeeMee
  // Rescue's; games.<id> is each newer game's own saved data (MW.store.game).
  const KEY = 'mimi-world';
  const DEFAULTS = { v: 1, music: true, settings: { check: 'tap', wholes: [2, 3, 4, 5, 6, 7, 8, 9, 10] }, answers: [], games: {} };
  let data = null;
  function load() {
    if (data) return data;
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
    data = JSON.parse(JSON.stringify(DEFAULTS));
    if (saved && saved.v === 1) {
      if (typeof saved.music === 'boolean') data.music = saved.music;
      if (saved.settings) Object.assign(data.settings, saved.settings);
      if (Array.isArray(saved.answers)) data.answers = saved.answers;
      if (saved.games && typeof saved.games === 'object' && !Array.isArray(saved.games)) data.games = saved.games;
    }
    return data;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); MW.store.ok = true; } catch (e) { MW.store.ok = false; }
  }
  MW.store = {
    ok: null,
    get: function (k) { return load()[k]; },
    setting: function (k, v) {
      const s = load().settings;
      if (v === undefined) return s[k];
      s[k] = v; save(); return v;
    },
    setMusic: function (on) { load().music = !!on; save(); },
    // A game's own saved data: an object it can change freely, then MW.store.save() to keep the change.
    // It creates the game's entry the first time (kept on the next save), so use it only to change things.
    game: function (id) {
      const g = load().games;
      if (!g[id] || typeof g[id] !== 'object' || Array.isArray(g[id])) g[id] = {};
      return g[id];
    },
    // Reading only: the game's saved data, or an empty object if it has saved nothing. It never creates anything, so a
    // tablet that has never played a game keeps nothing for it. Don't change what it returns: use game(id) for that.
    peek: function (id) {
      const g = load().games[id];
      return g && typeof g === 'object' && !Array.isArray(g) ? g : {};
    },
    // Forget a game's saved data (for its own "clear this tablet's progress" button).
    clearGame: function (id) { delete load().games[id]; save(); },
    save: function () { load(); save(); return MW.store.ok; },
    recordAnswer: function (a) {
      const d = load();
      d.answers.push(a);
      if (d.answers.length > 3000) d.answers.splice(0, d.answers.length - 3000);
      save();
    },
    clear: function () {
      const d = load();
      d.answers = [];
      save();
    },
    bytes: function () { try { return (localStorage.getItem(KEY) || '').length; } catch (e) { return 0; } },
    check: function () {
      try {
        localStorage.setItem(KEY + '-test', '1');
        const ok = localStorage.getItem(KEY + '-test') === '1';
        localStorage.removeItem(KEY + '-test');
        MW.store.ok = ok;
      } catch (e) { MW.store.ok = false; }
      return MW.store.ok;
    }
  };

  // ---------------------------------------------------------------- helpers
  MW.$ = function (id) { return document.getElementById(id); };
  MW.make = function (tag, cls, attrs, html) {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (attrs) Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    if (html !== undefined) el.innerHTML = html;
    return el;
  };
  // A tap on a button the player uses. Detected from the finger lifting on the button rather than from "click",
  // which browsers sometimes swallow right after a drag. The keyboard still works (Enter or Space).
  // Lifting the finger counts as a user gesture, so full screen and sound can start from here.
  MW.onTap = function (el, fn) {
    let down = null;
    el.addEventListener('pointerdown', function (e) {
      if (e.button > 0) return;
      down = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
    });
    el.addEventListener('pointerup', function (e) {
      if (!down || e.pointerId !== down.id) return;
      const d = down; down = null;
      if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 40 || performance.now() - d.t > 1500) return;
      const r = el.getBoundingClientRect();
      if (e.clientX < r.left - 8 || e.clientX > r.right + 8 || e.clientY < r.top - 8 || e.clientY > r.bottom + 8) return;
      if (el.disabled) return;
      fn(e);
    });
    el.addEventListener('pointercancel', function () { down = null; });
    el.addEventListener('click', function (e) { if (e.detail === 0 && !el.disabled) fn(e); });
  };
  // A copy of a drawing. Its ids (clip paths) get a number of their own, so the same drawing can be on the page twice.
  // To draw it at another size, set its width and height; to show more or less of it (a hull as long as a word),
  // set its viewBox too (the skill's reference.md, Drawings).
  let artCopies = 0;
  MW.art = function (name) {
    const t = document.getElementById('art-' + name);
    if (!t) throw new Error('No art called ' + name);
    const el = t.content.firstElementChild.cloneNode(true);
    const named = el.querySelectorAll('[id]');
    if (named.length) {
      const n = ++artCopies, map = {};
      Array.prototype.forEach.call(named, function (e) { map[e.id] = e.id + '-' + n; e.id = map[e.id]; });
      // every reference to them: clip-path, mask, filter, fill or stroke url(#…), and <use href="#…">
      Array.prototype.forEach.call(el.querySelectorAll('*'), function (e) {
        Array.prototype.forEach.call(e.attributes, function (a) {
          if (a.value.indexOf('url(#') >= 0) {
            const v = a.value.replace(/url\(#([^)]+)\)/g, function (all, id) { return map[id] ? 'url(#' + map[id] + ')' : all; });
            if (v !== a.value) e.setAttribute(a.name, v);
          } else if ((a.name === 'href' || a.name === 'xlink:href') && a.value.charAt(0) === '#' && map[a.value.slice(1)]) {
            e.setAttribute(a.name, '#' + map[a.value.slice(1)]);
          }
        });
      });
    }
    return el;
  };
  MW.wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  MW.pick = function (list) { return list[Math.floor(Math.random() * list.length)]; };
  MW.shuffle = function (list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  };
  MW.esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  };

  // A short log of what happened, read by the tests and the grown-ups checks.
  MW.events = [];
  MW.log = function (type, detail) {
    MW.events.push({ t: Math.round(performance.now()), type: type, detail: detail });
    if (MW.events.length > 800) MW.events.splice(0, 200);
  };
})();

/* MeeMee World kit: sound.
   Voice lines built from Barney's recorded pieces, sound effects, and the looping music that dips under speech.
   All files are at one loudness reference (-20 LUFS, made by tools/make_audio.py), so mixing is plain gains.

   Browsers only allow sound after a tap: call MW.audio.unlock() from the first tap (TapToStart does). */
(function () {
  'use strict';
  const MW = window.MW;
  const A = MW.audio = {};
  const CONFIG = A.config = {
    base: 'audio/',
    pieceGap: 0.03,        // seconds between pieces inside a sentence ("three" "and" "four")
    sentenceGap: 0.35,     // seconds between sentences
    musicDb: -12,          // music under everything
    musicDuckDb: -22,      // music while a line is spoken
    musicFadeIn: 1.5,
    musicRate: 32000       // music is decoded at 32 kHz mono to keep memory low on the Fire (about 20 MB)
  };
  const manifest = window.MW_AUDIO || { voice: {}, effects: {}, music: null };
  A.manifest = manifest;

  let ctx = null, voiceBus = null, sfxBus = null, musicUser = null, musicDuck = null;
  const buffers = {};
  const waiting = {};
  const failed = [];
  let unlocked = false;

  function dbToGain(db) { return Math.pow(10, db / 20); }

  // ---------------------------------------------------------------- loading and decoding
  // Files are fetched and decoded straight away (before the first tap) in offline contexts,
  // which browsers allow without a tap. The decoded buffers then play in the real context.
  const dec = {};
  function decoder(rate) {
    if (!dec[rate]) {
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      dec[rate] = new OAC(1, 1, rate);
    }
    return dec[rate];
  }
  function decode(bytes, rate) {
    return new Promise(function (resolve, reject) {
      const p = decoder(rate).decodeAudioData(bytes, resolve, reject);
      if (p && p.catch) p.catch(reject);
    });
  }
  let queue = Promise.resolve();
  A.load = function (key) {
    if (buffers[key]) return Promise.resolve(buffers[key]);
    if (waiting[key]) return waiting[key];
    const rate = key === 'music' ? CONFIG.musicRate : 44100;
    const bytes = fetch(CONFIG.base + key + '.mp3').then(function (r) {
      if (!r.ok) throw new Error(r.status + ' for ' + key);
      return r.arrayBuffer();
    });
    // decode one file at a time so the Fire stays smooth
    waiting[key] = queue = queue.then(function () { return bytes; }).then(function (b) { return decode(b, rate); })
      .then(function (buf) { buffers[key] = buf; return buf; })
      .catch(function (err) { failed.push(key); MW.log('audio-fail', key + ': ' + err); delete waiting[key]; return null; });
    return waiting[key];
  };
  A.ready = function (keys) { return Promise.all(keys.map(A.load)); };
  A.preloadAll = function () {
    const keys = Object.keys(manifest.effects || {}).map(function (k) { return 'sfx/' + k; })
      .concat(Object.keys(manifest.voice || {}).map(function (k) { return 'voice/' + k; }));
    const all = A.ready(keys);
    if (manifest.music) all.then(function () { return A.load('music'); }).then(function () { if (unlocked) A.music.start(); });
    return all;
  };
  A.status = function () {
    const total = Object.keys(manifest.voice || {}).length + Object.keys(manifest.effects || {}).length + (manifest.music ? 1 : 0);
    return { state: ctx ? ctx.state : 'not started', rate: ctx ? ctx.sampleRate : null,
      decoded: Object.keys(buffers).length, total: total, failed: failed.slice() };
  };
  A.has = function (key) { return !!buffers[key]; };
  // Is this line recorded (on the page)? A line still waiting for its recording (pending) isn't, and say() skips it.
  A.recorded = function (id) { return !!(manifest.voice || {})[id]; };

  // ---------------------------------------------------------------- the first tap
  A.unlock = function () {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return 'no web audio';
    if (!ctx) {
      try { ctx = new AC(); } catch (e) { MW.log('audio-fail', 'context: ' + e.message); return 'failed'; }
      voiceBus = ctx.createGain(); voiceBus.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.connect(ctx.destination);
      musicDuck = ctx.createGain(); musicDuck.gain.value = dbToGain(CONFIG.musicDb); musicDuck.connect(ctx.destination);
      musicUser = ctx.createGain(); musicUser.gain.value = 0; musicUser.connect(musicDuck);
    }
    if (ctx.state === 'suspended') { const p = ctx.resume(); if (p && p.catch) p.catch(function () {}); }
    if (!unlocked) {
      unlocked = true;
      if (buffers.music) A.music.start();
    }
    return ctx.state;
  };
  A.running = function () { return !!ctx && ctx.state === 'running'; };
  A.now = function () { return ctx ? ctx.currentTime : 0; };

  // Pause sound when the tablet hides the page; carry on when it comes back.
  document.addEventListener('visibilitychange', function () {
    if (!ctx) return;
    if (document.hidden) { ctx.suspend(); } else if (unlocked) { ctx.resume(); }
  });
  // Some tablets suspend sound after the screen sleeps: any tap wakes it.
  window.addEventListener('pointerdown', function () { if (unlocked && ctx && ctx.state === 'suspended') ctx.resume(); }, true);

  // ---------------------------------------------------------------- voice
  // A line is a list of sentences; a sentence is a list of clip ids.
  // say([['q-lets-make', 'num-end-7'], ['q-weve-got', 'num-end-3'], ['q-how-many-more']])
  const speech = { token: 0, sources: [], resolve: null, endsAt: 0, timer: 0 };
  A.say = function (sentences, opts) {
    opts = opts || {};
    A.hush();
    const token = speech.token;
    const ids = [].concat.apply([], sentences);
    MW.log('say', ids.join(' '));
    // a line that isn't recorded yet (not on the page) is skipped, so a game can be built before its recordings
    const unrecorded = ids.filter(function (id) { return !(manifest.voice || {})[id]; });
    if (unrecorded.length) { MW.log('audio-fail', 'not recorded yet: ' + unrecorded.join(', ')); return Promise.resolve(false); }
    return A.ready(ids.map(function (id) { return 'voice/' + id; })).then(function () {
      if (token !== speech.token) return false;
      if (!A.running()) return false;
      const missing = ids.filter(function (id) { return !buffers['voice/' + id]; });
      if (missing.length) { MW.log('audio-fail', 'missing ' + missing.join(', ')); return false; }
      const start = ctx.currentTime + 0.06;
      let t = start;
      const timeline = [];
      sentences.forEach(function (sent, si) {
        if (si > 0) t += CONFIG.sentenceGap;
        sent.forEach(function (id, pi) {
          if (pi > 0) t += CONFIG.pieceGap;
          const b = buffers['voice/' + id];
          const s = ctx.createBufferSource();
          s.buffer = b; s.connect(voiceBus); s.start(t);
          speech.sources.push(s);
          timeline.push({ id: id, at: t - start, dur: b.duration });
          t += b.duration;
        });
      });
      speech.endsAt = t;
      duck(true, start);
      if (opts.onStart) opts.onStart(timeline);
      return new Promise(function (resolve) {
        speech.resolve = resolve;
        const finish = function () {
          if (token !== speech.token || !speech.resolve) return;
          speech.resolve = null; speech.sources = [];
          clearTimeout(speech.timer);
          duck(false);
          resolve(true);
        };
        speech.sources[speech.sources.length - 1].onended = finish;
        // In case a browser never fires onended: check the audio clock (which stops while the tablet sleeps).
        const backstop = function () {
          if (token !== speech.token || !speech.resolve) return;
          if (ctx.state === 'running' && ctx.currentTime >= t + 0.3) finish();
          else speech.timer = setTimeout(backstop, 500);
        };
        speech.timer = setTimeout(backstop, (t - ctx.currentTime) * 1000 + 600);
      });
    });
  };
  A.hush = function () {
    speech.token++;
    speech.sources.forEach(function (s) { try { s.onended = null; s.stop(); } catch (e) {} });
    speech.sources = [];
    clearTimeout(speech.timer);
    if (ctx) duck(false);
    if (speech.resolve) { const r = speech.resolve; speech.resolve = null; r(false); }
  };
  A.speaking = function () { return !!speech.resolve; };
  // How long a line will take, in seconds (for timing pictures to the voice).
  A.lengthOf = function (sentences) {
    let t = 0;
    sentences.forEach(function (sent, si) {
      if (si > 0) t += CONFIG.sentenceGap;
      sent.forEach(function (id, pi) {
        if (pi > 0) t += CONFIG.pieceGap;
        const b = buffers['voice/' + id];
        t += b ? b.duration : ((manifest.voice[id] || {}).dur || 0.8);
      });
    });
    return t;
  };

  function duck(down, at) {
    if (!musicDuck) return;
    const g = musicDuck.gain, now = ctx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    if (down) g.setTargetAtTime(dbToGain(CONFIG.musicDuckDb), Math.max(now, (at || now) - 0.1), 0.04);
    else g.setTargetAtTime(dbToGain(CONFIG.musicDb), now + 0.15, 0.25);
  }

  // ---------------------------------------------------------------- effects
  A.sfx = function (name) {
    const b = buffers['sfx/' + name];
    MW.log('sfx', name);
    if (!b || !A.running()) return 0;
    const s = ctx.createBufferSource();
    s.buffer = b; s.connect(sfxBus); s.start();
    return b.duration;
  };

  // ---------------------------------------------------------------- music
  // "Paws in the Milky Way" loops: each copy's last 1.5 s fades (baked into the file) while the next copy starts.
  const music = { sources: [], next: 0, timer: 0, playing: false };
  A.music = {
    isOn: function () { return MW.store.get('music') !== false; },
    setOn: function (on) {
      MW.store.setMusic(on);
      MW.log('music', on ? 'on' : 'off');
      if (on) A.music.start(); else A.music.stop();
      document.dispatchEvent(new CustomEvent('mw-music', { detail: on }));
    },
    start: function (offset) {
      if (!A.music.isOn() || !ctx || !buffers.music) return false;
      if (music.playing && offset === undefined) return true;
      stopSources(0);
      const buf = buffers.music;
      const fade = (manifest.music && manifest.music.fade) || 1.5;
      let t = ctx.currentTime + 0.05, off = offset || 0;
      const plan = function () {
        const s = ctx.createBufferSource();
        s.buffer = buf; s.connect(musicUser); s.start(t, off);
        const end = t + (buf.duration - off);
        music.sources.push({ s: s, end: end });
        t = end - fade; off = 0;
        music.next = t;
      };
      plan(); plan();
      clearInterval(music.timer);
      music.timer = setInterval(function () {
        if (!ctx) return;
        music.sources = music.sources.filter(function (x) { return x.end > ctx.currentTime; });
        if (music.next - ctx.currentTime < 40) plan();
      }, 4000);
      const g = musicUser.gain, now = ctx.currentTime;
      g.cancelScheduledValues(now); g.setValueAtTime(offset ? 1 : 0, now);
      if (!offset) g.linearRampToValueAtTime(1, now + CONFIG.musicFadeIn);
      music.playing = true;
      MW.log('music', 'start ' + (offset || 0).toFixed(1));
      return true;
    },
    stop: function () {
      if (!ctx) return;
      const g = musicUser.gain, now = ctx.currentTime;
      g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(0, now + 0.4);
      stopSources(0.45);
      music.playing = false;
    },
    // For the grown-ups check: start 6 seconds before a loop join.
    jumpToJoin: function () {
      if (!buffers.music) return false;
      const fade = (manifest.music && manifest.music.fade) || 1.5;
      return A.music.start(Math.max(0, buffers.music.duration - fade - 6));
    },
    playing: function () { return music.playing; },
    level: function () { return musicUser && musicDuck ? musicUser.gain.value * musicDuck.gain.value : 0; }
  };
  function stopSources(after) {
    clearInterval(music.timer);
    const when = ctx ? ctx.currentTime + after : 0;
    music.sources.forEach(function (x) { try { x.s.stop(when); } catch (e) {} });
    music.sources = [];
  }
})();

/* MeeMee World kit: counters and dragging.
   A counter (a MeeMee) is drawn at 80 stage px inside an invisible 120 px grab circle.
   A thing that isn't round (a long tile) carries its own pick-up box instead: grab = { w, h }, centred on it.
   One finger drags at a time; where pick-up areas overlap, the thing whose centre is nearest the finger is picked up. */
(function () {
  'use strict';
  const MW = window.MW;
  const GRAB_R = 60;          // half of mimi-grab (120)
  const BASE = 80;            // mimi-size

  // ---------------------------------------------------------------- counters
  MW.counter = function (layer, opts) {
    opts = opts || {};
    const el = MW.make('div', 'mw-mimi' + (opts.fixed ? ' is-fixed' : ''), { role: 'img', 'aria-label': 'MeeMee' });
    const art = MW.art('mimi');
    el.appendChild(art);
    layer.appendChild(el);
    const c = { el: el, art: art, x: 0, y: 0, size: BASE, draggable: !opts.fixed, home: null, where: null, data: {} };
    c.moveTo = function (x, y, size, animate) {
      c.x = x; c.y = y;
      if (size) c.size = size;
      el.classList.toggle('is-moving', !!animate && !MW.reduceMotion);
      el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      art.style.transform = 'scale(' + (c.size / BASE * (c.lifted ? 1.12 : 1)) + ')';
    };
    c.lift = function (on) { c.lifted = !!on; el.classList.toggle('is-lifted', !!on); };
    c.remove = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    c.moveTo(opts.x || 0, opts.y || 0, opts.size || BASE, false);
    return c;
  };

  // Counting patterns (design system: CountingPatterns): offsets from a circle's centre, and the MeeMee size.
  MW.pattern = function (n) {
    if (n <= 0) return { size: BASE, pts: [] };
    if (n === 1) return { size: 80, pts: [[0, 0]] };
    if (n === 2) return { size: 80, pts: [[-45, 0], [45, 0]] };
    if (n === 3) return { size: 80, pts: [[0, -46], [-45, 34], [45, 34]] };
    if (n === 4) return { size: 80, pts: [[-45, -45], [45, -45], [-45, 45], [45, 45]] };
    if (n === 5) return { size: 56, pts: [[-46, -46], [46, -46], [0, 0], [-46, 46], [46, 46]] };
    if (n === 6) return { size: 56, pts: [[-64, -32], [0, -32], [64, -32], [-64, 32], [0, 32], [64, 32]] };
    const four = [-81, -27, 27, 81], three = [-54, 0, 54];
    const row = function (xs, y) { return xs.map(function (x) { return [x, y]; }); };
    if (n === 7) return { size: 46, pts: row(four, -27).concat(row(three, 27)) };
    if (n === 8) return { size: 46, pts: row(four, -27).concat(row(four, 27)) };
    if (n === 9) return { size: 46, pts: row(three, -54).concat(row(three, 0), row(three, 54)) };
    return { size: 46, pts: row(three, -54).concat(row(four, 0), row(three, 54)) };
  };
  // Positions for n counters in a circle centred at (cx, cy); k scales the pattern (0.9 in the smaller whole circle).
  MW.layout = function (cx, cy, n, k) {
    k = k || 1;
    const p = MW.pattern(Math.min(10, n));
    return p.pts.map(function (d) { return { x: cx + d[0] * k, y: cy + d[1] * k, size: p.size * k }; });
  };

  // ---------------------------------------------------------------- dragging
  // MW.dragger(stageEl, { counters: () => [...], onPick(c), onDrop(c, x, y), grab: radius in stage px (default 60) })
  // Anything with x, y (its centre), draggable, el, lift(on) and moveTo(x, y, size, animate) can be dragged.
  // Each thing is picked up within its own box if it has one (c.grab = { w, h }, in stage px, centred on x, y), or
  // else within the dragger's grab radius. Where they overlap, the thing whose centre is nearest the finger wins.
  const draggers = [];
  MW.dragger = function (surface, opts) {
    let drag = null;
    const stats = MW.dragStats = MW.dragStats || { last: null };

    function nearest(p) {
      const r = opts.grab || GRAB_R;
      let best = null, bestD = Infinity;
      opts.counters().forEach(function (c) {
        if (!c.draggable) return;
        const dx = Math.abs(c.x - p.x), dy = Math.abs(c.y - p.y), d = Math.hypot(dx, dy);
        const inside = c.grab ? dx <= c.grab.w / 2 && dy <= c.grab.h / 2 : d <= r;
        if (inside && d <= bestD) { best = c; bestD = d; }
      });
      return best;
    }

    surface.addEventListener('pointerdown', function (e) {
      if (drag || (opts.enabled && !opts.enabled())) return;
      if (e.button !== undefined && e.button > 0) return;
      const p = MW.stage.toStage(e.clientX, e.clientY);
      const c = nearest(p);
      if (!c) return;
      e.preventDefault();
      try { surface.setPointerCapture(e.pointerId); } catch (err) {}
      drag = { c: c, id: e.pointerId, dx: c.x - p.x, dy: c.y - p.y, tx: c.x, ty: c.y, frames: [], lastT: null, raf: 0 };
      c.lift(true);
      c.el.classList.remove('is-moving');
      c.size = BASE;
      c.moveTo(c.x, c.y, BASE, false);   // .is-lifted puts it above the other counters
      if (opts.onPick) opts.onPick(c);
      MW.lastInput = e.pointerType || 'unknown';
      drag.raf = requestAnimationFrame(frame);
    });

    function frame(t) {
      if (!drag) return;
      if (drag.lastT !== null) drag.frames.push(t - drag.lastT);
      drag.lastT = t;
      drag.c.moveTo(drag.tx, drag.ty, BASE, false);
      drag.raf = requestAnimationFrame(frame);
    }

    surface.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      const p = MW.stage.toStage(e.clientX, e.clientY);
      drag.tx = Math.max(0, Math.min(MW.stage.W, p.x + drag.dx));
      drag.ty = Math.max(0, Math.min(MW.stage.H, p.y + drag.dy));
    }, { passive: true });

    // cancelled: the touch was taken away (a system swipe, the tablet turning) rather than lifted.
    function end(e, cancelled) {
      if (!drag || (e && e.pointerId !== drag.id)) return;
      cancelAnimationFrame(drag.raf);
      const d = drag; drag = null;
      d.c.lift(false);
      d.c.moveTo(d.tx, d.ty, BASE, false);
      record(d.frames);
      if (opts.onDrop) opts.onDrop(d.c, d.tx, d.ty, !!cancelled);
    }
    surface.addEventListener('pointerup', function (e) { end(e, false); });
    surface.addEventListener('pointercancel', function (e) { end(e, true); });
    surface.addEventListener('lostpointercapture', function (e) { end(e, true); });

    function record(frames) {
      if (frames.length < 5) return;
      let sum = 0, worst = 0, slow = 0;
      frames.forEach(function (f) { sum += f; if (f > worst) worst = f; if (f > 34) slow++; });
      stats.last = { fps: Math.round(1000 / (sum / frames.length)), worst: Math.round(worst), slow: slow, n: frames.length };
    }

    const api = { dragging: function () { return !!drag; }, cancel: function () { if (drag) end(null, true); },
      holding: function () { return drag ? drag.c : null; } };
    draggers.push(api);
    return api;
  };
  // Let go of any of these things that a finger is holding, in whichever dragger holds it: its onDrop gets cancelled
  // (as when the tablet takes the touch away), so it goes back. MW.numberTrack's hide() uses it for its tiles.
  MW.dragger.release = function (things) {
    draggers.forEach(function (d) { const c = d.holding(); if (c && things.indexOf(c) >= 0) d.cancel(); });
  };
})();

/* MeeMee World kit: the pieces of a game screen.
   The part–whole diagram (counting look, and the numbers look of MeeMee Rescue's numbers mode), the asteroid tray, the
   number track, Scruffles's pod, progress stars, the equation, sparkles and hint ghosts.
   Positions follow the design system's GameScreen and NumbersMode (1280x800 stage). */
(function () {
  'use strict';
  const MW = window.MW;

  const L = MW.LAYOUT = {
    whole: { x: 380, y: 205, r: 115, k: 0.9 },
    left: { x: 210, y: 470, r: 125, k: 1 },
    right: { x: 550, y: 470, r: 125, k: 1 },
    pillTop: 612,
    pod: { x: 830, y: 70, w: 400 },
    tray: { x: 745, y: 515 },
    traySlots: [],
    equation: { x: 180, y: 700, w: 400, h: 80 },
    stars: { x: 517, y: 34, cx: 640 },     // x: the left edge of five stars; cx: the middle, for MW.stars(…, { centre: true })
    dropSlack: 22,            // a drop this far outside a circle's rim still counts as inside
    // numbers mode (0.6.0): the numbered MeeMee in a circle (the whole's drawn at 0.86), and the number track along the
    // bottom: tiles 0 to 10, 84 across, 94 apart from x 128, their tops at 686, each picked up in a 120 box
    numbered: { whole: 0.86, part: 1 },
    track: { x: 128, top: 686, step: 94, tile: 84, grab: 120, rail: { x: 114, y: 674 }, away: 140 }
  };
  for (let row = 0; row < 2; row++) for (let i = 0; i < 5; i++) L.traySlots.push({ x: L.tray.x + 82 + i * 94, y: L.tray.y + (row ? 180 : 85) });

  function abs(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; return el; }

  // ---------------------------------------------------------------- part–whole diagram
  MW.diagram = function (parent) {
    const d = {};
    const svgNS = 'http://www.w3.org/2000/svg';
    const lines = document.createElementNS(svgNS, 'svg');
    lines.setAttribute('class', 'mw-layer'); lines.setAttribute('width', '1280'); lines.setAttribute('height', '800');
    lines.setAttribute('viewBox', '0 0 1280 800'); lines.setAttribute('aria-hidden', 'true');
    lines.innerHTML = '<g class="s-mint" stroke-width="10" stroke-linecap="round" opacity="0.75">'
      + '<line x1="' + L.whole.x + '" y1="' + L.whole.y + '" x2="' + L.left.x + '" y2="' + L.left.y + '"/>'
      + '<line x1="' + L.whole.x + '" y1="' + L.whole.y + '" x2="' + L.right.x + '" y2="' + L.right.y + '"/></g>';
    parent.appendChild(lines);

    const circles = {}, pills = {}, nums = {};
    ['whole', 'left', 'right'].forEach(function (k) {
      const c = L[k];
      const el = abs(MW.make('div', 'mw-circle ' + (k === 'whole' ? 'mw-circle--whole' : 'mw-circle--part')), c.x - c.r, c.y - c.r);
      parent.appendChild(el);
      circles[k] = el;
      if (k === 'whole') {
        nums.whole = MW.make('span', 'numeral-whole');
        el.appendChild(nums.whole);
      } else {
        const p = abs(MW.make('div', 'mw-pill'), c.x - 45, L.pillTop);
        nums[k] = MW.make('span', 'numeral-part');
        p.appendChild(nums[k]);
        parent.appendChild(p);
        pills[k] = p;
      }
    });
    d.circles = circles; d.pills = pills;

    // The look: 'counting' (the usual: numbers in the whole circle and the pills, "?" where the answer goes) or
    // 'numbers' (MeeMee Rescue's numbers mode, NumbersMode card): no pills and no "?"; each given circle holds a
    // numbered MeeMee carrying its number, and the waiting circle is empty until a number tile is dropped in it.
    let look = 'counting';
    const carriers = {};
    let last = pills.right;                                   // the numbered MeeMee go just above the diagram's circles
    function carrier(k) {
      if (!carriers[k]) {
        const c = L[k];
        const m = carriers[k] = MW.numberedMimi(k === 'whole' ? L.numbered.whole : L.numbered.part);
        m.place(c.x, c.y);
        parent.insertBefore(m.el, last.nextSibling);
        last = m.el;
      }
      return carriers[k];
    }
    d.look = function (name) {
      if (name === undefined) return look;
      look = name === 'numbers' ? 'numbers' : 'counting';
      const off = look === 'numbers';
      pills.left.classList.toggle('mw-off', off); pills.right.classList.toggle('mw-off', off);
      nums.whole.classList.toggle('mw-off', off);
      if (!off) Object.keys(carriers).forEach(function (k) { carriers[k].hide(); });
      return look;
    };
    // A numbered MeeMee carrying n in circle k ('whole', 'left' or 'right'); n null takes it away (numbers look only).
    // pop: it pops up into the circle, as when a right answer is carried (a fade with reduce motion).
    d.carry = function (k, n, pop) {
      if (look !== 'numbers') return;
      if (n === null || n === undefined) { if (carriers[k]) carriers[k].hide(); return; }
      carrier(k).show(n, pop);
    };
    // What circle k's numbered MeeMee is carrying, or null (for checks).
    d.carried = function (k) { return carriers[k] ? carriers[k].shown() : null; };

    // q = { whole, left, right, missing: 'left' | 'right' | 'whole' }
    d.set = function (q) {
      ['whole', 'left', 'right'].forEach(function (k) {
        const waiting = q.missing === k;
        circles[k].classList.toggle('is-waiting', waiting);
        circles[k].classList.remove('is-success', 'is-hinting');
        if (pills[k]) pills[k].classList.toggle('is-waiting', waiting);
        if (pills[k]) pills[k].classList.remove('is-success');
        nums[k].textContent = waiting ? '?' : String(q[k]);
        nums[k].style.visibility = '';
        circles[k].setAttribute('aria-label', k === 'whole' ? 'The whole' : 'A part');
        if (look === 'numbers') d.carry(k, waiting ? null : q[k]);
      });
    };
    // The live count in the waiting circle: its pill shows the number of MeeMee in it ("?" when empty).
    d.count = function (k, n) {
      if (k === 'whole') nums.whole.style.visibility = (n > 0 || circles.whole.classList.contains('is-hinting')) ? 'hidden' : '';
      else nums[k].textContent = n > 0 ? String(n) : '?';
    };
    // The circle is answered: the success ring, and its number shows (in the numbers look, a numbered MeeMee pops up
    // to carry it).
    d.success = function (k, value) {
      circles[k].classList.remove('is-waiting', 'is-hinting');
      circles[k].classList.add('is-success');
      nums[k].textContent = String(value);
      nums[k].style.visibility = '';
      if (pills[k]) { pills[k].classList.remove('is-waiting'); pills[k].classList.add('is-success'); }
      if (look === 'numbers') d.carry(k, value, true);
    };
    d.hinting = function (k, on) {
      circles[k].classList.toggle('is-hinting', !!on);
      if (k === 'whole' && on) nums.whole.style.visibility = 'hidden';   // the ghosts take the "?"'s place
      if (k === 'whole' && !on && !circles.whole.classList.contains('is-success')) nums.whole.style.visibility = '';
    };
    // Which circle a drop landed in, or null.
    d.hit = function (x, y) {
      let found = null;
      ['whole', 'left', 'right'].forEach(function (k) {
        const c = L[k];
        if (Math.hypot(x - c.x, y - c.y) <= c.r + L.dropSlack) found = k;
      });
      return found;
    };
    d.slots = function (k, n) { const c = L[k]; return MW.layout(c.x, c.y, n, c.k); };
    return d;
  };

  // ---------------------------------------------------------------- the asteroid tray
  MW.tray = function (parent) {
    const el = abs(MW.art('tray'), L.tray.x, L.tray.y);
    el.classList.add('mw-abs');
    parent.appendChild(el);
    return { el: el, slots: L.traySlots };
  };

  // ---------------------------------------------------------------- a numbered MeeMee (numbers mode)
  // A MeeMee holding up a peach sign with a number on it (the "numbered-mimi" drawing, 140 x 209, and the number in
  // numeral-sign). k scales it: 1 in a part circle, 0.86 in the whole. MW.diagram's numbers look makes these itself.
  MW.numberedMimi = function (k) {
    k = k || 1;
    const el = MW.make('div', 'mw-numbered mw-abs mw-off', { role: 'img' });
    el.style.transform = 'scale(' + k + ')';
    el.appendChild(MW.art('numbered-mimi'));
    const sign = MW.make('span', 'mw-numbered-sign numeral-sign');
    el.appendChild(sign);
    let shown = null;
    return {
      el: el, k: k,
      // centre it on (cx, cy): the middle of a circle
      place: function (cx, cy) { abs(el, cx - 70, cy - 102.5); },
      show: function (n, pop) {
        shown = n;
        sign.textContent = String(n);
        el.setAttribute('aria-label', 'A MeeMee carrying ' + n);
        el.classList.remove('mw-off', 'is-popping');
        if (pop) { void el.offsetWidth; el.classList.add('is-popping'); }
      },
      hide: function () { shown = null; el.classList.add('mw-off'); el.classList.remove('is-popping'); },
      shown: function () { return shown; }
    };
  };

  // ---------------------------------------------------------------- the number track (numbers mode)
  // Tiles 0 to 10 in order along the bottom on an asteroid rail (NumbersMode card). Each tile is a draggable thing for
  // MW.dragger: x, y (its middle), draggable, el, lift(on), moveTo(x, y, size, animate), with a 120 pick-up box.
  // While a tile is away from its place, the place shows a dashed ring. The game says what a drop does: put the tile
  // in a circle (tile.moveTo(x, y, 0, true)) or send it back (tile.goHome(true)).
  // hide() lets go of a tile a finger is holding (its dragger's onDrop gets cancelled), sends any tile that is out back
  // to its place at once, then slides the track down out of sight (260 ms; a fade with reduce motion); show() brings
  // it back. While it is away its tiles can't be picked up.
  MW.numberTrack = function (parent) {
    const T = L.track;
    const el = MW.make('div', 'mw-track mw-layer mw-fill');
    const rail = abs(MW.art('number-track'), T.rail.x, T.rail.y);
    rail.classList.add('mw-abs');
    el.appendChild(rail);
    const tiles = [];
    for (let n = 0; n <= 10; n++) {
      const x = T.x + n * T.step;
      const place = abs(MW.make('div', 'mw-track-place'), x + 6, T.top + 6);
      el.appendChild(place);
      tiles.push(numberTile(el, n, { x: x + T.tile / 2, y: T.top + T.tile / 2 }, place));
    }
    parent.appendChild(el);
    let away = false;
    const track = {
      el: el, tiles: tiles,
      tile: function (n) { return tiles[n]; },
      away: function () { return away; },
      // every tile back in its place at once
      reset: function () { tiles.forEach(function (t) { t.lift(false); t.goHome(false); }); },
      hide: function () {
        MW.dragger.release(tiles);                            // a tile held as the track goes: let go of it first
        track.reset();
        away = true;
        tiles.forEach(function (t) { t.draggable = false; });
        void el.offsetWidth;                                  // slide from where it is now, even if it has only just been drawn
        el.classList.add('is-away');
        MW.log('track', 'away');
      },
      show: function () {
        away = false;
        tiles.forEach(function (t) { t.draggable = true; });
        void el.offsetWidth;
        el.classList.remove('is-away');
        MW.log('track', 'back');
      }
    };
    return track;
  };
  // One number tile: the "number-tile" drawing with its number in numeral-part, 84 across, in a 120 pick-up box.
  function numberTile(layer, n, home, place) {
    const el = MW.make('div', 'mw-number-tile', { role: 'img', 'aria-label': String(n) });
    const body = MW.make('div', 'mw-number-tile-body');
    body.appendChild(MW.art('number-tile'));
    body.appendChild(MW.make('span', 'mw-number-tile-n numeral-part', null, String(n)));
    el.appendChild(body);
    layer.appendChild(el);
    const t = { el: el, n: n, home: home, x: home.x, y: home.y, size: L.track.tile, draggable: true,
      grab: { w: L.track.grab, h: L.track.grab } };
    t.moveTo = function (x, y, size, animate) {
      t.x = x; t.y = y;
      el.classList.toggle('is-moving', !!animate && !MW.reduceMotion);
      el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
      place.classList.toggle('is-out', Math.abs(x - home.x) > 0.5 || Math.abs(y - home.y) > 0.5);
    };
    t.lift = function (on) { t.lifted = !!on; el.classList.toggle('is-lifted', !!on); };
    t.goHome = function (animate) { t.moveTo(home.x, home.y, 0, animate); };
    t.out = function () { return place.classList.contains('is-out'); };
    t.moveTo(home.x, home.y, 0, false);
    return t;
  }

  // ---------------------------------------------------------------- Scruffles in the pod
  MW.pod = function (parent, x, y, w) {
    const btn = abs(MW.make('button', 'mw-pod', { type: 'button', 'aria-label': 'Scruffles' }), x, y);
    const art = MW.art('pod');
    art.setAttribute('width', w); art.setAttribute('height', Math.round(w * 430 / 400));
    btn.appendChild(art);
    parent.appendChild(btn);
    const pod = { el: btn };
    pod.face = function (name) {
      Array.prototype.forEach.call(art.querySelectorAll('[data-face]'), function (g) {
        g.style.display = g.getAttribute('data-face') === name ? '' : 'none';
      });
      btn.setAttribute('data-face', name);
    };
    // The ship's lights flash for about 4 seconds (kit.css). Small lights only, each under 2 flashes a second;
    // with reduce motion they just stay lit for those 4 seconds.
    let lightsTimer = null;
    pod.lightsOff = function () {
      clearTimeout(lightsTimer);
      btn.classList.remove('is-celebrating', 'is-ready');
    };
    // "Ready to check": the lights glow steadily (no flashing) while there is something for Scruffles to check.
    pod.ready = function (on) { btn.classList.toggle('is-ready', !!on && !btn.classList.contains('is-celebrating')); };
    pod.celebrate = function () {
      pod.lightsOff();
      void btn.getBoundingClientRect();                    // so the flashing starts again from the beginning
      btn.classList.add('is-celebrating');
      lightsTimer = setTimeout(pod.lightsOff, 4100);
    };
    pod.face('thinking');
    return pod;
  };

  // ---------------------------------------------------------------- progress stars
  // MW.stars(parent, x, y, size): x is the row's left edge. MW.stars(parent, cx, y, size, { centre: true }): the row is
  // centred on cx, however many stars set(done, total) shows (MW.LAYOUT.stars.cx is the usual middle, 640). Either
  // way the row's left edge is set in px, so its offsetLeft and its place on screen agree.
  MW.stars = function (parent, x, y, size, opts) {
    const centre = !!(opts && opts.centre);
    const el = abs(MW.make('div', 'mw-stars', { role: 'img' }), x, y);
    parent.appendChild(el);
    const STAR = '24,5 29.3,17.7 43,18.8 32.6,27.8 35.8,41.2 24,34 12.2,41.2 15.4,27.8 5,18.8 18.7,17.7';
    const cls = { done: 'class="f-peach s-peach" stroke-width="3"', current: 'class="f-night s-mint" stroke-width="4"',
      todo: 'class="s-star-empty" fill="none" stroke-width="3"' };
    size = size || 38;
    return {
      el: el,
      set: function (done, total) {
        total = total || 5;
        let html = '';
        for (let i = 0; i < total; i++) {
          const s = i < done ? 'done' : (i === done ? 'current' : 'todo');
          html += '<svg width="' + size + '" height="' + size + '" viewBox="0 0 48 48" aria-hidden="true" data-state="' + s + '">'
            + '<polygon ' + cls[s] + ' stroke-linejoin="round" points="' + STAR + '"/></svg>';
        }
        el.innerHTML = html;
        el.setAttribute('aria-label', 'Question ' + Math.min(done + 1, total) + ' of ' + total);
        if (centre) el.style.left = (x - (total * size + (total - 1) * starGap()) / 2) + 'px';
      }
    };
  };

  // the gap between stars: the space-s token (14 px), read from the page's tokens
  let gapPx = null;
  function starGap() {
    if (gapPx === null) gapPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--space-s')) || 14;
    return gapPx;
  }

  // ---------------------------------------------------------------- the equation
  MW.equation = function (parent) {
    const e = L.equation;
    const el = abs(MW.make('div', 'mw-equation equation', { 'aria-live': 'polite' }), e.x, e.y);
    el.style.width = e.w + 'px'; el.style.height = e.h + 'px';
    parent.appendChild(el);
    return {
      el: el,
      show: function (a, b, w) {
        el.innerHTML = '<span>' + a + '</span><span class="op">+</span><span>' + b + '</span><span class="op">=</span><span>' + w + '</span>';
        el.classList.add('is-shown');
      },
      hide: function () { el.classList.remove('is-shown'); el.innerHTML = ''; }
    };
  };

  // ---------------------------------------------------------------- sparkles: grow in 300 ms, fade by 1.2 s, never blink
  MW.sparkles = function (parent, cx, cy, r) {
    const n = 5;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + i * (2 * Math.PI / n) + 0.3;
      const s = MW.art('spark');
      s.classList.add('mw-spark');
      const size = i % 2 ? 30 : 40;
      s.setAttribute('width', size); s.setAttribute('height', size);
      abs(s, cx + Math.cos(a) * r - size / 2, cy + Math.sin(a) * r - size / 2);
      parent.appendChild(s);
      setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1300);
    }
  };

  // ---------------------------------------------------------------- hint ghosts: where the missing MeeMee would go
  MW.ghosts = function (parent, positions) {
    const els = positions.map(function (p) {
      const g = MW.make('div', 'mw-ghost');
      g.style.width = g.style.height = p.size + 'px';
      abs(g, p.x - p.size / 2, p.y - p.size / 2);
      parent.appendChild(g);
      return g;
    });
    return {
      light: function (i) { if (els[i]) els[i].classList.add('is-lit'); },
      clear: function () { els.forEach(function (g) { if (g.parentNode) g.parentNode.removeChild(g); }); }
    };
  };
})();

/* MeeMee World kit: the home map (phase 4; a planet per game from phase 5).
   An alien solar system: each game is a planet. The drawing is the "map" art (design/gen_scenes.py, whose MAP holds
   the same positions, and draws a game's planet lit and an empty one dimmed); this file puts the buttons over it.
   Three planets: 0 the ringed mint planet (MeeMee Rescue), 1 the indigo planet, 2 the small peach planet. A game says
   which is its own in its game.json. Tapping a game's planet (or its badge) opens it; an empty planet says
   "That planet isn't ready yet." The crew wait by Scruffles's ship, wearing their job badges; tapping them opens the
   crew screen (kit/crew.js). */
(function () {
  'use strict';
  const MW = window.MW;

  const M = MW.LAYOUT.map = {
    // tap: the tap area across (at least 120 stage px, design system); badge: where a game's picture sits;
    // lock: what an empty planet shows instead
    planets: [
      { x: 330, y: 300, tap: 180, badge: { x: 368, y: 166, d: 84, pic: 56 }, lock: { x: 368, y: 190, d: 60, icon: 30 } },
      { x: 1010, y: 560, tap: 130, badge: { x: 1040, y: 446, d: 84, pic: 56 }, lock: { x: 1056, y: 470, d: 60, icon: 30 } },
      { x: 1150, y: 250, tap: 120, badge: { x: 1172, y: 158, d: 72, pic: 48 }, lock: { x: 1186, y: 196, d: 50, icon: 24 } }
    ],
    ship: { x: 155, y: 400, w: 190 },
    crew: [{ who: 'moggles', x: 44, y: 456, w: 112 }, { who: 'snuffles', x: 344, y: 456, w: 112 }],
    crewTap: { x: 34, y: 392, w: 432, h: 236 }                // the ship and both cats
  };

  function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; return el; }

  // opts: { games: [{ planet, badge, name, onOpen }], onLocked: fn, onCrew: fn }
  MW.map = function (parent, opts) {
    const map = { badges: {} };
    const art = MW.art('map');
    art.setAttribute('class', 'mw-layer');
    parent.appendChild(art);

    // the crew by the ship: one big button that opens the crew screen
    const ship = MW.art('pod');
    ship.setAttribute('width', M.ship.w); ship.setAttribute('height', Math.round(M.ship.w * 430 / 400));
    Array.prototype.forEach.call(ship.querySelectorAll('[data-face]'), function (g) { g.style.display = g.getAttribute('data-face') === 'thinking' ? '' : 'none'; });
    const shipBox = place(MW.make('div', 'mw-abs mw-map-crew'), M.ship.x, M.ship.y);
    shipBox.appendChild(ship);
    parent.appendChild(shipBox);
    map.crew = {};
    M.crew.forEach(function (c) {
      const box = place(MW.make('div', 'mw-abs mw-map-crew', { 'data-who': c.who }), c.x, c.y);
      const cat = MW.crew.cat(c.who, c.w);
      box.appendChild(cat);
      parent.appendChild(box);
      map.crew[c.who] = cat;
    });
    const t = M.crewTap;
    const crewBtn = place(MW.make('button', 'mw-map-crew-btn mw-abs', { type: 'button', 'aria-label': 'The crew' }), t.x, t.y);
    crewBtn.style.width = t.w + 'px'; crewBtn.style.height = t.h + 'px';
    parent.appendChild(crewBtn);
    MW.onTap(crewBtn, function () { if (opts.onCrew) opts.onCrew(); });
    map.crewBtn = crewBtn;
    // their job badges, as given on the crew screen
    map.setCrew = function (jobs) { MW.crew.CATS.forEach(function (w) { map.crew[w].setJob(jobs[w]); }); };
    // no jobs yet: the cats hop, to say "tap us"
    map.callCrew = function () { map.crew.moggles.hop(0); map.crew.snuffles.hop(180); };

    // the planets: a game's is one big button with its badge; an empty one is dimmed, with a lock
    map.planets = M.planets.map(function (p, i) {
      const g = (opts.games || []).filter(function (x) { return x.planet === i; })[0];
      const b = place(MW.make('button', 'mw-planet mw-abs', { type: 'button', 'aria-label': g ? g.name : 'A planet that isn\'t ready yet' }), p.x - p.tap / 2, p.y - p.tap / 2);
      b.style.width = b.style.height = p.tap + 'px';
      parent.appendChild(b);
      const go = function () { if (g) { if (g.onOpen) g.onOpen(); } else if (opts.onLocked) opts.onLocked(); };
      MW.onTap(b, go);
      if (g) {
        const badge = place(MW.make('button', 'mw-planet-badge mw-abs', { type: 'button', 'aria-label': g.name }), p.badge.x, p.badge.y);
        badge.style.width = badge.style.height = p.badge.d + 'px';
        const pic = MW.art(g.badge); pic.setAttribute('width', p.badge.pic); pic.setAttribute('height', p.badge.pic);
        badge.appendChild(pic);
        parent.appendChild(badge);
        MW.onTap(badge, go);
        map.badges[i] = badge;
      } else {
        const lock = place(MW.make('div', 'mw-planet-lock mw-abs'), p.lock.x, p.lock.y);
        lock.style.width = lock.style.height = p.lock.d + 'px';
        const icon = MW.art('icon-lock'); icon.setAttribute('width', p.lock.icon); icon.setAttribute('height', p.lock.icon);
        lock.appendChild(icon);
        parent.appendChild(lock);
        MW.onTap(lock, go);
      }
      return b;
    });

    // a little bounce on a planet's badge when it is chosen
    map.bounce = function (i) {
      const badge = map.badges[i];
      if (!badge) return;
      badge.classList.remove('is-hop'); void badge.getBoundingClientRect(); badge.classList.add('is-hop');
    };
    return map;
  };
})();

/* MeeMee World kit: the crew (phase 4, 0.4.1).
   Moggles and Snuffles each get a job (lookout, engineer, navigator or cook) on the crew screen, by dragging the cat
   onto the job's picture: one job per cat, never the same job for both. Each tablet remembers the jobs. A cat wears its
   job as a badge on its chest on the map, the crew screen and the end screen; the game gives each job a moment.
   Layout from the design canvas's round 4 (Crew4). */
(function () {
  'use strict';
  const MW = window.MW;
  const CATS = ['moggles', 'snuffles'];
  const JOBS = ['lookout', 'engineer', 'navigator', 'cook'];
  const C = MW.crew = { CATS: CATS, JOBS: JOBS };

  // ---------------------------------------------------------------- the jobs, saved on this tablet
  C.jobs = function () {
    const saved = MW.store.setting('crew') || {};
    const out = {};
    CATS.forEach(function (c) { out[c] = JOBS.indexOf(saved[c]) >= 0 ? saved[c] : null; });
    if (out.moggles && out.moggles === out.snuffles) out.snuffles = null;    // never the same job twice
    return out;
  };
  C.save = function (jobs) { MW.store.setting('crew', { moggles: jobs.moggles || null, snuffles: jobs.snuffles || null }); };
  C.who = function (job) { const j = C.jobs(); return CATS.filter(function (c) { return j[c] === job; })[0] || null; };
  C.ready = function () { const j = C.jobs(); return CATS.every(function (c) { return !!j[c]; }); };
  // "Moggles… is the… lookout."
  C.line = function (cat, job) { return ['name-' + cat, 'is-the', 'job-' + job]; };

  // ---------------------------------------------------------------- a cat with a place for its badge
  // MW.crew.cat('moggles', 112) -> a box w wide; box.setJob('cook') puts the badge on its chest (null takes it off).
  C.cat = function (who, w) {
    const h = Math.round(w * 340 / 260);
    const box = MW.make('div', 'mw-cat', { 'data-who': who });
    box.style.width = w + 'px'; box.style.height = h + 'px';
    const body = MW.make('div', 'mw-cat-body');
    const pic = MW.art(who); pic.setAttribute('width', w); pic.setAttribute('height', h);
    body.appendChild(pic);
    box.appendChild(body);
    const b = Math.max(26, Math.round(w * 0.26));
    let badge = null;
    box.w = w; box.h = h; box.body = body;
    box.setJob = function (job) {
      if (badge) { body.removeChild(badge); badge = null; }
      box.setAttribute('data-job', job || '');
      if (!job) return;
      badge = MW.art('badge-' + job);
      badge.setAttribute('width', b); badge.setAttribute('height', b);
      badge.setAttribute('class', 'mw-badge');
      badge.style.left = Math.round(w * 130 / 260 - b / 2) + 'px';
      badge.style.top = Math.round(h * 238 / 340 - b / 2) + 'px';
      body.appendChild(badge);
    };
    box.hop = function (delay) {
      setTimeout(function () { body.classList.remove('is-hop'); void body.getBoundingClientRect(); body.classList.add('is-hop'); }, delay || 0);
    };
    return box;
  };

  // ---------------------------------------------------------------- the crew screen
  const L = MW.LAYOUT.crew = {
    ship: { x: 530, y: 40, w: 220 },
    deck: { moggles: { x: 220, y: 368 }, snuffles: { x: 380, y: 368 } },     // where each cat's feet go before it has a job
    stations: [{ job: 'lookout', x: 40 }, { job: 'engineer', x: 350 }, { job: 'navigator', x: 660 }, { job: 'cook', x: 970 }],
    top: 420, w: 270, h: 340, disc: 124, pic: 98, spotY: 726,
    cat: 136, foot: 173,          // a cat's width, and how far below the top of its picture its feet are
    dropY: 430,                   // a cat let go with its middle below this line takes the nearest job
    grab: 92                      // the cats are big: a finger anywhere on one picks it up
  };
  function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; return el; }

  // opts: { speak(lines), onHome(), enabled() }
  C.screen = function (parent, opts) {
    const scr = {};
    const art = MW.art('crew'); art.setAttribute('class', 'mw-layer');
    parent.appendChild(art);
    const ship = MW.art('pod');
    ship.setAttribute('width', L.ship.w); ship.setAttribute('height', Math.round(L.ship.w * 430 / 400));
    Array.prototype.forEach.call(ship.querySelectorAll('[data-face]'), function (g) { g.style.display = g.getAttribute('data-face') === 'thinking' ? '' : 'none'; });
    const shipBox = place(MW.make('div', 'mw-abs mw-map-crew'), L.ship.x, L.ship.y);
    shipBox.appendChild(ship);
    parent.appendChild(shipBox);

    const stations = L.stations.map(function (s) {
      const el = place(MW.make('div', 'mw-station mw-abs', { 'data-job': s.job }), s.x, L.top);
      el.style.width = L.w + 'px'; el.style.height = L.h + 'px';
      const disc = place(MW.make('div', 'mw-station-disc mw-abs'), (L.w - L.disc) / 2, 14);
      const pic = MW.art('job-' + s.job); pic.setAttribute('width', L.pic); pic.setAttribute('height', L.pic);
      disc.appendChild(pic);
      el.appendChild(disc);
      const sy = L.spotY - L.top;
      el.insertAdjacentHTML('beforeend', '<svg class="mw-station-spot" width="' + L.w + '" height="' + L.h + '" viewBox="0 0 ' + L.w + ' ' + L.h + '" aria-hidden="true">'
        + '<ellipse class="f-mint mw-spot-fill" cx="' + (L.w / 2) + '" cy="' + sy + '" rx="92" ry="17"/>'
        + '<ellipse class="s-mint mw-spot-rim" fill="none" stroke-width="3" stroke-linecap="round" cx="' + (L.w / 2) + '" cy="' + sy + '" rx="92" ry="17"/></svg>');
      parent.appendChild(el);
      return { job: s.job, cx: s.x + L.w / 2, el: el };
    });

    const cats = {};
    CATS.forEach(function (who) {
      const box = C.cat(who, L.cat);
      box.classList.add('mw-crew-cat');
      parent.appendChild(box);
      const c = { el: box, who: who, x: 0, y: 0, size: 80, draggable: true };
      c.moveTo = function (x, y, size, animate) {
        c.x = x; c.y = y;
        box.classList.toggle('is-moving', !!animate && !MW.reduceMotion);
        box.style.transform = 'translate3d(' + (x - box.w / 2) + 'px,' + (y - box.h / 2) + 'px,0)';
      };
      c.lift = function (on) { box.classList.toggle('is-lifted', !!on); };
      cats[who] = c;
    });
    scr.cats = cats; scr.stations = stations;

    const nav = MW.shell.buttons(parent, ['home', 'music', 'hear'], {
      home: function () { if (opts.onHome) opts.onHome(); },
      hear: function () { scr.intro(); }
    });

    function feet(who, job) {
      if (!job) return L.deck[who];
      const s = stations.filter(function (x) { return x.job === job; })[0];
      return { x: s.cx, y: L.spotY };
    }
    function layout(animate) {
      const jobs = C.jobs();
      CATS.forEach(function (who) {
        const f = feet(who, jobs[who]), c = cats[who];
        c.moveTo(f.x, f.y - L.foot + c.el.h / 2, 80, animate);
        c.el.setJob(jobs[who]);
      });
      stations.forEach(function (s) {
        s.el.classList.toggle('is-taken', CATS.some(function (w) { return jobs[w] === s.job; }));
      });
      nav.home.classList.toggle('mw-pulse', C.ready());       // the crew are ready: back to the map
    }
    scr.layout = layout;

    function onDrop(c, x, y, cancelled) {
      if (cancelled || (opts.enabled && !opts.enabled())) { layout(true); return; }
      const jobs = C.jobs();
      const was = jobs[c.who];
      const other = CATS.filter(function (w) { return w !== c.who; })[0];
      let job = null;
      if (y > L.dropY) {
        let best = Infinity;
        stations.forEach(function (s) { const d = Math.abs(x - s.cx); if (d < best) { best = d; job = s.job; } });
      }
      let swapped = false;
      if (job && job !== was && jobs[other] === job) { jobs[other] = was; swapped = true; }   // the two cats swap places
      jobs[c.who] = job;
      C.save(jobs);
      layout(true);
      MW.log('crew', c.who + ' ' + (job || 'no job') + (swapped ? ', ' + other + ' ' + (jobs[other] || 'no job') : ''));
      if (!job) { if (was) MW.audio.sfx('whoosh'); return; }
      MW.audio.sfx('pop');
      c.el.hop(260);
      const lines = [C.line(c.who, job)];
      if (swapped && jobs[other]) lines.push(C.line(other, jobs[other]));
      if (C.ready() && (job !== was || swapped)) lines.push(['crew-ready']);   // not again for a tap on a cat
      if (opts.speak) opts.speak(lines);
    }
    scr.dragger = MW.dragger(parent, {
      counters: function () { return CATS.map(function (w) { return cats[w]; }); },
      enabled: function () { return !opts.enabled || opts.enabled(); },
      onDrop: onDrop,
      grab: L.grab
    });

    // what the screen says when it opens, and again on Hear-again
    scr.intro = function () {
      const jobs = C.jobs();
      if (C.ready()) return opts.speak(CATS.map(function (w) { return C.line(w, jobs[w]); }));
      return opts.speak([['crew-jobs']]);
    };
    scr.enter = function () { layout(false); scr.intro(); };
    layout(false);
    return scr;
  };
})();

/* MeeMee World kit: the shell around every game.
   Screens, full screen and landscape on the first tap, "turn me sideways", the buttons the player taps,
   and the grown-ups lock (press and hold for 3 seconds). */
(function () {
  'use strict';
  const MW = window.MW;
  const S = MW.shell = { screen: null, paused: false };
  MW.device = { full: 'Not tried yet', fullOk: null, orient: '', loadMs: null };

  // ---------------------------------------------------------------- screens
  S.show = function (id) {
    Array.prototype.forEach.call(document.querySelectorAll('.mw-screen'), function (s) {
      s.classList.toggle('is-shown', s.id === id);
    });
    S.screen = id;
    MW.log('screen', id);
    S.reloadIfIdle();
  };
  S.reloadIfIdle = function () {
    // a new version takes over only on a screen where nothing is lost: the start screen or the home map
    if (S.updateReady && (S.screen === 'screen-start' || S.screen === 'screen-map') && !(MW.grownups && MW.grownups.open)) location.reload();
  };

  // ---------------------------------------------------------------- full screen and landscape (needs a tap)
  S.fullscreen = function () {
    const el = document.documentElement;
    const isFull = document.fullscreenElement || document.webkitFullscreenElement;
    const mm = window.matchMedia;
    const app = mm && (mm('(display-mode: fullscreen)').matches || mm('(display-mode: standalone)').matches);
    if (isFull || app) { MW.device.full = app ? 'Opened as an app (already full screen)' : 'Already full screen'; MW.device.fullOk = true; lock(); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) { MW.device.full = 'Not available in this browser'; MW.device.fullOk = false; return; }
    try {
      const p = req.call(el, { navigationUI: 'hide' });
      const ok = function () { MW.device.full = 'Worked'; MW.device.fullOk = true; lock(); };
      if (p && p.then) p.then(ok).catch(function (err) { MW.device.full = 'Refused (' + err.name + ')'; MW.device.fullOk = false; });
      else setTimeout(ok, 300);
    } catch (err) { MW.device.full = 'Failed: ' + err.message; MW.device.fullOk = false; }
  };
  function lock() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').then(function () { MW.device.orient = 'locked to landscape'; })
        .catch(function (err) { MW.device.orient = 'could not lock (' + err.name + ')'; });
    } else { MW.device.orient = 'lock not available'; }
  }

  // ---------------------------------------------------------------- buttons the player taps (pictures, never words)
  // Positions from the design system: Home top-left, Music and Hear-again top-right.
  S.buttons = function (parent, which, handlers) {
    const out = {};
    if (which.indexOf('home') >= 0) {
      out.home = button(parent, 'mw-btn mw-btn--nav', 24, 20, 'Home', 'icon-home', 44);
      MW.onTap(out.home, function () { if (handlers.home) handlers.home(); });
    }
    if (which.indexOf('music') >= 0) {
      out.music = button(parent, 'mw-btn mw-btn--nav mw-music', which.indexOf('hear') >= 0 ? 1052 : 1172, 26, 'Music', null, 40);
      MW.onTap(out.music, function () { MW.audio.music.setOn(!MW.audio.music.isOn()); });
      paintMusic(out.music);
    }
    if (which.indexOf('hear') >= 0) {
      out.hear = button(parent, 'mw-btn mw-btn--main', 1160, 20, 'Hear it again', 'icon-hear', 54);
      MW.onTap(out.hear, function () { if (handlers.hear) handlers.hear(); });
    }
    return out;
  };
  function button(parent, cls, x, y, label, icon, size) {
    const b = MW.make('button', cls + ' mw-abs', { type: 'button', 'aria-label': label });
    b.style.left = x + 'px'; b.style.top = y + 'px';
    if (icon) { const i = MW.art(icon); i.setAttribute('width', size); i.setAttribute('height', size); b.appendChild(i); }
    b.setAttribute('data-icon-size', size);
    parent.appendChild(b);
    return b;
  }
  function paintMusic(b) {
    const on = MW.audio.music.isOn();
    const size = +b.getAttribute('data-icon-size');
    b.innerHTML = '';
    const i = MW.art(on ? 'icon-music' : 'icon-music-off');
    i.setAttribute('width', size); i.setAttribute('height', size);
    b.appendChild(i);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.setAttribute('aria-label', on ? 'Music on' : 'Music off');
  }
  document.addEventListener('mw-music', function () {
    Array.prototype.forEach.call(document.querySelectorAll('.mw-music'), paintMusic);
  });

  // ---------------------------------------------------------------- the grown-ups lock
  // A quick tap does nothing and shows nothing. Holding fills a mint ring over 3 s, then opens the grown-ups area.
  S.gate = function (parent, onOpen) {
    const HOLD = 3000;
    const b = MW.make('button', 'mw-btn mw-btn--grownups mw-gate mw-abs', { type: 'button', 'aria-label': 'Grown-ups (press and hold)' });
    b.style.left = '24px'; b.style.top = '732px';
    const ring = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ring, 'svg');
    svg.setAttribute('class', 'mw-gate-ring'); svg.setAttribute('viewBox', '0 0 64 64'); svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = '<circle class="s-night-button" fill="none" stroke-width="5" cx="32" cy="32" r="29"/>'
      + '<circle class="mw-gate-fill s-mint" fill="none" stroke-width="5" cx="32" cy="32" r="29" stroke-dasharray="182.2" stroke-dashoffset="182.2" transform="rotate(-90 32 32)"/>';
    b.appendChild(svg);
    const icon = MW.art('icon-lock'); icon.setAttribute('width', 24); icon.setAttribute('height', 24);
    b.appendChild(icon);
    parent.appendChild(b);
    // One finger only, held still on the lock: a palm, two fingers or a thumb sliding off don't count.
    let timer = 0, hold = null;
    const fill = svg.querySelector('.mw-gate-fill');
    function start(e) {
      e.preventDefault();
      if (hold) { stop(); return; }                      // a second finger cancels
      hold = { id: e.pointerId, x: e.clientX, y: e.clientY };
      b.classList.add('is-holding');
      fill.style.transition = 'stroke-dashoffset ' + HOLD + 'ms linear';
      fill.style.strokeDashoffset = '0';
      clearTimeout(timer);
      timer = setTimeout(function () { stop(); onOpen(); }, HOLD);
    }
    function stop() {
      hold = null;
      clearTimeout(timer);
      b.classList.remove('is-holding');
      fill.style.transition = 'none';
      fill.style.strokeDashoffset = '182.2';
    }
    function moved(e) {
      if (!hold || e.pointerId !== hold.id) return;
      if (Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 25) stop();
    }
    b.addEventListener('pointerdown', start);
    b.addEventListener('pointermove', moved);
    b.addEventListener('pointerup', stop);
    b.addEventListener('pointercancel', stop);
    b.addEventListener('pointerleave', stop);
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    return b;
  };

  // ---------------------------------------------------------------- turn me sideways
  S.watchSideways = function (onPortrait, onLandscape) {
    const mq = window.matchMedia('(orientation: portrait)');
    let was = mq.matches;
    const check = function () {
      if (mq.matches === was) return;
      was = mq.matches;
      if (was) onPortrait(); else onLandscape();
    };
    if (mq.addEventListener) mq.addEventListener('change', check); else mq.addListener(check);
    return function () { return mq.matches; };
  };

  // No long-press menus, no double-tap zoom.
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  // ---------------------------------------------------------------- offline copy
  S.offline = { text: 'Checking…', ok: null };
  S.registerOffline = function () {
    if (!('serviceWorker' in navigator) || !window.isSecureContext) {

      return;
    }
    const controlled = !!navigator.serviceWorker.controller;
    // A new version has been saved: switch to it the next time the start screen shows, never mid-round.
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'mw-updated') { S.updateReady = true; MW.log('update', e.data.version); S.reloadIfIdle(); }
    });
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      // Ask for a newer version a few seconds after opening (and hourly while open), so updates arrive on the first visit.
      const check = function () { if (navigator.onLine) reg.update().catch(function () {}); };
      setTimeout(check, 8000);
      setInterval(check, 3600 * 1000);
      return navigator.serviceWorker.ready;
    }).then(function () {
      S.offline = controlled ? { text: 'Opened from the saved copy', ok: true } : { text: 'Saved for offline; works from the next visit', ok: true };
    }).catch(function (err) { S.offline = { text: 'Could not save (' + err.name + ')', ok: false }; });
  };
})();

(function () {

    head.appendChild(close);
