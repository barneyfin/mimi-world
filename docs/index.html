      render: function (el) {
        G.p(el, 'Photograph this table on each tablet and send it to Claude.', 'gu-lead');
        const t = G.table(el, G.deviceRows());
        const again = G.btn(el, 'Refresh', function () { const n = G.table(MW.make('div'), G.deviceRows()); t.innerHTML = n.innerHTML; });
        again.classList.add('gu-small');
      }
    };
  }

  // ---------------------------------------------------------------- Checks: voice, music and effects
  const SAMPLES = [
    ['Three and four make seven', [['num-mid-3', 'and', 'num-mid-4', 'make', 'num-end-7']]],
    ['Missing part question (7, given 3)', [['q-lets-make', 'num-end-7'], ['q-weve-got', 'num-end-3'], ['q-how-many-more']]],
    ['Missing whole question (2 and 5)', [['q-weve-got', 'num-mid-2', 'and', 'num-end-5'], ['q-how-many-altogether']]],
    ['Counting-on hint (3 up to 7)', [['q-count-on-from', 'num-end-3'], ['num-mid-4'], ['num-mid-5'], ['num-mid-6'], ['num-end-7']]],
    ['Ten and zero make ten', [['num-mid-10', 'and', 'num-mid-0', 'make', 'num-end-10']]]
  ];
  function soundSection() {
    return {
      id: 'sound', title: 'Sound',
      render: function (el) {
        const status = MW.make('p', 'gu-p gu-lead', null, MW.audio.running() ? 'Tap any line to hear it.' : 'Sound starts after the first tap on Play.');
        el.appendChild(status);
        G.h3(el, 'Sentences built from the pieces');
        let r = G.row(el);
        SAMPLES.forEach(function (s) { G.btn(r, s[0], function () { MW.audio.say(s[1]); }); });
        G.btn(r, 'Every clip in turn', function () {
          const ids = Object.keys(MW.audio.manifest.voice);
          MW.audio.say(ids.map(function (id) { return [id]; }));
        });
        G.btn(r, 'Stop', function () { MW.audio.hush(); }, 'gu-quiet');

        G.h3(el, 'Music');
        r = G.row(el);
        const tog = G.btn(r, MW.audio.music.isOn() ? 'Music is on: turn off' : 'Music is off: turn on', function (b) {
          MW.audio.music.setOn(!MW.audio.music.isOn());
          b.textContent = MW.audio.music.isOn() ? 'Music is on: turn off' : 'Music is off: turn on';
        });
        G.btn(r, 'Hear the loop join', function () {
          if (!MW.audio.music.isOn()) { MW.audio.music.setOn(true); tog.textContent = 'Music is on: turn off'; }
          MW.audio.music.jumpToJoin();
        });
        G.btn(r, 'Hear the dip under a line', function () { MW.audio.say(SAMPLES[1][1]); });
        G.p(el, 'The loop join starts 6 seconds before the end of the track: listen for a smooth fade into the start. During a spoken line the music should drop, then come back.', 'gu-note');

        G.h3(el, 'Sound effects');
        r = G.row(el);
        [['Drop chime', 'chime'], ['Pop', 'pop'], ['Whoosh', 'whoosh'], ['Star', 'twinkle'], ['End of round', 'tune']].forEach(function (e) {
          G.btn(r, e[0], function () { MW.audio.sfx(e[1]); });
        });

        G.h3(el, 'Every clip');
        const groups = {};
        (window.MW_SCRIPT || []).forEach(function (c) { (groups[c.group] = groups[c.group] || []).push(c); });
        Object.keys(groups).forEach(function (g) {
          el.appendChild(MW.make('div', 'gu-group label', null, MW.esc(g)));
          const gr = G.row(el);
          groups[g].forEach(function (c) {
            const b = G.btn(gr, c.words, function () { MW.audio.say([[c.id]]); }, 'gu-clip');
            b.title = c.id;
          });
        });
      }
    };
  }
})();

/* MeeMee World kit: the world shell (phase 5; title banners from 0.6.0).
   What every game shares, so a game is only its own play:
     the start screen (Play: sound and full screen start on that first tap), the home map with a place for each game,
     the title banners (the set's name as the map first opens, a game's as its place is tapped), the crew screen,
     pausing (grown-ups area open, tablet upright, screen off), the grown-ups area, and updates.
   One page holds every game (decided 10 October). A game joins by calling MW.world.game({...}) when its script loads;
   its folder's game.json (read by the build, here as MW_GAMES) says its name, planet, badge and spoken name.
   The meemee-world skill (.claude/skills/meemee-world/reference.md) documents all of this. */
(function () {
  'use strict';
  const MW = window.MW;
  const W = MW.world = { games: [], map: null, crewScreen: null };
  // One state for the page: a token that changes whenever the player leaves what they were doing (speech and timers
  // from before check it), the current phase ('idle' start screen, 'map', 'opening', 'crew', or the game's own),
  // and the reasons the world is paused.
  const st = W.st = { token: 0, phase: 'idle', paused: false, pauses: {}, welcomed: false };

  // One game going wrong never stops the others: each call into a game is caught, logged and shown in the console.
  function each(fn) {
    W.games.forEach(function (g) {
      try { fn(g); } catch (e) { MW.log('game-error', g.id + ': ' + e); console.error('MeeMee World: ' + g.id + ':', e); }
    });
  }

  // ---------------------------------------------------------------- games join
  // def: { id, build(), start(), sections: [{ id, title, render(el) }], onPause(why), onResume(), onHome(), init() }
  // id must match a games/<id>/game.json; name, planet, badge and say come from there.
  W.game = function (def) {
    const m = (window.MW_GAMES || []).filter(function (g) { return g.id === def.id; })[0];
    if (!m) throw new Error('MW.world.game: no games/' + def.id + '/game.json in this build');
    if (typeof def.build !== 'function' || typeof def.start !== 'function') throw new Error('MW.world.game: ' + def.id + ' needs build() and start()');
    const g = Object.assign({}, m, def);
    W.games.push(g);
    W.games.sort(function (a, b) { return a.planet - b.planet; });
    return g;
  };

  // A screen of the game's own: <section class="mw-screen">, after the others, under the grown-ups area.
  W.screen = function (id, label) {
    const stage = MW.$('stage');
    const s = MW.make('section', 'mw-screen', { id: id, 'aria-label': label });
    const screens = stage.querySelectorAll('.mw-screen');
    const last = screens[screens.length - 1];
    if (last && last.nextSibling) stage.insertBefore(s, last.nextSibling); else stage.appendChild(s);
    return s;
  };

  // ---------------------------------------------------------------- speaking and waiting
  // Wait while paused; false if the player has left (the token changed) meanwhile.
  W.ok = async function (token) {
    while (st.paused) await MW.wait(200);
    return token === st.token;
  };
  // Say lines, after any pause; nothing if the player left first. Resolves true if the lines played to the end.
  W.speak = async function (lines, opts) {
    const token = st.token;
    if (!(await W.ok(token))) return false;
    return MW.audio.say(lines, opts);
  };

  // ---------------------------------------------------------------- title banners (TitleBanner)
  // The set's or a game's name on a plaque, the only words the player sees apart from numerals and the letters being
  // practised, and always spoken with it (MEEMEE.md): so a banner shows only when its line is recorded (a line still
  // pending gives no banner, and the game starts straight away). It stays for its line and at least about 2 seconds, then goes by
  // itself; taps under it do nothing (the grown-ups lock still works). It fades and grows in over 260 ms and fades out
  // over 260 ms (a fade only, with reduce motion). Pausing or going Home takes it away at once.
  const BANNER = W.BANNER = { min: 2000, fade: 260, top: 292,
    sparks: [[300, -12, 1.4], [985, 168, 1.1], [1000, -22, 0.8]],     // x, y below the plaque's top, size (round 8 boards)
    art: { mimi: 104 }, gameArt: 112, worldArt: 96 };                // a kit drawing, a game's own badge, the MeeMee at each end
  let banner = null, bannerRun = null;
  function buildBanner(stageEl) {
    const el = MW.make('div', 'mw-banner', { id: 'banner' });
    const card = MW.make('div', 'mw-banner-card');
    const row = MW.make('div', 'mw-banner-row');
    const plaque = MW.make('div', 'mw-banner-plaque', { role: 'img' });
    row.appendChild(plaque);
    card.appendChild(row);
    BANNER.sparks.forEach(function (s) {
      const sp = MW.make('div', 'mw-banner-spark mw-abs');
      sp.style.left = (s[0] - 14 * s[2]) + 'px'; sp.style.top = (BANNER.top + s[1] - 14 * s[2]) + 'px';
      sp.style.transform = 'scale(' + s[2] + ')';
      const a = MW.art('spark'); a.setAttribute('width', 28); a.setAttribute('height', 28);
      sp.appendChild(a);
      card.appendChild(sp);
    });
    el.appendChild(card);
    // taps under it do nothing (it is above every screen, below the grown-ups lock)
    ['pointerdown', 'pointerup', 'click'].forEach(function (type) { el.addEventListener(type, function (e) { e.stopPropagation(); e.preventDefault(); }); });
    stageEl.appendChild(el);
    function art(name, size) {
      const a = MW.art(name); a.setAttribute('width', size); a.setAttribute('height', size);
      const box = MW.make('div', 'mw-banner-art', { 'data-art': name }); box.appendChild(a);
      return box;
    }
    let timer = 0;
    return {
      el: el,
      // info: { name, left: drawing, right: drawing or null, size: drawn size }
      show: function (info) {
        clearTimeout(timer);
        plaque.innerHTML = '';
        plaque.setAttribute('aria-label', info.name);
        plaque.appendChild(art(info.left, info.size));
        plaque.appendChild(MW.make('span', 'mw-banner-name banner', null, MW.esc(info.name)));
        if (info.right) plaque.appendChild(art(info.right, info.size));
        el.classList.remove('is-in', 'is-going');
        el.classList.add('is-up');
        void el.offsetWidth;                                  // start the fade from the beginning
        el.classList.add('is-in');
      },
      hide: function () {
        if (!el.classList.contains('is-up') || el.classList.contains('is-going')) return;
        el.classList.add('is-going');
        el.classList.remove('is-in');
        clearTimeout(timer);
        timer = setTimeout(function () { el.classList.remove('is-up', 'is-going'); }, BANNER.fade);
      },
      up: function () { return el.classList.contains('is-up'); }
    };
  }
  // Show a banner while its line is said. Resolves true once the banner has gone by itself, or false straight away if
  // a pause or Home took it away first.
  async function titleBanner(info, lines) {
    if (bannerRun) bannerRun.cancelled = true;
    const run = bannerRun = { cancelled: false };
    const shownAt = performance.now();
    banner.show(info);
    MW.log('banner', 'up ' + info.name);
    await MW.audio.say(lines);                                // a pause hushes it; a line not recorded yet says nothing
    while (!run.cancelled && performance.now() - shownAt < BANNER.min) await MW.wait(40);
    if (run.cancelled) return false;
    banner.hide();
    MW.log('banner', 'going ' + info.name);
    await MW.wait(BANNER.fade);
    if (run.cancelled) return false;
    bannerRun = null;
    MW.log('banner', 'gone ' + info.name);
    return true;
  }
  function cancelBanner() {
    if (bannerRun) { bannerRun.cancelled = true; bannerRun = null; MW.log('banner', 'cancelled'); }
    if (banner) banner.hide();
  }
  W.banner = { up: function () { return !!banner && banner.up(); }, cancel: cancelBanner };

  // ---------------------------------------------------------------- pausing
  // Reasons: the grown-ups area is open, the tablet is upright, or the page is hidden (screen off, another app).
  // The world carries on only when none is left; then each game picks up where it was (usually: ask again).
  W.pause = function (why) {
    st.pauses[why] = true;
    st.paused = true;
    cancelBanner();                                           // a banner goes; opening a planet stops on the map
    MW.audio.hush();
    if (W.crewScreen) W.crewScreen.dragger.cancel();        // a cat held when the screen goes off goes back to its place
    each(function (g) { if (g.onPause) g.onPause(why); });
    MW.log('pause', why);
  };
  W.resume = function (why) {
    if (!st.pauses[why]) return;
    delete st.pauses[why];
    if (Object.keys(st.pauses).length) return;
    st.paused = false;
    MW.log('resume', why);
    if (MW.shell.screen === 'screen-crew' && st.phase === 'crew') W.crewScreen.intro();
    else each(function (g) { if (g.onResume) g.onResume(); });
  };
  function openGrownups() { W.pause('grown-ups'); MW.grownups.openPanel(); }

  // ---------------------------------------------------------------- home: the map
  // The first time in a visit (after Play): MeeMee World's banner, with "Welcome to MeeMee World!". Every game is told
  // (onHome) so it can tidy up.
  W.home = function () {
    st.token++;
    cancelBanner();
    MW.audio.hush();                                          // nothing from the last screen carries on over the map
    if (W.crewScreen) W.crewScreen.dragger.cancel();
    each(function (g) { if (g.onHome) g.onHome(); });
    st.phase = 'map';                                         // after the games have tidied up, whatever they did
    W.map.setCrew(MW.crew.jobs());
    MW.shell.show('screen-map');
    if (!st.welcomed) { st.welcomed = true; welcome(); return; }
    if (!MW.crew.ready()) W.map.callCrew();                  // no jobs yet: the cats hop, to say "tap us"
  };
  // MeeMee World's banner: the planets and the crew wait until it has gone (or a pause took it away).
  async function welcome() {
    const token = st.token;
    if (!MW.audio.recorded('map-welcome')) { if (!MW.crew.ready()) W.map.callCrew(); return; }   // no line, no banner
    st.phase = 'welcome';
    await titleBanner({ name: 'MeeMee World', left: 'mimi', right: 'mimi', size: BANNER.worldArt }, [['map-welcome']]);
    if (token !== st.token || st.phase !== 'welcome') return;
    st.phase = 'map';
    if (!MW.crew.ready()) W.map.callCrew();
  }

  // A game's planet: its banner while its name is said ("MeeMee Rescue!"), then, once the banner has gone, the game.
  // The name and badge come from its game.json; a kit drawing as the badge (the MeeMee) is drawn at its design-system
  // size, a game's own badge (drawn in a 100 x 100 box) at 112.
  async function open(g) {
    if (st.phase !== 'map' || st.paused) return;
    st.phase = 'opening';
    const token = ++st.token;
    W.map.bounce(g.planet);
    MW.log('map', g.id);
    if (MW.audio.recorded(g.say)) {                          // a name not recorded yet: no banner, the game starts at once
      const gone = await titleBanner({ name: g.name, left: g.badge, size: BANNER.art[g.badge] || BANNER.gameArt }, [[g.say]]);
      if (token !== st.token) return;
      if (!gone || st.paused) { st.phase = 'map'; return; }   // a pause took the banner away: stay on the map
    } else MW.log('banner', 'none for ' + g.name + ' (' + g.say + ' not recorded yet)');
    try { g.start(); } catch (e) {
      MW.log('game-error', g.id + ': ' + e); console.error('MeeMee World: ' + g.id + ':', e);
      W.home();
    }
  }
  // A place with no game yet: "That place isn't ready yet." (0.8.0). While that line is still pending, the older
  // "That planet isn't ready yet." says it instead, so a tap is never silent (checked before the call: say() skips a
  // line that isn't recorded, and stops whatever was being said first).
  function notReady() {
    if (st.phase !== 'map' || st.paused) return;
    MW.log('map', 'locked');
    W.speak([[MW.audio.recorded('map-place-not-ready') ? 'map-place-not-ready' : 'map-not-ready']]);
  }
  // The crew screen: "Let's give the crew their jobs!" The player drags each cat onto a job.
  function openCrew() {
    if (st.phase !== 'map' || st.paused) return;
    st.token++;
    st.phase = 'crew';
    MW.log('map', 'crew');
    MW.shell.show('screen-crew');
    W.crewScreen.enter();
  }

  // ---------------------------------------------------------------- the start screen
  // Nothing to read: MeeMee World's name is shown (and said) by its banner after Play (decided 10 October 2026).
  function buildStart() {
    const s = MW.$('screen-start');
    const p = MW.pod(s, 240, 150, 420);
    p.el.disabled = true; p.el.tabIndex = -1;
    const play = MW.make('button', 'mw-btn mw-btn--play mw-abs mw-pulse', { type: 'button', 'aria-label': 'Play', id: 'play', style: 'left:820px;top:300px' });
    const icon = MW.art('icon-play'); icon.setAttribute('width', 84); icon.setAttribute('height', 84);
    play.appendChild(icon);
    MW.onTap(play, function () { MW.audio.unlock(); MW.shell.fullscreen(); W.home(); });
    // If a browser didn't count the finger lifting as a tap for full screen, the click that follows tries again.
    play.addEventListener('click', function () { MW.audio.unlock(); if (MW.device.fullOk === false) MW.shell.fullscreen(); });
    s.appendChild(play);
    const row = MW.make('div', 'mw-abs mw-start-mimi', { style: 'left:770px;top:520px' });
    for (let i = 0; i < 3; i++) row.appendChild(MW.art('mimi'));
    s.appendChild(row);
    MW.shell.buttons(s, ['music'], {});
  }

  // ---------------------------------------------------------------- set-up, once every game has joined
  function init() {
    const stageEl = MW.$('stage');
    MW.stage.init(stageEl);
    buildStart();
    const mapEl = MW.$('screen-map');
    W.map = MW.map(mapEl, {
      games: W.games.map(function (g) { return { planet: g.planet, badge: g.badge, name: g.name, onOpen: function () { open(g); } }; }),
      onLocked: notReady,
      onCrew: openCrew
    });
    MW.shell.buttons(mapEl, ['music'], {});
    W.crewScreen = MW.crew.screen(MW.$('screen-crew'), {
      speak: W.speak,
      onHome: W.home,
      enabled: function () { return !st.paused && MW.shell.screen === 'screen-crew'; }
    });
    each(function (g) { g.build(); });
    MW.shell.gate(stageEl, openGrownups);
    banner = buildBanner(stageEl);
    MW.grownups.init(stageEl, {
      title: 'Grown-ups',
      sections: [].concat.apply([], W.games.map(function (g) { return g.sections || []; })),
      onClose: function () { W.resume('grown-ups'); }
    });
    MW.shell.watchSideways(function () { W.pause('sideways'); }, function () { W.resume('sideways'); });
    // The screen going off, or switching to another app, pauses; it carries on when it comes back.
    document.addEventListener('visibilitychange', function () { if (document.hidden) W.pause('hidden'); else W.resume('hidden'); });
    each(function (g) { if (g.init) g.init(); });
    MW.shell.registerOffline();
    MW.audio.preloadAll();
    MW.shell.show('screen-start');
    window.addEventListener('load', function () {
      const nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      MW.device.loadMs = nav ? Math.round(nav.loadEventStart || performance.now()) : Math.round(performance.now());
    });
  }
  // The games' scripts come after this one in the page (each in its own <script>, so a mistake in one game's code
  // leaves the others working), so wait for the page to finish loading them.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else setTimeout(init, 0);
})();

</script>
<script>
/* ---- games/rescue ---- */
/* MeeMee Rescue: the number bonds, how secure each one is, and which go into a round (phase 4).

   A bond is a whole and its two parts in either order: 3 + 4 and 4 + 3 are the same bond, "7: 3 and 4".
   Secure, practising, not yet (decided 9 October):
     secure      right first time (no wrong check, no hint) on three different days;
     practising  answered, but not yet three days right first time; a wrong answer moves a secure bond back here
                 and its days start again;
     not yet     never asked.
   A round of five: 1 or 2 bonds he is secure on, the rest he is practising or hasn't met. If there aren't enough of
   one kind, the other fills in. At most two bonds come from one whole, and the same whole isn't asked twice in a row,
   while there are enough wholes in play. A whole's zero bond (5 and 0) joins once its other bonds are secure. With MeeMee
   to count it comes only when the answer is checked by tapping Scruffles (an empty circle is the answer to "how many
   more?"); in numbers mode it comes whichever check is set, because there is a 0 tile (decided 10 October 2026).
   Each way of answering keeps its own progress (decided 10 October 2026): every answer is saved with its mode
   ('counting' or 'numbers'); an answer saved before numbers mode has none and counts as counting. The game passes
   pickRound and statuses one mode's answers (ofMode).
   Pure functions of the saved answers, so they are easy to test. */
(function () {
  'use strict';
  const MW = window.MW;

  function day(t) {
    const d = new Date(t);
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();      // the tablet's own calendar day
  }
  function shuffle(list, rand) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  // the first n of a shuffled list, but at most two from one whole while there are others to take
  function take(list, n, already) {
    const count = {}, out = [], later = [];
    already.forEach(function (c) { count[c.whole] = (count[c.whole] || 0) + 1; });
    list.forEach(function (c) {
      if (out.length >= n) return;
      if ((count[c.whole] || 0) >= 2) { later.push(c); return; }
      out.push(c); count[c.whole] = (count[c.whole] || 0) + 1;
    });
    for (let i = 0; out.length < n && i < later.length; i++) out.push(later[i]);
    return out;
  }

  const B = MW.bonds = {};

  B.key = function (w, a, b) { return w + ':' + Math.min(a, b); };
  // Which way an answer was given: 'numbers', or 'counting' (also for answers saved before 0.6.0, which have no mode).
  B.modeOf = function (ans) { return ans && ans.mode === 'numbers' ? 'numbers' : 'counting'; };
  // One way's answers: each way has its own secure, practising and not yet.
  B.ofMode = function (answers, mode) { return (answers || []).filter(function (a) { return B.modeOf(a) === mode; }); };
  B.firstTime = function (ans) { return !ans.tries && !ans.hint; };

  // Every bond of a whole, smaller part first: 7 -> [0,7] [1,6] [2,5] [3,4]
  B.pairs = function (w) {
    const out = [];
    for (let a = 0; a <= Math.floor(w / 2); a++) out.push([a, w - a]);
    return out;
  };

  // { '7:3': { status: 'secure' | 'practising', days: [...], answers: n } } from the answers saved on this tablet
  B.statuses = function (answers) {
    const by = {};
    (answers || []).filter(function (a) {
      return a && typeof a.t === 'number' && a.whole >= 1 && a.left >= 0 && a.right >= 0 && a.left + a.right === a.whole;
    }).sort(function (x, y) { return x.t - y.t; }).forEach(function (a) {
      const k = B.key(a.whole, a.left, a.right);
      const s = by[k] || (by[k] = { status: 'practising', days: [], answers: 0 });
      s.answers++;
      if (B.firstTime(a)) { const d = day(a.t); if (s.days.indexOf(d) < 0) s.days.push(d); }
      else s.days = [];
      s.status = s.days.length >= 3 ? 'secure' : 'practising';
    });
    return by;
  };
  B.status = function (map, w, a) { const s = map[B.key(w, a, w - a)]; return s ? s.status : 'notyet'; };

  // A whole's zero bond is open once every other bond of that whole is secure.
  B.zeroOpen = function (map, w) {
    return B.pairs(w).every(function (p) { return p[0] === 0 || B.status(map, w, p[0]) === 'secure'; });
  };

  // The bonds a round can draw from: every bond of the wholes in play, zero bonds only when allowed and open.
  B.candidates = function (wholes, map, zero) {
    const out = [];
    wholes.forEach(function (w) {
      B.pairs(w).forEach(function (p) {
        if (p[0] === 0 && !(zero && B.zeroOpen(map, w))) return;
        out.push({ whole: w, a: p[0], b: p[1], status: B.status(map, w, p[0]) });
      });
    });
    return out;
  };

  // opts: { wholes: [2..10], answers: one mode's [...], size: 5, zero: true in numbers mode or with tap Scruffles, rand: Math.random }
  // -> [{ whole, left, right, missing: 'whole' | 'left' | 'right', status }]
  B.pickRound = function (opts) {
    const rand = opts.rand || Math.random;
    const size = opts.size || 5;
    const map = B.statuses(opts.answers);
    const cands = B.candidates(opts.wholes, map, !!opts.zero);
    const secure = shuffle(cands.filter(function (c) { return c.status === 'secure'; }), rand);
    const work = shuffle(cands.filter(function (c) { return c.status !== 'secure'; }), rand);
    let nSecure = Math.min(rand() < 0.5 ? 1 : 2, secure.length);
    const nWork = Math.min(size - nSecure, work.length);
    nSecure = Math.min(size - nWork, secure.length);                   // too few to practise: more secure ones
    const chosen = take(secure, nSecure, []);
    Array.prototype.push.apply(chosen, take(work, nWork, chosen));
    // very few wholes in play: every bond is already in, so go round them again in turn
    const again = shuffle(cands, rand);
    for (let i = 0; chosen.length < size; i++) chosen.push(again[i % again.length]);
    // the same whole twice in a row only when it can't be helped: a search over a shuffled order finds an order
    // with no repeats whenever there is one (a round is only five long)
    const pool = shuffle(chosen, rand);
    let best = null, bestRuns = Infinity;
    (function place(order, left, runs) {
      if (runs >= bestRuns) return;
      if (!left.length) { best = order; bestRuns = runs; return; }
      for (let i = 0; i < left.length && bestRuns > 0; i++) {
        const same = order.length && order[order.length - 1].whole === left[i].whole ? 1 : 0;
        place(order.concat([left[i]]), left.slice(0, i).concat(left.slice(i + 1)), runs + same);
      }
    })([], pool, 0);
    return best.map(function (c) {
      const swap = rand() < 0.5;
      const r = rand();
      return { whole: c.whole, left: swap ? c.b : c.a, right: swap ? c.a : c.b,
        missing: r < 0.25 ? 'whole' : (r < 0.625 ? 'left' : 'right'), status: c.status };
    });
  };

  // Every question the game can ask for these wholes (tests and the grown-ups' list).
  B.allQuestions = function (wholes, zero) {
    const out = [];
    wholes.forEach(function (w) {
      for (let left = zero ? 0 : 1; left <= (zero ? w : w - 1); left++) {
        ['whole', 'left', 'right'].forEach(function (m) { out.push({ whole: w, left: left, right: w - left, missing: m }); });
      }
    });
    return out;
  };
})();

/* MeeMee Rescue: the crew's job moments (phase 4, 0.4.1; the design canvas's round 4, Moments4).
   A cat with a job appears briefly at its own moment, with no words, never over the diagram or the tray:
     lookout    as a round starts, peeks over the asteroid with the telescope and spots the MeeMee (in numbers mode,
                where there is no asteroid, it peeks up from behind the right-hand end of the number track, below the
                ship, answer 24 of the 0.6.0 PRD, mirrored so it looks towards the diagram);
     engineer   on a right answer, gives the ship a tap with the spanner while the lights flash;
     navigator  as a star turns peach, holds up the star map and points to the next one;
     commander  on the end screen, the radio grows in and calls (three arcs from its aerial) beside the rescued
                MeeMee (0.9.0, in the cook's place: the cook brought fish).
   A job no cat has has no moment. With reduce motion the cats fade in and out instead of moving. */
(function () {
  'use strict';
  const MW = window.MW;

  const L = MW.LAYOUT.moments = {
    lookout: { x: 690, y: 390, w: 220, show: 175, box: 250, scope: { x: 89, y: 2, size: 150 } },   // behind the asteroid
    // numbers mode: behind the number track's right-hand end (its rail runs to x 1166, its top at 674), below the ship,
    // mirrored (flip) so it looks left, towards the diagram, as it does from the asteroid (game.css: rescue-peek-flip)
    lookoutTrack: { x: 906, y: 519, w: 220, show: 175, box: 250, scope: { x: 89, y: 2, size: 150 }, flip: true },
    engineer: { x: 700, y: 318, w: 140, spanner: { x: 100, y: 84, size: 88 } },                     // by the ship's left fin
    navigator: { x: 686, y: 124, w: 120, map: { x: 64, y: 50, size: 80 } },                         // under the stars
    // end screen: the radio's box (where the cook's pan was), its call rising above it; never flipped (boards Moment14)
    commander: { size: 104, moggles: { x: 254, y: 494 }, snuffles: { x: 770, y: 494 } }
  };
  function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; return el; }
  function size(svg, s) { svg.setAttribute('width', s); svg.setAttribute('height', s); return svg; }
  function drop(el, ms) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, ms); }

  // opts: { game: the game screen, tray: the asteroid's element, over: the layer the moments go under (the number track
  //         comes after it, so the lookout is behind the track as well as the asteroid),
  //         stars: MW.stars on the game screen, end: the end screen, endCats: { moggles: box, snuffles: box } }
  MW.moments = function (opts) {
    const m = {};
    let timers = [];
    const low = MW.make('div', 'mw-layer mw-fill mw-moments');       // behind the asteroid: the lookout
    opts.game.insertBefore(low, opts.tray);
    const high = MW.make('div', 'mw-layer mw-fill mw-moments');      // over the ship: the engineer and the navigator
    opts.game.insertBefore(high, opts.over);
    const endLayer = MW.make('div', 'mw-layer mw-fill mw-moments');
    opts.end.appendChild(endLayer);
    let peek = null;

    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function catFor(job, w) {
      const who = MW.crew.who(job);
      if (!who) return null;
      const c = MW.crew.cat(who, w);
      c.setJob(job);
      return c;
    }
    function show(el) { void el.getBoundingClientRect(); el.classList.add('is-shown'); }
    function hide(el, after) { later(function () { el.classList.remove('is-shown'); drop(el, 400); }, after); }

    // ---------------------------------------------------------------- lookout
    // at: 'track' in numbers mode (behind the number track), otherwise behind the asteroid
    m.lookoutUp = function (at) {
      m.lookoutDown(true);
      const k = at === 'track' ? L.lookoutTrack : L.lookout, cat = catFor('lookout', k.w);
      if (!cat) return false;
      const box = place(MW.make('div', 'mw-moment mw-peek', { 'data-moment': 'lookout' }), k.x, k.y);
      box.style.width = k.box + 'px'; box.style.height = k.show + 'px';
      if (k.flip) box.classList.add('rescue-peek-flip');
      const inner = MW.make('div', 'mw-peek-inner');
      inner.appendChild(cat);
      const scope = place(size(MW.art('held-telescope'), k.scope.size), k.scope.x, k.scope.y);
      scope.setAttribute('class', 'mw-held-scope');
      inner.appendChild(scope);
      box.appendChild(inner);
      low.appendChild(box);
      peek = box;
      show(box);
      MW.log('moment', at === 'track' ? 'lookout track' : 'lookout');
      return true;
    };
    m.lookoutDown = function (now) {
      if (!peek) return;
      const b = peek; peek = null;
      if (now) { drop(b, 0); return; }
      b.classList.remove('is-shown');
      drop(b, 600);
    };

    // ---------------------------------------------------------------- engineer
    m.engineer = function () {
      const k = L.engineer, cat = catFor('engineer', k.w);
      if (!cat) return false;
      const box = place(MW.make('div', 'mw-moment mw-moment-pop', { 'data-moment': 'engineer' }), k.x, k.y);
      box.appendChild(cat);
      const sp = MW.make('div', 'mw-spanner');
      place(sp, k.spanner.x, k.spanner.y);
      sp.appendChild(size(MW.art('job-engineer'), k.spanner.size));
      box.appendChild(sp);
      high.appendChild(box);
      show(box);
      later(function () { sp.classList.add('is-tapping'); }, 250);           // two taps on the hull
      hide(box, 3700);                                                       // gone as the lights stop (about 4 s)
      MW.log('moment', 'engineer');
      return true;
    };

    // ---------------------------------------------------------------- navigator
    // next: the star to point at (0 to 4), or null after the last question
    m.navigator = function (next) {
      const k = L.navigator, cat = catFor('navigator', k.w);
      if (!cat) return false;
      const box = place(MW.make('div', 'mw-moment mw-moment-pop', { 'data-moment': 'navigator' }), k.x, k.y);
      box.appendChild(cat);
      const mp = place(MW.make('div', 'mw-star-map'), k.map.x, k.map.y);
      mp.appendChild(size(MW.art('job-navigator'), k.map.size));
      box.appendChild(mp);
      const star = next !== null && next !== undefined ? opts.stars.el.children[next] : null;
      if (star) {
        // a dotted route from the top of the map to the star (positions on the 1280 x 800 stage)
        const k2 = MW.stage.scale || 1, box0 = opts.stars.el.getBoundingClientRect(), r = star.getBoundingClientRect();
        const sx = opts.stars.el.offsetLeft + (r.left - box0.left + r.width / 2) / k2;
        const sy = opts.stars.el.offsetTop + (r.bottom - box0.top) / k2 + 4;
        const fx = k.x + k.map.x + k.map.size * 0.62, fy = k.y + k.map.y + 6;
        const route = MW.make('div', 'mw-layer mw-fill mw-route');
        route.innerHTML = '<svg width="1280" height="800" viewBox="0 0 1280 800" aria-hidden="true"><path class="s-mint" fill="none" stroke-width="5" '
          + 'stroke-dasharray="2 14" stroke-linecap="round" d="M' + fx + ' ' + fy + ' Q ' + ((fx + sx) / 2 + 30) + ' ' + Math.min(fy, sy) + ' ' + sx + ' ' + sy + '"/></svg>';
        route.classList.add('mw-moment-pop');
        high.appendChild(route);
        later(function () { show(route); }, 250);
        hide(route, 1900);
      }
      high.appendChild(box);
      show(box);
      hide(box, 2100);
      MW.log('moment', 'navigator ' + (star ? next : 'end'));
      return true;
    };

    // ---------------------------------------------------------------- commander (end screen)
    // 0.9.0, in the cook's place: the radio grows in where the pan did (its 104 box at the commander's place), with its
    // call, three arcs from the aerial, rising above it: the drawing is 104 wide and 1.42 times as tall
    m.commander = function () {
      const who = MW.crew.who('commander');
      if (!who) return false;
      const k = L.commander, at = k[who], h = Math.round(k.size * 1.42);
      const call = place(MW.make('div', 'mw-moment mw-commander-call', { 'data-moment': 'commander' }), at.x, at.y - (h - k.size));
      call.style.width = k.size + 'px'; call.style.height = h + 'px';
      const art = MW.art('commander-call'); art.setAttribute('width', k.size); art.setAttribute('height', h);
      call.appendChild(art);
      endLayer.appendChild(call);
      show(call);
      if (opts.endCats && opts.endCats[who]) opts.endCats[who].hop(0);
      MW.sparkles(endLayer, at.x + k.size / 2, at.y + k.size / 2, 70);
      MW.log('moment', 'commander');
      return true;
    };

    // the in-round cats leave when the next question starts
    m.settle = function () {
      Array.prototype.forEach.call(high.querySelectorAll('.is-shown'), function (el) { el.classList.remove('is-shown'); drop(el, 400); });
    };
    // leaving: everything goes at once
    m.clear = function () {
      timers.forEach(clearTimeout); timers = [];
      peek = null;
      [low, high, endLayer].forEach(function (l) { l.innerHTML = ''; });
    };
    return m;
  };
})();

/* MeeMee Rescue: number bonds to 10 on the part–whole diagram (phases 3 to 5).
   The first MeeMee World game, and the worked example for new ones. It joins the world (kit/world.js) with
   MW.world.game below; the world gives it the start screen, the map, the crew screen, pausing and the grown-ups area.
   Its planet starts a round of five part–whole questions in Barney's voice, chosen from the bonds that need work
   (bonds.js). The player drags MeeMee from the asteroid into the waiting circle. Each crew job has its moment in a
   round (moments.js). Grown-ups see the progress grid.
   Numbers mode (0.6.0; NumbersMode card, round 8's Numbers8 boards), which a grown-up turns on in Settings ("How your
   child answers"): each given circle holds a MeeMee carrying its number, and the player drags a number tile (0 to 10)
   from the number track along the bottom into the waiting circle. Two wrong tries bring the MeeMee back to count on (never for a zero answer).
   Each way keeps its own progress: every answer is saved with its mode.
   Older than the rules for new games, so some names don't have the game's prefix: its screens are screen-game and
   screen-end, its voice lines have no "rescue-" in front, and its saved answers and settings sit at the top level. */
(function () {
  'use strict';
  const MW = window.MW;
  const ROUND = 5;
  const PRAISE = ['praise-found-it', 'praise-thats-right', 'praise-super-counting', 'praise-brilliant-rescuing', 'praise-well-done'];
  const N = function (n) { return 'num-mid-' + n; };
  const E = function (n) { return 'num-end-' + n; };
  const OTHER = { left: 'right', right: 'left' };
  const FIND = 'rescue-find-number';                         // "Find the number." (numbers mode)
  // the two ways of answering, as the grown-ups area names them (Settings and the Progress tab's switch)
  const WAYS = [['counting', 'MeeMee to count'], ['numbers', 'Numbers']];

  const W = MW.world;
  const st = { hintTimers: [], round: null, qi: 0, q: null, target: null, answer: 0,
    counters: [], fixed: [], tries: 0, misses: 0, hinted: false, ghosts: null, prompt: null, praise: [], check: null,
    mode: null, placed: null,                                // numbers mode: the way of answering, and the tile in the circle
    talking: false };                                        // Scruffles is saying something after a check (afterCheck)
  // the token, the phase and pausing belong to the world (one of each for the page); st reads and writes them there
  ['token', 'phase', 'paused'].forEach(function (k) {
    Object.defineProperty(st, k, { enumerable: true, get: function () { return W.st[k]; }, set: function (v) { W.st[k] = v; } });
  });
  const R = MW.rescue = { st: st, nextRound: null };
  let diagram, stars, equation, pod, endPod, layer, ghostLayer, fxLayer, endStars, endMimi, dragger, tray, track, moments;
  let view = null;                                           // the Progress tab's switch: which way's progress it shows
  let talk = 0;                                              // counts what's said after a check (afterCheck)
  const endCats = {};
  const speak = W.speak, ok = W.ok;

  // ---------------------------------------------------------------- joining the world
  W.game({
    id: 'rescue',
    build: function () {
      buildGame();
      buildEnd();
      moments = MW.moments({ game: MW.$('screen-game'), tray: tray.el, over: ghostLayer, stars: stars, end: MW.$('screen-end'), endCats: endCats });
      // 9 October: "tap Scruffles to check" became the default. A tablet still on the old default moves to it once;
      // a mode a grown-up picks in Settings from now on is kept.
      if (!MW.store.setting('checkPicked') && MW.store.setting('check') !== 'tap') MW.store.setting('check', 'tap');
    },
    start: function () { startRound(); },
    sections: [progressSection(), settingsSection()],
    onPause: function () { clearHint(); if (dragger) dragger.cancel(); },
    onResume: function () { if (MW.shell.screen === 'screen-game' && (st.phase === 'open' || st.phase === 'asking')) speak(st.prompt); },
    onHome: leave
  });

  function buildGame() {
    const s = W.screen('screen-game', 'MeeMee Rescue');
    diagram = MW.diagram(s);
    // the ship goes in before the asteroid (they don't overlap), so the lookout can peek out between them
    pod = MW.pod(s, MW.LAYOUT.pod.x, MW.LAYOUT.pod.y, MW.LAYOUT.pod.w);
    tray = MW.tray(s);
    MW.onTap(pod.el, onPodTap);
    equation = MW.equation(s);
    stars = MW.stars(s, MW.LAYOUT.stars.x, MW.LAYOUT.stars.y);
    ghostLayer = MW.make('div', 'mw-layer mw-fill'); s.appendChild(ghostLayer);
    layer = MW.make('div', 'mw-layer mw-fill mw-counters'); s.appendChild(layer);
    // numbers mode's number track (the kit's): above the counters, so a tile dropped in a circle shows over it and over
    // the hint's MeeMee, and in front of the lookout. Hidden in counting mode, as the asteroid is in numbers mode.
    track = MW.numberTrack(s);
    track.el.classList.add('mw-off');
    fxLayer = MW.make('div', 'mw-layer mw-fill mw-fx'); s.appendChild(fxLayer);
    MW.shell.buttons(s, ['home', 'music', 'hear'], { home: W.home, hear: hearAgain });
    dragger = MW.dragger(s, {
      counters: function () { return numbers() ? track.tiles : st.counters; },
      enabled: function () { return !st.paused && (st.phase === 'asking' || st.phase === 'open'); },
      onPick: function (c) { MW.log('pick', c.where || 'tile ' + c.n); },
      onDrop: drop
    });
  }

  function buildEnd() {
    const s = W.screen('screen-end', 'All the MeeMee rescued');
    endStars = MW.stars(s, 450, 40, 60);
    const mog = MW.make('div', 'mw-abs mw-crew', { style: 'left:70px;top:330px' }); mog.appendChild(endCats.moggles = MW.crew.cat('moggles', 240)); s.appendChild(mog);
    const p = endPod = MW.pod(s, 380, 130, 400); p.face('got-it'); p.el.disabled = true; p.el.tabIndex = -1;
    const snu = MW.make('div', 'mw-abs mw-crew', { style: 'left:790px;top:330px' }); snu.appendChild(endCats.snuffles = MW.crew.cat('snuffles', 240)); s.appendChild(snu);
    endMimi = MW.make('div', 'mw-abs mw-start-mimi', { style: 'left:352px;top:600px' });
    for (let i = 0; i < 5; i++) endMimi.appendChild(MW.art('mimi'));
    s.appendChild(endMimi);
    const play = MW.make('button', 'mw-btn mw-btn--play mw-abs', { type: 'button', 'aria-label': 'Another rescue', id: 'again', style: 'left:1080px;top:420px' });
    const icon = MW.art('icon-play'); icon.setAttribute('width', 84); icon.setAttribute('height', 84);
    play.appendChild(icon);
    MW.onTap(play, function () { MW.audio.unlock(); MW.shell.fullscreen(); startRound(); });
    s.appendChild(play);
    MW.shell.buttons(s, ['home', 'music'], { home: W.home });
  }

  // ---------------------------------------------------------------- a round
  function makeRound() {
    if (R.nextRound) { const r = R.nextRound; R.nextRound = null; return r.map(function (q) { return Object.assign({}, q); }); }
    let wholes = (MW.store.setting('wholes') || []).filter(function (w) { return w >= 2 && w <= 10; });
    if (!wholes.length) wholes = [2, 3, 4, 5, 6, 7, 8, 9, 10];
    // With MeeMee to count, zero bonds are answered with an empty circle, so they come up only when the answer is checked
    // by tapping Scruffles; in numbers mode there is a 0 tile, so they come up whichever check is set. Each way of
    // answering has its own progress, so a round picks from its own way's answers.
    const m = mode();
    return MW.bonds.pickRound({ wholes: wholes, answers: MW.bonds.ofMode(MW.store.get('answers') || [], m), size: ROUND,
      zero: m === 'numbers' || check() === 'tap' });
  }

  async function startRound() {
    const token = ++st.token;
    st.check = savedCheck();
    st.mode = savedMode();
    st.round = makeRound();
    st.qi = 0;
    clearBoard(true);
    showMode();
    moments.clear();
    MW.shell.show('screen-game');
    stars.set(0);
    st.phase = 'starting';
    moments.lookoutUp(numbers() ? 'track' : null);           // the lookout peeks over the asteroid (or the number track)
    MW.log('round', JSON.stringify(st.round));
    await speak([['round-ready']]);
    if (!(await ok(token))) return;
    nextQuestion(token);
  }

  function clearBoard(all) {
    if (st.ghosts) { st.ghosts.clear(); st.ghosts = null; }
    st.counters.concat(st.fixed).forEach(function (c) { c.remove(); });
    st.counters = []; st.fixed = [];
    st.placed = null;
    talk++; st.talking = false;                              // a new question (or leaving): nothing said after a check is going on
    track.reset();                                           // every number tile back in its place
    if (all) { equation.hide(); }
  }
  // The round's way of answering on the screen: the diagram's look, and the asteroid or the number track.
  function showMode() {
    const n = numbers();
    diagram.look(n ? 'numbers' : 'counting');
    tray.el.classList.toggle('mw-off', n);
    track.el.classList.toggle('mw-off', !n);
    if (n && track.away()) track.show();
  }

  async function nextQuestion(token) {
    const q = st.q = st.round[st.qi];
    st.target = q.missing;
    st.answer = q.missing === 'whole' ? q.whole : q[q.missing];
    st.tries = 0; st.misses = 0; st.hinted = false;
    clearBoard(true);
    diagram.set(q);
    pod.face('thinking');
    pod.lightsOff();                                         // never still flashing into the next question
    if (st.qi === 0) setTimeout(function () { if (token === st.token) moments.lookoutDown(); }, 1800);   // spotted them
    else moments.settle();
    stars.set(st.qi);
    if (numbers()) {
      // numbers mode: the given circles hold numbered MeeMee (diagram.set did that), and the track is back for this question
      if (track.away()) track.show();
    } else {
      // the MeeMee already rescued: the given part(s), in their counting pattern
      ['left', 'right'].forEach(function (k) {
        if (k === q.missing) return;
        diagram.slots(k, q[k]).forEach(function (p) {
          st.fixed.push(MW.counter(layer, { fixed: true, x: p.x, y: p.y, size: p.size }));
        });
      });
      // ten MeeMee waiting on the asteroid: more than any answer needs
      MW.LAYOUT.traySlots.forEach(function (p, i) {
        const c = MW.counter(layer, { x: p.x, y: p.y });
        c.home = p; c.where = 'tray'; c.slot = i;
        c.el.classList.add('is-arriving');
        c.el.addEventListener('animationend', function () { c.el.classList.remove('is-arriving'); }, { once: true });
        st.counters.push(c);
      });
    }
    st.prompt = promptFor(q);
    // numbers mode: the first two questions of a round say "Find the number." after the question. Left out until it is
    // recorded, so a missing recording never silences the question.
    if (numbers() && st.qi < 2 && MW.audio.recorded(FIND)) st.prompt = st.prompt.concat([[FIND]]);
    // tap mode: the first two questions of a round end with "Tap Scruffles when you're ready.", and so does any question
    // whose answer is zero (with MeeMee to count the answer is an empty circle and a tap on Scruffles; in numbers mode
    // the check works the same way, as Settings says)
    if (check() === 'tap' && (st.qi < 2 || st.answer === 0)) st.prompt = st.prompt.concat([['tap-scruffles']]);
    st.phase = 'asking';
    MW.log('question', JSON.stringify(q));
    await speak(st.prompt);
    if (token !== st.token) return;
    if (st.phase === 'asking') st.phase = 'open';
  }

  function promptFor(q) {
    if (q.missing === 'whole') return [['q-weve-got', N(q.left), 'and', E(q.right)], ['q-how-many-altogether']];
    const given = q[OTHER[q.missing]];
    return [['q-lets-make', E(q.whole)], ['q-weve-got', E(given)], ['q-how-many-more']];
  }

  // ---------------------------------------------------------------- dragging and dropping
  function inTarget() { return st.counters.filter(function (c) { return c.where === st.target; }); }
  function tidy(animate) {
    const placed = inTarget();
    const n = placed.length;
    const slots = diagram.slots(st.target, st.hinted && n <= st.answer ? st.answer : n);
    placed.forEach(function (c, i) { c.moveTo(slots[i].x, slots[i].y, slots[i].size, animate); });
    diagram.count(st.target, n);
    pod.ready(check() === 'tap' && n > 0 && st.phase !== 'celebrate');
  }
  // How answers are checked. A round keeps the mode it started with (its zero bonds need tap mode);
  // a change in Settings starts with the next round.
  function savedCheck() { return MW.store.setting('check') === 'tap' ? 'tap' : 'auto'; }
  function check() { return st.check || savedCheck(); }
  // How the player answers: 'counting' (MeeMee to count, the usual way) or 'numbers' (a number tile). Like the check, a
  // round keeps the way it started with; a change in Settings starts with the next round.
  function savedMode() { return MW.store.setting('answerMode') === 'numbers' ? 'numbers' : 'counting'; }
  function mode() { return st.mode || savedMode(); }
  function numbers() { return mode() === 'numbers'; }

  // A drop from the dragger: a number tile (numbers mode) or a MeeMee.
  function drop(c, x, y, cancelled) {
    if (track.tiles.indexOf(c) >= 0) onTileDrop(c, x, y, cancelled); else onDrop(c, x, y, cancelled);
  }

  function onDrop(c, x, y, cancelled) {
    if (st.counters.indexOf(c) < 0) return;                 // left over from a question that has ended
    const was = c.where;
    // Not answering now (paused, celebrating, or a touch taken away by the tablet): just put it back.
    if (cancelled || st.paused || !(st.phase === 'open' || st.phase === 'asking')) {
      if (was === st.target) tidy(true);                    // it was already in the circle: back to its place there
      else floatHome(c);
      return;
    }
    const hit = diagram.hit(x, y);
    if (hit === st.target) {
      if (was === st.target) { tidy(true); return; }
      if (check() === 'auto' && inTarget().length >= st.answer) { floatHome(c); return; }
      c.where = st.target;
      MW.audio.sfx('pop');
      tidy(true);
      pod.face('thinking');
      MW.log('drop', 'in ' + inTarget().length);
      if (check() === 'auto' && inTarget().length === st.answer) success();
      return;
    }
    // anywhere else: the MeeMee floats back to its own spot on the asteroid
    const far = Math.hypot(x - c.home.x, y - c.home.y) > 70;
    floatHome(c);
    if (was === st.target) { tidy(true); MW.audio.sfx('whoosh'); MW.log('drop', 'out ' + inTarget().length); return; }
    if (!far) return;                       // a nudge on the asteroid isn't a try
    MW.audio.sfx('whoosh');
    MW.log('drop', 'miss');
    if (check() === 'auto') wrongTry('miss');
  }
  function floatHome(c) {
    c.where = 'tray';
    c.moveTo(c.home.x, c.home.y, 80, true);
  }

  // Numbers mode: a number tile dropped. Anywhere inside the waiting circle's rim puts it there (one tile at a time: a
  // second one sends the first back); anywhere else, it floats back to its place on the track.
  function onTileDrop(t, x, y, cancelled) {
    const was = t === st.placed;
    // Not answering now (paused, celebrating, or a touch taken away by the tablet): just put it back.
    if (cancelled || st.paused || !numbers() || !(st.phase === 'open' || st.phase === 'asking')) {
      if (was) placeTile(t); else t.goHome(true);
      return;
    }
    if (diagram.hit(x, y) === st.target) {
      if (was) { placeTile(t); return; }                     // moved about inside the circle: back to its middle
      if (st.placed) st.placed.goHome(true);                 // the circle holds one tile: the first goes back
      st.placed = t;
      placeTile(t);
      MW.audio.sfx('pop');
      pod.face('thinking');
      MW.log('drop', 'tile ' + t.n);
      pod.ready(check() === 'tap');                          // tap mode: the lights glow while there's a tile to check
      if (check() === 'auto') checkTile();
      return;
    }
    t.goHome(true);
    if (was) { st.placed = null; pod.ready(false); MW.audio.sfx('whoosh'); MW.log('drop', 'out'); return; }   // taken back out
    if (Math.hypot(x - t.home.x, y - t.home.y) <= 70) return;  // a nudge on the track isn't a try
    MW.audio.sfx('whoosh');
    MW.log('drop', 'miss');
    if (check() === 'auto') wrongTry('miss');               // as a far-off MeeMee: a try only when checked as it lands
  }
  function placeTile(t) { const c = MW.LAYOUT[st.target]; t.moveTo(c.x, c.y, 0, true); }
  // Numbers mode: the tile in the circle is checked (as it lands, or when Scruffles is tapped).
  function checkTile() {
    const t = st.placed;
    MW.log('check', 'tile ' + t.n + ' for ' + st.answer);
    if (t.n === st.answer) { success(); return; }
    st.placed = null;                                        // a wrong number floats back to the track
    t.goHome(true);
    pod.ready(false);
    MW.audio.sfx('whoosh');
    wrongTry('number');
  }

  // Tapping Scruffles: checks the answer in "tap" mode; otherwise asks the question again.
  function onPodTap() {
    if (st.paused || !(st.phase === 'open' || st.phase === 'asking')) return;
    if (dragger && dragger.dragging()) return;              // one hand holding a MeeMee, the other tapping
    if (check() !== 'tap') { hearAgain(); return; }
    // While Scruffles is still answering a check (a try-again line, too many, the hint), a tap does nothing, so a double
    // tap is one try, not two (decided by Barney, 16 October 2026, 0.8.1; Take MeeMee Home does the same)
    if (st.talking) { MW.log('check', 'still answering'); return; }
    if (numbers()) {
      if (!st.placed) {
        // nothing to check: the question again, not a try, but only once Scruffles is quiet. While he's saying "Let's try
        // again." or giving the hint (or asking), a tap (a double tap's second, an impatient one) does nothing.
        if (st.talking || MW.audio.speaking()) { MW.log('check', 'no tile, waiting'); return; }
        MW.log('check', 'no tile');
        hearAgain();
        return;
      }
      checkTile();
      return;
    }
    const n = inTarget().length;
    MW.log('check', n + ' of ' + st.answer);
    if (n === st.answer) { success(); return; }
    wrongTry(n > st.answer ? 'too-many' : 'too-few');
  }

  // A wrong try: a wrong check (tap mode), a wrong number (numbers mode) or a MeeMee or tile dropped away from the waiting
  // circle (a miss, when the answer is checked as it lands).
  // No red, no buzzer: Scruffles's try-again face, a calm line, and the hint after the second one (not for a zero answer
  // in numbers mode).
  // What Scruffles says after a check (the try-again line, the hint): st.talking is true from the moment it's asked for
  // until it ends or is cut short, so a tap on him meanwhile can wait for it (numbers mode, no tile in the circle).
  function afterCheck(saying) {
    const n = ++talk;
    st.talking = true;
    saying.then(function () { if (n === talk) st.talking = false; });
    return saying;
  }
  function wrongTry(kind) {
    if (kind === 'miss') st.misses++; else st.tries++;
    const count = kind === 'miss' ? st.misses : st.tries;
    pod.face('try-again');
    const token = st.token, qi = st.qi;
    setTimeout(function () { if (token === st.token && qi === st.qi && st.phase !== 'celebrate') pod.face('thinking'); }, 1600);
    if (kind === 'too-many') { afterCheck(speak([['too-many']])); return; }
    // Numbers mode, an answer of zero (5 + ? = 5): never the hint, however many tries; each gets "Let's try again." (decided
    // by Barney, 11 October 2026: counting on by nothing shows nothing). Counting mode is as before.
    const hints = !(numbers() && st.answer === 0);
    if (hints && count >= 2 && !st.hinted) { hint(); return; }
    if (hints && count >= 2) return;
    afterCheck(speak([[kind === 'miss' || kind === 'number' ? 'again-try-again' : 'again-look-again']]));
  }

  // ---------------------------------------------------------------- the hint: count on together
  // Numbers mode (Numbers8Hint): the given part (both parts, for a missing whole) comes back as MeeMee in its counting
  // pattern and the whole keeps its numbered MeeMee; the waiting circle counts on with ghosts, with the same lines. The
  // player still drags the number. The MeeMee and ghosts stay until the question is answered.
  async function hint() {
    const q = st.q, token = st.token, qi = st.qi, nums = numbers();
    st.hinted = true;
    MW.log('hint', q.missing);
    diagram.hinting(st.target, true);
    if (nums) bringBack(q); else tidy(true);
    const placed = nums ? 0 : inTarget().length;
    const slots = diagram.slots(st.target, Math.max(st.answer, placed));
    if (st.ghosts) st.ghosts.clear();
    st.ghosts = MW.ghosts(ghostLayer, slots.slice(placed, st.answer));
    let lines, actions;
    if (q.missing === 'whole') {
      // "Count them with me. One, two, three…": each MeeMee in the parts hops as its number is said
      const order = st.fixed.slice();
      lines = [['again-count-with-me']];
      actions = [null];
      for (let i = 1; i <= q.whole; i++) {
        lines.push([i === q.whole ? E(i) : N(i)]);
        actions.push((function (c, j) { return function () { hop(c); if (st.ghosts) st.ghosts.light(j - placed); }; })(order[i - 1], i - 1));
      }
    } else {
      // "Let's count on from three. Four, five, six, seven."
      const given = q[OTHER[q.missing]];
      lines = [['q-count-on-from', E(given)]];
      actions = [null];
      for (let i = 1; i <= st.answer; i++) {
        lines.push([given + i === q.whole ? E(given + i) : N(given + i)]);
        actions.push((function (j) {
          return function () {
            const inside = nums ? [] : inTarget();
            if (j < inside.length) hop(inside[j]); else if (st.ghosts) st.ghosts.light(j - placed);
          };
        })(i - 1));
      }
    }
    const heard = await afterCheck(speak(lines, {
      onStart: function (timeline) {
        // one entry per clip; the first line may have two clips
        let k = 0;
        lines.forEach(function (sent, si) {
          const at = timeline[k].at;
          k += sent.length;
          if (actions[si]) st.hintTimers.push(setTimeout(function () { if (token === st.token && qi === st.qi) actions[si](); }, at * 1000));
        });
      }
    }));
    // Cut short (Hear-again, a pause): take the hint away so the next wrong try gives it again in full.
    if (!heard && token === st.token && qi === st.qi && st.phase !== 'celebrate') {
      clearHint();
      st.hinted = false;
      if (st.ghosts) { st.ghosts.clear(); st.ghosts = null; }
      diagram.hinting(st.target, false);
      if (nums) takeBack(q); else tidy(true);
    }
  }
  // Numbers mode's hint: the given part(s) as MeeMee in their counting pattern, in place of their numbered MeeMee ...
  function bringBack(q) {
    ['left', 'right'].forEach(function (k) {
      if (k === q.missing) return;
      diagram.carry(k, null);
      diagram.slots(k, q[k]).forEach(function (p) {
        const c = MW.counter(layer, { fixed: true, x: p.x, y: p.y, size: p.size });
        c.el.classList.add('is-arriving');                   // they fade in (the arrival holds them visible: let it go)
        c.el.addEventListener('animationend', function () { c.el.classList.remove('is-arriving'); }, { once: true });
        st.fixed.push(c);
      });
    });
  }
  // ... and back to their numbered MeeMee (a hint cut short, so the next wrong try gives it again in full).
  function takeBack(q) {
    st.fixed.forEach(function (c) { c.remove(); });
    st.fixed = [];
    ['left', 'right'].forEach(function (k) { if (k !== q.missing) diagram.carry(k, q[k]); });
  }
  function clearHint() {
    st.hintTimers.forEach(clearTimeout);
    st.hintTimers = [];
  }
  function hop(c) {
    if (!c) return;
    c.el.classList.remove('is-hop'); void c.el.offsetWidth; c.el.classList.add('is-hop');
  }

  // ---------------------------------------------------------------- a right answer
  async function success() {
    if (st.phase === 'celebrate') return;
    const token = st.token, q = st.q;
    st.phase = 'celebrate';
    clearHint();
    moments.lookoutDown();                                   // a quick first answer: the lookout makes way for the engineer
    MW.store.recordAnswer({ t: Date.now(), whole: q.whole, left: q.left, right: q.right, missing: q.missing,
      tries: st.tries, misses: st.misses, hint: st.hinted, check: check(), mode: mode() });
    if (st.ghosts) { st.ghosts.clear(); st.ghosts = null; }
    if (numbers()) {
      // Numbers8Right: a MeeMee pops up to carry the number (diagram.success, below) in place of the tile, which goes
      // back as the track slides down out of sight
      st.placed = null;
      track.hide();
      // the hint's MeeMee have done their job: they fly up to the ship, and the given parts carry their numbers again
      st.fixed.forEach(function (m) {
        m.el.classList.remove('is-arriving');
        m.el.classList.add('is-rescued');
        if (!MW.reduceMotion) m.moveTo(1030 + (Math.random() * 60 - 30), 300, 30, true);   // reduce motion: just fade
      });
      if (st.fixed.length) ['left', 'right'].forEach(function (k) { if (k !== q.missing) diagram.carry(k, q[k]); });
    }
    diagram.success(st.target, st.answer);
    const c = MW.LAYOUT[st.target];
    MW.sparkles(fxLayer, c.x, c.y, c.r + 34);
    pod.face('got-it');
    pod.celebrate();                                         // the ship's lights flash for about 4 s
    moments.engineer();                                      // the engineer taps the ship with the spanner
    MW.audio.sfx('chime');
    MW.log('success', JSON.stringify(q));
    await MW.wait(550);
    if (!(await ok(token))) return;
    st.praise = st.praise.length ? st.praise : MW.shuffle(PRAISE);
    await speak([[st.praise.pop()]]);
    if (!(await ok(token))) return;
    equation.show(q.left, q.right, q.whole);
    await speak([[N(q.left), 'and', N(q.right), 'make', E(q.whole)]]);
    if (!(await ok(token))) return;
    stars.set(st.qi + 1);
    MW.audio.sfx('twinkle');
    moments.navigator(st.qi + 1 < ROUND ? st.qi + 1 : null); // the navigator points to the next star
    await MW.wait(800);
    if (!(await ok(token))) return;
    // the rescued MeeMee fly up into the pod (numbers mode: the hint's went as the answer came)
    if (!numbers()) inTarget().concat(st.fixed).forEach(function (m) {
      m.el.classList.add('is-rescued');
      if (!MW.reduceMotion) m.moveTo(1030 + (Math.random() * 60 - 30), 300, 30, true);   // reduce motion: just fade
    });
    await MW.wait(650);
    if (!(await ok(token))) return;
    st.qi++;
    if (st.qi < ROUND) nextQuestion(token); else endRound(token);
  }

  async function endRound(token) {
    st.phase = 'done';
    clearBoard(true);
    MW.shell.show('screen-end');
    endStars.set(ROUND, ROUND);
    const jobs = MW.crew.jobs();
    MW.crew.CATS.forEach(function (w) { endCats[w].setJob(jobs[w]); });
    MW.audio.sfx('tune');
    endPod.celebrate();
    await MW.wait(300);
    await speak([['round-rescued-all']]);
    if (!(await ok(token))) return;
    // the rescued MeeMee hop once each, left to right
    Array.prototype.forEach.call(endMimi.children, function (m, i) {
      setTimeout(function () { m.classList.remove('is-hop'); void m.getBoundingClientRect(); m.classList.add('is-hop'); }, i * 160);
    });
    await MW.wait(500);
    if (!(await ok(token))) return;
    if (moments.commander()) {                               // the commander's radio calls; the MeeMee hop again
      await MW.wait(450);
      Array.prototype.forEach.call(endMimi.children, function (m, i) {
        setTimeout(function () { m.classList.remove('is-hop'); void m.getBoundingClientRect(); m.classList.add('is-hop'); }, i * 120);
      });
      await MW.wait(900);
      if (!(await ok(token))) return;
    }
    await speak([['round-another']]);
  }

  function hearAgain() {
    if (st.paused) return;
    if (st.phase === 'open' || st.phase === 'asking') { clearHint(); speak(st.prompt); }
  }
  // Home (from any screen, this game's or the world's): put everything away. The world has moved on the token,
  // so speech and timers from the round stop themselves.
  function leave() {
    clearHint();
    if (dragger) dragger.cancel();
    st.check = null; st.mode = null;
    pod.lightsOff(); endPod.lightsOff();
    clearBoard(true);
    if (moments) moments.clear();
  }

  // ---------------------------------------------------------------- grown-ups: progress and settings
  function sentence(a) {
    if (a.missing === 'whole') return a.left + ' + ' + a.right + ' = ?';
    if (a.missing === 'left') return '? + ' + a.right + ' = ' + a.whole;
    return a.left + ' + ? = ' + a.whole;
  }
  // one cell of the progress grid: a tick for secure, a dashed edge for practising, faint for not yet
  function cell(status, text) {
    const c = MW.make('span', 'mw-cell label is-' + status);
    if (status === 'secure') {
      const tick = MW.art('icon-tick'); tick.setAttribute('width', 16); tick.setAttribute('height', 16);
      c.appendChild(tick);
    }
    c.appendChild(document.createTextNode(text));
    return c;
  }
  function progressSection() {
    return {
      id: 'progress', title: 'Progress',
      render: function (el) {
        const G = MW.grownups;
        // which way's progress shows (Grownups8Progress): each way of answering keeps its own
        const shown = view || savedMode();
        G.h3(el, 'Showing progress for');
        const r0 = G.row(el);
        WAYS.forEach(function (m) {
          const b = G.btn(r0, m[1], function () { view = m[0]; MW.grownups.show('progress'); }, 'gu-choice');
          b.classList.toggle('is-on', m[0] === shown);
          b.setAttribute('data-way', m[0]);
        });
        G.p(el, 'Each way keeps its own progress: a bond secure with MeeMee to count starts again with numbers.');
        const all = MW.store.get('answers') || [];
        const answers = MW.bonds.ofMode(all, shown);
        const map = MW.bonds.statuses(answers);
        let nSecure = 0, nPractising = 0, total = 0;
        // the progress grid (the design system's BondGrid): every bond of 2 to 10, smaller part first
        const grid = MW.make('div', 'gu-grid');
        for (let w = 2; w <= 10; w++) {
          const row = MW.make('div', 'gu-grid-row');
          row.appendChild(MW.make('span', 'gu-grid-whole', null, String(w)));
          MW.bonds.pairs(w).forEach(function (pr) {
            const status = MW.bonds.status(map, w, pr[0]);
            total++;
            if (status === 'secure') nSecure++; else if (status === 'practising') nPractising++;
            row.appendChild(cell(status, pr[0] + ' + ' + pr[1]));
          });
          grid.appendChild(row);
        }
        G.p(el, answers.length
          ? 'Secure: ' + nSecure + ' of ' + total + ' bonds. Practising: ' + nPractising + '. Questions answered this way on this tablet: ' + answers.length + '.'
          : 'No questions answered this way on this tablet yet.', 'gu-lead');
        el.appendChild(grid);
        const legend = MW.make('div', 'gu-legend');
        legend.appendChild(cell('secure', 'Secure'));
        legend.appendChild(cell('practising', 'Practising'));
        legend.appendChild(cell('notyet', 'Not yet'));
        el.appendChild(legend);
        G.p(el, '<b>Secure</b> means right first time (no wrong check and no hint) on three different days. A wrong answer moves a bond back to practising, and its three days start again. Each round has 1 or 2 secure bonds and 3 or 4 that need work.', 'gu-note');
        G.p(el, '<b>Zero bonds</b> (such as 0 + 7) join the rounds once the other bonds of that number are secure. With MeeMee to count they come up only when your child taps Scruffles to check (Settings), because the answer is an empty circle. With numbers they come up whichever check is set, because there is a 0 tile.', 'gu-note');

        G.h3(el, 'Wholes in play');
        const r2 = G.row(el);
        const paintW = function () {
          const on = MW.store.setting('wholes') || [];
          Array.prototype.forEach.call(r2.children, function (b) { b.classList.toggle('is-on', on.indexOf(+b.textContent) >= 0); });
        };
        for (let w = 2; w <= 10; w++) {
          G.btn(r2, String(w), function () {
            let on = (MW.store.setting('wholes') || []).slice();
            if (on.indexOf(w) >= 0) { if (on.length > 1) on = on.filter(function (x) { return x !== w; }); }
            else on.push(w);
            on.sort(function (a, b) { return a - b; });
            MW.store.setting('wholes', on);
            paintW();
          }, 'mw-chip gu-chip');
        }
        paintW();
        G.p(el, 'Questions use only the wholes switched on. Changes start with the next round.', 'gu-note');

        // the answers given the way that's showing, like the grid and the summary
        if (answers.length) {
          G.h3(el, 'Recent answers');
          const rows = answers.slice(-25).reverse().map(function (a) {
            const d = new Date(a.t);
            const when = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

            const wrong = nums ? ' wrong number' : ' wrong check';
            if (a.tries) parts.push(a.tries + wrong + (a.tries === 1 ? '' : 's'));
            if (a.misses) parts.push(a.misses + (a.misses === 1 ? ' missed drop' : ' missed drops'));
            if (a.hint) parts.push('with the hint');
            const how = (parts.length ? parts.join(', ') : 'First time') + (a.check === 'tap' ? ' (tap Scruffles)' : '');

          t.innerHTML = '<tr><th>When</th><th>Question</th><th>How it went</th></tr>' + rows.map(function (r) {
            return '<tr><td>' + MW.esc(r[0]) + '</td><td>' + MW.esc(r[1]) + '</td><td>' + MW.esc(r[2]) + '</td></tr>';
          }).join('');
          el.appendChild(t);
        }
        const row = G.row(el);
        let armed = 0;
        MW.grownups.btn(row, 'Clear this tablet\'s progress', function (b) {
          if (Date.now() - armed < 4000) {
            MW.store.clear(); MW.grownups.show('progress');
          } else {
            armed = Date.now(); b.textContent = 'Tap again to clear';

      }

    return {
      id: 'settings', title: 'Settings',
      render: function (el) {
        const G = MW.grownups;
        // how the child answers (Grownups8Settings): MeeMee to count, or numbers
        G.h3(el, 'How your child answers');
        const r0 = G.row(el);
        const paintWay = function () {
          Array.prototype.forEach.call(r0.children, function (b, i) { b.classList.toggle('is-on', WAYS[i][0] === savedMode()); });
        };
        WAYS.forEach(function (m) {
          const b = G.btn(r0, m[1], function () { MW.store.setting('answerMode', m[0]); view = null; paintWay(); MW.log('setting', 'answer ' + m[0]); }, 'gu-choice');

        paintWay();
        G.p(el, '<b>MeeMee to count</b> (the usual way): your child drags MeeMee into the empty circle, counting as they go.');

        G.h3(el, 'Answer check');
        const r1 = G.row(el);
        const modes = [['tap', 'When your child taps Scruffles'], ['auto', 'As soon as the count is right']];

        });
        paint();
        G.p(el, '<b>When your child taps Scruffles</b> (the usual way): they put in as many MeeMee as they think, then tap Scruffles to check. The first two questions of each round end with "Tap Scruffles when you\'re ready." (so does any question whose answer is zero), and the ship\'s lights glow once there is a MeeMee in the circle. Too many gets "That\'s too many. Take one back."; two wrong checks bring the counting-on hint.', 'gu-note');
        G.p(el, '<b>As soon as the count is right:</b> the question completes when the waiting circle holds the right number of MeeMee. No deciding when to stop, so it is easier but teaches less.', 'gu-note');

        G.p(el, 'A change starts with the next round. With numbers, the answer check works the same way, and zero bonds come up either way. Which numbers are in play is on the Progress tab.', 'gu-note');
      }
    };
  }

  R.track = function () { return track; }; R.diagram = function () { return diagram; }; R.mode = mode;
  // Ask one question straight away, as a round of its own in the way set in Settings, with nothing said (the tests use
  // it to put every bond on the screen in numbers mode without playing whole rounds).
  R.ask = function (q) {
    const token = ++st.token;
    clearHint();
    if (dragger) dragger.cancel();
    st.check = savedCheck(); st.mode = savedMode();
    st.round = [Object.assign({}, q)]; st.qi = 0;
    clearBoard(true);
    showMode();
    MW.shell.show('screen-game');
    st.q = st.round[0]; st.target = q.missing; st.answer = q.missing === 'whole' ? q.whole : q[q.missing];
    st.tries = 0; st.misses = 0; st.hinted = false;
    diagram.set(st.q);
    pod.face('thinking'); pod.lightsOff();
    if (track.away()) track.show();
    st.prompt = promptFor(st.q);
    st.phase = 'open';
    return token;
  };
  R.crew = function () { return W.crewScreen; };
})();
