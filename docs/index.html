/* MeeMee Rockets: the words file read into a form the game uses, each word's step, and which words go into a round.

   Each word's step (decided 10 October):
     notyet    never asked;
     tiles     built from sound tiles ('c ar t oo n'), until it is right first time on three different days;
     letters   then built from single letters with its spares, three more days;
     harder    then from single letters with the tray filled to 10 tiles, three more days;
     secure    right first time in harder letters too. Secure words come back for review, in harder letters.
   Right first time: found and built with no wrong tap, no wrong drop and no hint. A wrong try restarts that step's
   three days. A word goes back only from secure (answer 12 of the 0.6.0 PRD): two slips in a row (answers not right
   first time) take it back to harder letters, for three more days right first time; a right answer in between clears
   the first slip.
   What's in play: one week (that week's words and the tricky words of the weeks before it), or every week ('all', the
   Words tab's "Weeks 1–5").
   A round: five different words (or every word in play, if fewer), one or two secure ones for review and the rest not
   yet secure.
     One week: the rest at random, and at least 3 of the 5 from the chosen week's own words while it has that many in
               play (answer 10).
     All weeks: the rest from the lowest step first (not yet, sound tiles, letters, harder letters), at random within a
               step (answer 8).
   Pure functions of the words file and the saved answers, so they are easy to test. */
(function () {
  'use strict';
  const MW = window.MW;
  const S = MW.wordSteps = {};

  S.STEPS = ['notyet', 'tiles', 'letters', 'harder', 'secure'];
  S.NAMES = { notyet: 'Not yet', tiles: 'Sound tiles', letters: 'Letters', harder: 'Harder letters', secure: 'Secure' };
  S.ALL = 'all';                 // every week in play (saved as the week)
  S.SILENT = '-';                // a tile that says nothing (the e of a split pair)
  S.SLIPS = 2;                   // slips in a row that take a secure word back to harder letters
  function rank(step) { return S.STEPS.indexOf(step); }

  function day(t) {
    const d = new Date(t);
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();      // the tablet's own calendar day
  }
  S.day = day;
  function shuffle(list, rand) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  S.shuffle = shuffle;

  // ---------------------------------------------------------------- the words file
  // 'h [ere]' -> [{ text: 'h', tricky: false }, { text: 'ere', tricky: true }]
  S.tiles = function (spec) {
    return String(spec).trim().split(/\s+/).map(function (t) {
      const m = /^\[([a-z]+)\]$/.exec(t);
      return m ? { text: m[1], tricky: true } : { text: t, tricky: false };
    });
  };
  // Every word with its week, whether it is one of that week's tricky words, its tiles (each with what it says), letters
  // and spares. Problems in the file (a word with no tiles, tiles that don't spell it, a tile with no sound) are listed,
  // not thrown, so the tests and the grown-ups area can say what is wrong.
  S.read = function (data) {
    const out = { words: {}, order: [], weeks: [], problems: [], harderTray: +data.harderTray || 10, startWeek: +data.startWeek || 1,
      sounds: {} };
    const usual = data.sounds && typeof data.sounds === 'object' ? data.sounds : {};
    const goodId = function (id) { return id === S.SILENT || /^[a-z]+(-[a-z]+)*$/.test(String(id)); };
    Object.keys(usual).forEach(function (g) {
      if (goodId(usual[g])) out.sounds[g] = usual[g];
      else out.problems.push('sounds: ' + g + ' should be a sound id, such as "ai"');
    });
    (data.weeks || []).forEach(function (wk) {
      const n = +wk.week;
      out.weeks.push({ week: n, tricky: (wk.tricky || []).slice(), other: (wk.other || []).slice() });
      [['tricky', true], ['other', false]].forEach(function (kind) {
        (wk[kind[0]] || []).forEach(function (w) {
          const spec = (data.words || {})[w];
          if (!spec || !spec.tiles) { out.problems.push(w + ': no tiles in the words file'); return; }
          if (out.words[w]) { out.problems.push(w + ': in two weeks'); return; }
          const tiles = S.tiles(spec.tiles);
          if (tiles.map(function (t) { return t.text; }).join('') !== w) out.problems.push(w + ': its tiles spell ' + tiles.map(function (t) { return t.text; }).join(''));
          if (!/^[a-z]+$/.test(w)) out.problems.push(w + ': only lower-case letters, please');
          // what each tile says: the word's own sound for it, or the tile's usual sound
          const own = spec.sounds && typeof spec.sounds === 'object' ? spec.sounds : {};
          Object.keys(own).forEach(function (k) {
            if (!tiles.some(function (t) { return t.text === k; })) out.problems.push(w + ': its sounds name ' + k + ', which isn\'t one of its tiles');
            else if (!goodId(own[k])) out.problems.push(w + ': the sound for ' + k + ' should be a sound id, such as "ai", or "-"');
          });
          tiles.forEach(function (t) {
            const mine = Object.prototype.hasOwnProperty.call(own, t.text) && goodId(own[t.text]);
            t.sound = mine ? own[t.text] : (out.sounds[t.text] || null);
            if (t.tricky && !mine) out.problems.push(w + ': say what its tricky tile ' + t.text + ' says in its sounds');
            else if (!t.sound) out.problems.push(w + ': no sound for its tile ' + t.text);
          });
          const letters = [];
          tiles.forEach(function (t) { t.text.split('').forEach(function (ch) { letters.push({ text: ch, tricky: t.tricky }); }); });
          const spares = String(spec.spares || '').trim().split(/\s+/).filter(Boolean);
          spares.forEach(function (s) { if (!/^[a-z]$/.test(s)) out.problems.push(w + ': the spare ' + s + ' should be one letter'); });
          out.words[w] = { word: w, week: n, tricky: kind[1], tiles: tiles, letters: letters, spares: spares, says: spec.says || '' };
          out.order.push(w);
        });
      });
    });
    out.weeks.sort(function (a, b) { return a.week - b.week; });
    if (!out.weeks.some(function (wk) { return wk.week === out.startWeek; }) && out.weeks.length) out.startWeek = out.weeks[out.weeks.length - 1].week;
    return out;
  };
  // A tile's recorded sound: the line id, or null for a tile that says nothing.
  S.soundLine = function (sound) { return sound && sound !== S.SILENT ? 'words-s-' + sound : null; };
  // Every sound the words use, as line ids (for the grown-ups' list of sounds waiting for a recording).
  S.soundLines = function (book) {
    const out = [];
    book.order.forEach(function (w) {
      book.words[w].tiles.forEach(function (t) { const id = S.soundLine(t.sound); if (id && out.indexOf(id) < 0) out.push(id); });
    });
    return out;
  };
  // The all-weeks choice's name, from the words file: "Weeks 1–5" (an en dash), or null with fewer than two weeks.
  S.allLabel = function (book) {
    if (book.weeks.length < 2) return null;
    return 'Weeks ' + book.weeks[0].week + '–' + book.weeks[book.weeks.length - 1].week;
  };

  // The words in play for a week: that week's words (tricky, then other) and the tricky words of the weeks before it.
  // For 'all', every word, week by week (each week's tricky words, then its other words).
  S.inPlay = function (book, week) {
    const out = [];
    if (week === S.ALL) {
      book.weeks.forEach(function (wk) { out.push.apply(out, wk.tricky.concat(wk.other)); });
    } else {
      book.weeks.forEach(function (wk) {
        if (wk.week === week) out.push.apply(out, wk.tricky.concat(wk.other));
      });
      book.weeks.forEach(function (wk) {
        if (wk.week < week) out.push.apply(out, wk.tricky);
      });
    }
    return out.filter(function (w) { return book.words[w]; });
  };
  // A week's own words (its tricky words and its other words).
  S.ownWords = function (book, week) {
    const wk = book.weeks.filter(function (x) { return x.week === week; })[0];
    return wk ? wk.tricky.concat(wk.other).filter(function (w) { return book.words[w]; }) : [];
  };

  // ---------------------------------------------------------------- steps
  S.firstTime = function (a) { return !a.tapped && !a.drops && !a.hint; };
  // answers: [{ t, w, step, tapped, drops, hint }] -> { word: { step, days: [...], answers: n, slips: n } }
  S.statuses = function (answers) {
    const by = {};
    (answers || []).filter(function (a) {
      return a && typeof a.t === 'number' && typeof a.w === 'string';
    }).sort(function (x, y) { return x.t - y.t; }).forEach(function (a) {
      const s = by[a.w] || (by[a.w] = { step: 'tiles', days: [], answers: 0, slips: 0 });
      s.answers++;
      // Each answer was saved at the step its word was on, so the replay follows it where they differ (only when the
      // oldest answers have been trimmed away, at 3,000):
      //   saved at a later step than the replay has reached: carry on from there;
      //   saved at an earlier one: the word went back from secure (two slips, the first one trimmed away), so it is on
      //   that step again (its days start from this answer).
      const r = rank(a.step);
      if (r > rank(s.step) || (r >= rank('tiles') && r < rank(s.step))) { s.step = a.step; s.days = []; s.slips = 0; }
      if (s.step === 'secure') {
        // a secure word: two slips in a row take it back to harder letters; a right answer in between clears one
        if (S.firstTime(a)) s.slips = 0;
        else if (++s.slips >= S.SLIPS) { s.step = 'harder'; s.days = []; s.slips = 0; }
        return;
      }
      if (S.firstTime(a)) { const d = day(a.t); if (s.days.indexOf(d) < 0) s.days.push(d); }
      else s.days = [];
      if (s.days.length >= 3) { s.step = S.STEPS[rank(s.step) + 1]; s.days = []; }
    });
    return by;
  };
  S.step = function (map, w) { return map[w] ? map[w].step : 'notyet'; };
  // How a word is built at each step: sound tiles until it is secure with them, then letters, then harder letters.
  S.mode = function (step) { return step === 'letters' ? 'letters' : (step === 'harder' || step === 'secure') ? 'harder' : 'tiles'; };

  // ---------------------------------------------------------------- a round
  // opts: { words: the words in play, answers, size: 5, rand,
  //         lowest: true with every week in play (the words on the lowest step first),
  //         own: the chosen week's own words in play (one week in play: at least 3 of them a round) } -> [{ word, step }]
  S.pickRound = function (opts) {
    const rand = opts.rand || Math.random;
    const size = Math.min(opts.size || 5, opts.words.length);
    const map = S.statuses(opts.answers);
    const isSecure = function (w) { return S.step(map, w) === 'secure'; };
    const secure = shuffle(opts.words.filter(isSecure), rand);
    let work = shuffle(opts.words.filter(function (w) { return !isSecure(w); }), rand);
    if (opts.lowest) {                                        // the lowest step first, at random within a step
      const keyed = work.map(function (w, i) { return { w: w, r: rank(S.step(map, w)), i: i }; });
      keyed.sort(function (a, b) { return a.r - b.r || a.i - b.i; });
      work = keyed.map(function (k) { return k.w; });
    }
    let nSecure = Math.min(rand() < 0.5 ? 1 : 2, secure.length);
    const nWork = Math.min(size - nSecure, work.length);
    nSecure = Math.min(size - nWork, secure.length);         // too few to practise: more secure ones
    const chosen = secure.slice(0, nSecure).concat(work.slice(0, nWork));
    if (opts.own && opts.own.length) {
      // one week in play: at least 3 of the round from the week's own words (all of them, if it has fewer in play).
      // Bring in its words that need work first, then its secure ones, each in place of another week's word of the
      // same kind where there is one.
      const own = opts.own.filter(function (w) { return opts.words.indexOf(w) >= 0; });
      const mine = function (w) { return own.indexOf(w) >= 0; };
      const need = Math.min(3, chosen.length, own.length);
      const out = function (list) { return list.filter(function (w) { return chosen.indexOf(w) < 0; }); };
      const bring = shuffle(out(own).filter(function (w) { return !isSecure(w); }), rand)
        .concat(shuffle(out(own).filter(isSecure), rand));
      while (chosen.filter(mine).length < need && bring.length) {
        const w = bring.shift();
        const others = chosen.filter(function (x) { return !mine(x); });
        const same = others.filter(function (x) { return isSecure(x) === isSecure(w); });
        const drop = (same.length ? same : others).slice(-1)[0];
        chosen[chosen.indexOf(drop)] = w;
      }
    }
    return shuffle(chosen, rand).map(function (w) { const s = S.step(map, w); return { word: w, step: s === 'notyet' ? 'tiles' : s }; });
  };

  // Find: the word asked for and two others from the words in play, in a random order.
  S.choices = function (word, words, rand, n) {
    rand = rand || Math.random;
    const others = shuffle(words.filter(function (w) { return w !== word; }), rand).slice(0, (n || 3) - 1);
    return shuffle([word].concat(others), rand);
  };

  // Build: the places in the rocket and the tiles in the tray, for a word at a step.
  //   tiles    one tile per sound ('ay'), no spares; each says its sound in this word when picked up (sound);
  //   letters  one tile per letter, with the word's spares;
  //   harder   as letters, then the tray filled up to book.harderTray with letters from other words
  //            (fill: the words to take them from, in order of preference), each a letter not already in the tray.
  // -> { mode, places: [{ text, tricky, sound }], tray: [{ text, tricky, spare, sound }] } (the tray shuffled)
  S.plan = function (book, word, step, fill, rand) {
    rand = rand || Math.random;
    const e = book.words[word];
    const mode = S.mode(step);
    const places = (mode === 'tiles' ? e.tiles : e.letters).map(function (t) {
      return { text: t.text, tricky: t.tricky, sound: mode === 'tiles' ? t.sound : null };
    });
    const tray = places.map(function (p) { return { text: p.text, tricky: p.tricky, spare: false, sound: p.sound }; });
    if (mode !== 'tiles') e.spares.forEach(function (s) { tray.push({ text: s, tricky: false, spare: true, sound: null }); });
    if (mode === 'harder') {
      const have = {};
      tray.forEach(function (t) { have[t.text] = true; });
      (fill || []).forEach(function (group) {
        const letters = [];
        group.filter(function (w) { return w !== word && book.words[w]; }).forEach(function (w) {
          w.split('').forEach(function (ch) { if (!have[ch] && letters.indexOf(ch) < 0) letters.push(ch); });
        });
        shuffle(letters, rand).forEach(function (ch) {
          if (tray.length >= book.harderTray || have[ch]) return;
          have[ch] = true;
          tray.push({ text: ch, tricky: false, spare: true, sound: null });
        });
      });
    }
    return { mode: mode, places: places, tray: shuffle(tray, rand) };
  };
  // Where harder letters' extra letters come from, in order of preference:
  //   one week in play   that week's words, then the other words in play, then any word in the file;
  //   every week (all)   the word's own week's words, then any word in play, then any word in the file (answer 9).
  // pool: the words in play this round (the recorded ones); without it, every word in play.
  S.fillFrom = function (book, week, word, pool) {
    const inPlay = pool || S.inPlay(book, week);
    if (week === S.ALL) {
      const e = book.words[word];
      return [e ? S.ownWords(book, e.week) : [], inPlay, book.order];
    }
    return [S.ownWords(book, week), inPlay, book.order];
  };

  // Every question the game can ask for a week (or 'all'): each word in play, to find and to build at each step.
  S.allQuestions = function (book, week) {
    const out = [];
    S.inPlay(book, week).forEach(function (w) {
      out.push({ word: w, kind: 'find' });
      ['tiles', 'letters', 'harder'].forEach(function (m) { out.push({ word: w, kind: 'build', mode: m }); });
    });
    return out;
  };
})();

/* MeeMee Rockets: the crew's job moments (0.6.0; the design canvas's round 7, board Moments7, as drawn).
   A cat with a job appears briefly at its own moment, with no words, never over the word being found or built:
     lookout    as a round starts, peeks up from the bottom right of Find with the telescope (below Scruffles's ship);
     engineer   on a right tap in Find, pops up under the launch pad below that rocket and taps its clamp with the spanner;
     navigator  as the star lights after the launch, holds up the star map on the cargo tray and points the way to the next
                star (the dotted route goes behind the rocket, so it never crosses the word);
     cook       on the end screen, brings a pan of fish for the MeeMee in the little rockets.
   A job no cat has has no moment (MW.crew.who). With reduce motion the cats fade in and out instead of moving (the kit's
   moment styles), and the spanner doesn't swing.
   Positions are stage px from the board (each of its panels is a 1280 x 800 stage drawn at half size). MeeMee Rescue's
   moments.js is the example this follows; Rockets has its own, because its screens are its own. */
(function () {
  'use strict';
  const MW = window.MW;

  const L = MW.LAYOUT.wordsMoments = {
    // a 210-wide cat facing left, its head and the telescope showing above the stage's bottom edge
    lookout: { x: 1000, y: 640, w: 210, scope: { x: 85, y: 2, size: 143 }, clip: { x: 960, w: 320 } },
    // under the pad below the tapped rocket (dx from its centre line); the spanner held up to the clamp, turned 40 degrees
    engineer: { dx: -83, y: 676, w: 160, spanner: { dx: 29, y: 620, size: 84, turn: -40 } },
    // standing on the cargo tray, the star map held up; the route starts at the top of the map
    navigator: { x: 600, y: 470, w: 140, map: { x: 650, y: 440, size: 96 }, from: { dx: 50, dy: 12 }, below: 24 },
    // beside the little rockets, facing them, the pan held out to the last one
    cook: { x: 880, y: 560, w: 170, pan: { x: 800, y: 630, size: 120 } }
  };
  function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; return el; }
  function size(svg, s) { svg.setAttribute('width', s); svg.setAttribute('height', s); return svg; }
  function drop(el, ms) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, ms); }
  function layer(parent, before) {
    const l = MW.make('div', 'mw-layer mw-fill mw-moments');
    if (before) parent.insertBefore(l, before); else parent.appendChild(l);
    return l;
  }

  // opts: { find: Find's screen, findBefore: the layer the lookout and engineer go under (in front of the rockets and
  //         the pad), build: Build's screen, routeBefore: the rocket's layer (the route goes behind it), buildBefore: the
  //         layer the navigator goes under (in front of the tray and its tiles), stars: Build's MW.stars,
  //         end: the end screen, endBefore: what the cook goes under (the Play button) }
  MW.wordsMoments = function (opts) {
    const m = {};
    let timers = [];
    const findLayer = layer(opts.find, opts.findBefore);
    const routeLayer = layer(opts.build, opts.routeBefore);
    const buildLayer = layer(opts.build, opts.buildBefore);
    const endLayer = layer(opts.end, opts.endBefore);
    let peek = null;

    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function catFor(job, w) {
      const who = MW.crew.who(job);
      if (!who) return null;
      const c = MW.crew.cat(who, w);
      c.setJob(job);
      return c;
    }
    // a box w x h at (x, y) whose drawings face the other way (the board's cats facing left)
    function flipBox(x, y, w, h) {
      const f = place(MW.make('div', 'words-moment-flip'), x, y);
      f.style.width = w + 'px'; f.style.height = h + 'px';
      return f;
    }
    function show(el) { void el.getBoundingClientRect(); el.classList.add('is-shown'); }
    function hide(el, after) { later(function () { el.classList.remove('is-shown'); drop(el, 400); }, after); }

    // ---------------------------------------------------------------- lookout (Find, as a round starts)
    m.lookoutUp = function () {
      m.lookoutDown(true);
      const k = L.lookout, cat = catFor('lookout', k.w);
      if (!cat) return false;
      // a box clipped at the stage's bottom edge, the cat rising inside it (a fade with reduce motion)
      const box = place(MW.make('div', 'mw-moment mw-peek', { 'data-moment': 'lookout' }), k.clip.x, k.y);
      box.style.width = k.clip.w + 'px'; box.style.height = (MW.stage.H - k.y) + 'px';
      const inner = MW.make('div', 'mw-peek-inner');
      const flip = flipBox(k.x - k.clip.x, 0, k.w, cat.h);
      flip.appendChild(cat);
      const scope = place(MW.make('div', 'words-moment-held'), k.scope.x, k.scope.y);
      scope.appendChild(size(MW.art('held-telescope'), k.scope.size));
      flip.appendChild(scope);
      inner.appendChild(flip);
      box.appendChild(inner);
      findLayer.appendChild(box);
      peek = box;
      show(box);
      MW.log('moment', 'lookout');
      return true;
    };
    m.lookoutShown = function () { return !!peek; };
    m.lookoutDown = function (now) {
      if (!peek) return;
      const b = peek; peek = null;
      if (now) { drop(b, 0); return; }
      b.classList.remove('is-shown');
      drop(b, 600);
    };

    // ---------------------------------------------------------------- engineer (Find, a right tap)
    // cx: the tapped rocket's centre line
    m.engineer = function (cx) {
      const k = L.engineer, cat = catFor('engineer', k.w);
      if (!cat) return false;
      m.lookoutDown();                                        // a quick first answer: the lookout makes way
      const box = place(MW.make('div', 'mw-moment mw-peek', { 'data-moment': 'engineer' }), cx + k.dx, k.y);
      box.style.width = k.w + 'px'; box.style.height = (MW.stage.H - k.y) + 'px';
      const inner = MW.make('div', 'mw-peek-inner');
      inner.appendChild(cat);
      box.appendChild(inner);
      // the spanner: it pops up (the kit's moment style), turned as on the board, and swings from its ring to tap
      const sp = place(MW.make('div', 'mw-moment mw-moment-pop', { 'data-moment': 'engineer-spanner' }), cx + k.spanner.dx, k.spanner.y);
      const turn = MW.make('div', 'words-spanner');
      turn.style.transform = 'rotate(' + k.spanner.turn + 'deg)';
      const swing = MW.make('div', 'words-spanner-swing');
      swing.appendChild(size(MW.art('job-engineer'), k.spanner.size));
      turn.appendChild(swing);
      sp.appendChild(turn);
      findLayer.appendChild(box);
      findLayer.appendChild(sp);
      show(box);
      later(function () { show(sp); }, 200);
      later(function () { swing.classList.add('is-tapping'); }, 450);   // two taps on the clamp
      hide(box, 2600); hide(sp, 2600);
      MW.log('moment', 'engineer ' + Math.round(cx));
      return true;
    };

    // ---------------------------------------------------------------- navigator (Build, as the star lights)
    // next: the star to point at, or null after the last word
    m.navigator = function (next) {
      const k = L.navigator, cat = catFor('navigator', k.w);
      if (!cat) return false;
      const box = place(MW.make('div', 'mw-moment mw-moment-pop', { 'data-moment': 'navigator' }), k.x, k.y);
      box.style.width = k.w + 'px'; box.style.height = cat.h + 'px';
      box.appendChild(cat);
      const mp = place(MW.make('div', 'mw-moment mw-moment-pop words-moment-held', { 'data-moment': 'navigator-map' }), k.map.x, k.map.y);
      mp.appendChild(size(MW.art('job-navigator'), k.map.size));
      const star = next !== null && next !== undefined ? opts.stars.el.children[next] : null;
      if (star) {
        // a dotted route from the top of the map to just below the star (stage px), behind the rocket
        const s = MW.stage.scale || 1, box0 = opts.stars.el.getBoundingClientRect(), r = star.getBoundingClientRect();
        const sx = Math.round(opts.stars.el.offsetLeft + (r.left - box0.left + r.width / 2) / s);
        const sy = Math.round(opts.stars.el.offsetTop + (r.bottom - box0.top) / s + k.below);
        const fx = k.map.x + k.from.dx, fy = k.map.y + k.from.dy;
        const route = MW.make('div', 'mw-layer mw-fill mw-route mw-moment-pop', { 'data-moment': 'navigator-route' });
        route.innerHTML = '<svg width="1280" height="800" viewBox="0 0 1280 800" aria-hidden="true"><path class="s-mint" fill="none" stroke-width="6" '
          + 'stroke-dasharray="2 14" stroke-linecap="round" d="M' + fx + ' ' + fy + ' Q ' + (fx - 10) + ' ' + Math.round(sy + 0.38 * (fy - sy)) + ' ' + sx + ' ' + sy + '"/></svg>';
        routeLayer.appendChild(route);
        later(function () { show(route); }, 250);
        hide(route, 1900);
      }
      buildLayer.appendChild(box);
      buildLayer.appendChild(mp);
      show(box);
      later(function () { show(mp); }, 120);
      hide(box, 2100); hide(mp, 2100);
      MW.log('moment', 'navigator ' + (star ? next : 'end'));
      return true;
    };

    // ---------------------------------------------------------------- cook (the end screen)
    m.cook = function () {
      const k = L.cook, cat = catFor('cook', k.w);
      if (!cat) return false;
      const box = place(MW.make('div', 'mw-moment mw-moment-pop', { 'data-moment': 'cook' }), k.x, k.y);
      box.style.width = k.w + 'px'; box.style.height = cat.h + 'px';
      const flip = flipBox(0, 0, k.w, cat.h);
      flip.appendChild(cat);
      box.appendChild(flip);
      const pan = place(MW.make('div', 'mw-moment mw-cook-pan', { 'data-moment': 'cook-pan' }), k.pan.x, k.pan.y);
      pan.appendChild(size(MW.art('job-cook'), k.pan.size));
      endLayer.appendChild(box);
      endLayer.appendChild(pan);
      show(box);
      later(function () { show(pan); MW.sparkles(endLayer, k.pan.x + k.pan.size / 2, k.pan.y + k.pan.size / 2, 70); }, 250);
      MW.log('moment', 'cook');
      return true;
    };

    // the in-round cats leave when the next word starts
    m.settle = function () {
      m.lookoutDown();
      [findLayer, routeLayer, buildLayer].forEach(function (l) {
        Array.prototype.forEach.call(l.querySelectorAll('.is-shown'), function (el) { el.classList.remove('is-shown'); drop(el, 400); });
      });
    };
    // leaving, or a new round: everything goes at once
    m.clear = function () {
      timers.forEach(clearTimeout); timers = [];
      peek = null;
      [findLayer, routeLayer, buildLayer, endLayer].forEach(function (l) { l.innerHTML = ''; });
    };
    m.layers = { find: findLayer, route: routeLayer, build: buildLayer, end: endLayer };
    return m;
  };
})();

/* MeeMee Rockets: the tricky-words game.
   A round is five words. Each word is found, then built, and earns a star:
     Find   three rockets on the launch pad, each with a word. "Find the word… one." He taps one.
     Build  the word's rocket lies on its side with empty portholes; its tiles are loose in the tray. "Now build the
            word… one." He drags the tiles into the portholes, left to right. In the sound tiles step a tile says its
            sound as it is picked up. The last tile lights the engines and the launch lights, and the rocket launches.
   The words, their tiles, sounds and spares are in words.js; each word's step and how rounds are chosen in steps.js;
   the crew's job moments in moments.js.
   It joins the world with MW.world.game below: the world gives it the start screen, the map, pausing, Home and the
   grown-ups area (its Words tab is at the end of this file). */
(function () {
  'use strict';
  const MW = window.MW;
  const W = MW.world;
  const S = MW.wordSteps;
  const ID = 'words';
  const FIND = 'screen-words-find', BUILD = 'screen-words-build', END = 'screen-words-end';
  const ROUND = 5;
  const PRAISE = ['words-found-it', 'words-super-reading', 'words-well-done'];

  // Where things go (stage px), from the round 6 boards. The drawings' own sizes are in art.py.
  const ROCKETS = { xs: [197, 490, 783], base: 693, at: [160, 560], panel: [49, 301.7, 222, 112.5], wordMax: 60 };   // art.py: ROCKET_AT, rocket_panel()
  const D = 104, GAP = 16, H = D + 84, NOSE = H * 0.82, BACK = [200, 70], NOSE_X = 12;   // the rocket on its side
  const SHIP = { x: 150, y: 195, right: 1250, slack: 34 };
  // The cargo tray: one place and size for every word, below the rocket and left of Scruffles. One row of tiles when
  // they fit; two rows of up to five when they don't (harder letters always).
  const TRAY = { x: 110, y: 462, w: 656, h: 290, pad: 28, gap: 20, perRow: 5, one: [150], two: [88, 212] };
  const POD = { find: [965, 337, 270], build: [951, 450, 290] };
  // The launch lights (LaunchLights card): 22 px lights along the hull's peach-dark stripe and its top edge, 92 apart,
  // the two rows half a step apart (rocket units, the hull's back top corner at 0, 0), numbered from the back to the nose
  // and split into three groups in turn. Each is on for a third of a second and off for two thirds; the groups start a
  // third of a second apart, so they chase from the back to the nose (game.css). Lit and steady with reduce motion.
  const LAMPS = { step: 92, rows: [[44, 168], [90, 15]], end: 25, groups: 3, stagger: 1000 / 3, art: 23 };

  const BOOK = S.read(MW.wordsData || { weeks: [], words: {} });
  const st = { round: [], qi: 0, item: null, prompt: null, praise: [], timers: [], tapped: 0, drops: 0, hinted: false,
    trickySaid: false, rockets: [], tiles: [], places: [], next: 0, ship: null, plan: null,
    pool: null, week: null, repeat: null, pauses: 0, lamps: [] };
  const G = MW.wordsGame = { st: st, book: BOOK, nextRound: null };
  let findPod, buildPod, endPod, findStars, buildStars, endStars, findFx, buildFx, tileLayer, trayEl, shipLayer, dragger, again, endRockets;
  let moments = null;

  W.game({
    id: ID,
    build: function () {
      buildFind(); buildBuild(); buildEnd();
      moments = MW.wordsMoments({ find: MW.$(FIND), findBefore: findFx, build: MW.$(BUILD), routeBefore: shipLayer, buildBefore: buildFx,
        stars: buildStars, end: MW.$(END), endBefore: again });
      G.moments = moments;
    },
    start: function () { startRound(); },
    sections: [{ id: 'words-progress', title: 'Words', render: renderProgress }],
    onPause: function () { st.pauses++; clearTimers(); if (dragger) dragger.cancel(); },
    onResume: function () {                                     // carry on: ask again
      if ((MW.shell.screen === FIND && W.st.phase === 'words-find') || (MW.shell.screen === BUILD && W.st.phase === 'words-build')) {
        findPod.face('thinking'); buildPod.face('thinking');
        W.speak(st.prompt);
        // the pause cleared the lookout's duck: it ducks as it would have, once the first question has been asked again
        if (MW.shell.screen === FIND && moments.lookoutShown()) later(W.st.token, 1800, function () { moments.lookoutDown(); });
      }
    },
    onHome: leave
  });

  // ---------------------------------------------------------------- saved data (this game's own, on the tablet)
  // Read without creating it (MW.store.peek), so a tablet that has never played keeps nothing for this game.
  function saved() { return MW.store.peek(ID); }
  function answers() { return Array.isArray(saved().answers) ? saved().answers : []; }
  // The week in play: a week's number, or S.ALL for every week (the Words tab's "Weeks 1–5"). A week saved before 0.6.0
  // (week 5) carries on; one no longer in the words file gives way to the file's start week.
  function week() {
    const v = saved().week;
    if (v === S.ALL && S.allLabel(BOOK)) return S.ALL;
    const w = +v;
    return BOOK.weeks.some(function (x) { return x.week === w; }) ? w : BOOK.startWeek;
  }
  function recorded(w) { return MW.audio.recorded(line(w)); }
  function line(w) { return 'words-w-' + w; }
  // The words in play: the week's words and earlier weeks' tricky words (or every week's words), once their
  // recordings are on the page.
  function inPlay() { return S.inPlay(BOOK, week()).filter(recorded); }
  // A round keeps the words and the week it started with: a week picked in the grown-ups area starts with the next round.
  function roundPool() { return st.pool || inPlay(); }
  function roundWeek() { return st.week || week(); }

  // ---------------------------------------------------------------- the screens
  function buildFind() {
    const s = W.screen(FIND, 'MeeMee Rockets: find the word');
    const pad = MW.art('words-pad'); pad.classList.add('mw-layer'); s.appendChild(pad);
    st.rockets = ROCKETS.xs.map(function (cx, i) {
      const b = MW.make('button', 'words-rocket mw-abs', { type: 'button', 'aria-label': 'A rocket' });
      b.style.left = (cx - 135) + 'px'; b.style.top = '140px';
      const art = MW.art('words-rocket');
      art.setAttribute('class', 'words-rocket-art');
      art.style.left = (135 - ROCKETS.at[0]) + 'px'; art.style.top = (ROCKETS.base - ROCKETS.at[1] - 140) + 'px';
      b.appendChild(art);
      const p = ROCKETS.panel;
      const panel = MW.make('span', 'words-panel');
      panel.style.left = (p[0] + 135 - ROCKETS.at[0]) + 'px'; panel.style.top = (p[1] + ROCKETS.base - ROCKETS.at[1] - 140) + 'px';
      panel.style.width = p[2] + 'px'; panel.style.height = p[3] + 'px';
      const word = MW.make('span', 'words-panel-word');
      panel.appendChild(word);
      b.appendChild(panel);
      s.appendChild(b);
      const r = { el: b, wordEl: word, word: null, cx: cx, i: i };
      MW.onTap(b, function () { tapRocket(r); });
      return r;
    });
    findPod = MW.pod(s, POD.find[0], POD.find[1], POD.find[2]);
    MW.onTap(findPod.el, hearAgain);
    findStars = MW.stars(s, MW.LAYOUT.stars.cx, MW.LAYOUT.stars.y, null, { centre: true });   // centred, however many words
    findFx = MW.make('div', 'mw-layer mw-fill'); s.appendChild(findFx);
    MW.shell.buttons(s, ['home', 'music', 'hear'], { home: W.home, hear: hearAgain });
  }

  function buildBuild() {
    const s = W.screen(BUILD, 'MeeMee Rockets: build the word');
    trayEl = MW.make('div', 'words-tray mw-abs', { 'aria-hidden': 'true' });
    trayEl.style.left = TRAY.x + 'px'; trayEl.style.top = TRAY.y + 'px'; trayEl.style.width = TRAY.w + 'px'; trayEl.style.height = TRAY.h + 'px';
    trayEl.appendChild(MW.make('span', 'words-tray-light'));
    trayEl.appendChild(MW.make('span', 'words-tray-light words-tray-light--r'));
    s.appendChild(trayEl);
    shipLayer = MW.make('div', 'mw-layer mw-fill'); s.appendChild(shipLayer);
    buildPod = MW.pod(s, POD.build[0], POD.build[1], POD.build[2]);
    MW.onTap(buildPod.el, function () { if (!(dragger && dragger.dragging())) hearAgain(); });
    buildStars = MW.stars(s, MW.LAYOUT.stars.cx, MW.LAYOUT.stars.y, null, { centre: true });
    tileLayer = MW.make('div', 'mw-layer mw-fill words-tiles'); s.appendChild(tileLayer);
    buildFx = MW.make('div', 'mw-layer mw-fill'); s.appendChild(buildFx);
    MW.shell.buttons(s, ['home', 'music', 'hear'], { home: W.home, hear: hearAgain });
    dragger = MW.dragger(s, {
      counters: function () { return st.tiles.filter(function (c) { return !c.placed; }); },
      enabled: function () { return !W.st.paused && W.st.phase === 'words-build' && MW.shell.screen === BUILD; },
      onPick: function (c) { MW.log('pick', c.text); sayTile(c); },
      onDrop: onDrop                                           // each tile is picked up in its own box (makeTile)
    });
  }

  function buildEnd() {
    const s = W.screen(END, 'All the rockets launched');
    endStars = MW.stars(s, 640, 40, 60, { centre: true });
    endPod = MW.pod(s, 380, 120, 400); endPod.face('got-it'); endPod.el.disabled = true; endPod.el.tabIndex = -1;
    endRockets = MW.make('div', 'mw-abs words-end-rockets', { style: 'left:300px;top:590px' });
    s.appendChild(endRockets);
    again = MW.make('button', 'mw-btn mw-btn--play mw-abs', { type: 'button', 'aria-label': 'Another go', id: 'words-again', style: 'left:1080px;top:420px' });
    const icon = MW.art('icon-play'); icon.setAttribute('width', 84); icon.setAttribute('height', 84);
    again.appendChild(icon);
    MW.onTap(again, function () { if (W.st.phase === 'words-done') { MW.audio.unlock(); MW.shell.fullscreen(); startRound(); } });
    s.appendChild(again);
    MW.shell.buttons(s, ['home', 'music'], { home: W.home });
  }

  function setStars(stars, done) { stars.set(done, st.round.length || ROUND); }

  // ---------------------------------------------------------------- a round
  function makeRound() {
    if (G.nextRound) {
      const r = G.nextRound; G.nextRound = null;
      const map = S.statuses(answers());
      return r.map(function (x) {
        const w = typeof x === 'string' ? x : x.word;
        const s = (typeof x === 'object' && x.step) || S.step(map, w);
        return { word: w, step: s === 'notyet' ? 'tiles' : s };
      });
    }
    const wk = week();
    if (wk === S.ALL) return S.pickRound({ words: inPlay(), answers: answers(), size: ROUND, lowest: true });
    return S.pickRound({ words: inPlay(), answers: answers(), size: ROUND, own: S.ownWords(BOOK, wk) });
  }

  async function startRound() {
    const token = ++W.st.token;
    clearBoard();
    st.round = makeRound();
    st.pool = inPlay();
    st.week = week();
    st.qi = 0;
    st.trickySaid = false;
    st.praise = [];
    MW.log('words', 'round ' + JSON.stringify(st.round));
    if (!st.round.length) { MW.log('words', 'no words in play'); W.home(); return; }
    W.st.phase = 'words-starting';
    moments.clear();
    await fontReady();                                         // measure the words in bold Andika itself, not a stand-in
    if (token !== W.st.token) return;
    setFind(st.round[0]);
    MW.shell.show(FIND);
    moments.lookoutUp();                                       // the lookout peeks up from the bottom right
    await W.speak([['words-round-ready']]);
    if (!(await W.ok(token))) return;
    askFind();
  }

  function clearTimers() { st.timers.forEach(clearTimeout); st.timers = []; }
  function later(token, ms, fn) { st.timers.push(setTimeout(function () { if (token === W.st.token) fn(); }, ms)); }

  // ---------------------------------------------------------------- Find
  function setFind(item) {
    const words = S.choices(item.word, roundPool(), Math.random, 3);
    st.repeat = null;
    st.rockets.forEach(function (r, i) {
      r.word = words[i] || null;
      r.el.style.visibility = r.word ? '' : 'hidden';
      r.el.classList.remove('is-lit', 'is-hint');
      r.wordEl.textContent = r.word || '';
      r.el.setAttribute('aria-label', r.word ? 'The word ' + r.word : 'A rocket');
    });
    sizeWords();
    // the bold type not loaded yet (it should be, after fontReady): size the words again once it has
    if (!fontLoaded()) fontReady().then(sizeWords);
    findPod.face('thinking');
    findPod.lightsOff();
  }
  function sizeWords() {
    st.rockets.forEach(function (r) { r.wordEl.style.fontSize = fit(r.word || '', ROCKETS.panel[2] - 28, ROCKETS.wordMax) + 'px'; });
  }
  // The biggest size (up to max) at which a word fits the panel, in the game's own type (Andika, bold). It must be
  // measured in Andika itself: until the bold type has loaded, the browser measures a stand-in that is narrower.
  const FONT = '700 ' + ROCKETS.wordMax + 'px Andika';
  function fontLoaded() { try { return !document.fonts || document.fonts.check(FONT); } catch (e) { return true; } }
  function fontReady() {
    try { if (document.fonts && document.fonts.load) return document.fonts.load(FONT).then(function () {}, function () {}); } catch (e) { /* no font loading API */ }
    return Promise.resolve();
  }
  let measurer = null;
  function fit(word, width, max) {
    if (!word) return max;
    measurer = measurer || document.createElement('canvas').getContext('2d');
    measurer.font = '700 ' + max + 'px Andika';
    const w = measurer.measureText(word).width;
    return w > width ? Math.floor(max * width / w) : max;
  }

  // Ask the round's next word: Find first. (showFind sets the screen up; the tests use it on its own too.)
  async function askFind() {
    const token = W.st.token;
    showFind(st.round[st.qi]);
    if (st.qi === 0) later(token, 1800, function () { moments.lookoutDown(); });   // spotted them
    else moments.settle();
    await W.speak(st.prompt);
  }
  function showFind(item) {
    st.item = item;
    st.tapped = 0; st.drops = 0; st.hinted = false;
    if (!st.rockets.some(function (r) { return r.word === item.word; })) setFind(item);
    MW.shell.show(FIND);
    setStars(findStars, st.qi);
    st.prompt = [['words-find', line(item.word)]];
    W.st.phase = 'words-find';
    MW.log('words', 'find ' + item.word + ' among ' + st.rockets.map(function (r) { return r.word; }).join(' '));
  }

  function tapRocket(r) {
    if (W.st.paused || W.st.phase !== 'words-find' || !r.word) return;
    if (r.word === st.item.word) { found(r); return; }
    // the same wrong rocket again while it is still saying "That word is… my.": one try, not two (a double tap)
    if (st.repeat && st.repeat.r === r && performance.now() < st.repeat.until) { MW.log('words', 'tap ' + r.word + ' again (same try)'); return; }
    // a wrong tap: the word he tapped says itself, then "Let's try again." (and the question), or the hint
    st.tapped++;
    MW.log('words', 'tap ' + r.word + ' (wrong ' + st.tapped + ')');
    tryAgainFace(findPod);
    const lines = [['words-that-word', line(r.word)]];
    if (st.tapped === 1) lines.push(['words-try-again'], st.prompt[0]);
    else if (st.tapped === 2) {
      lines.push(['words-look-together']);
      st.hinted = true;
      st.rockets.forEach(function (x) { if (x.word === st.item.word) x.el.classList.add('is-hint'); });
      MW.log('words', 'hint ' + st.item.word);
    }
    // repeat taps on this rocket count as this try until "That word is… my." has been said (or is cut short)
    const repeat = st.repeat = { r: r, until: Infinity };
    W.speak(lines, {
      onStart: function (timeline) { const w = timeline[1]; repeat.until = performance.now() + (w.at + w.dur + 0.1) * 1000; }
    }).then(function () { repeat.until = 0; });
  }
  function tryAgainFace(pod) {
    pod.face('try-again');
    const token = W.st.token, qi = st.qi;
    later(token, 1600, function () { if (qi === st.qi && (W.st.phase === 'words-find' || W.st.phase === 'words-build')) pod.face('thinking'); });
  }

  async function found(r) {
    const token = W.st.token;
    W.st.phase = 'words-found';
    MW.log('words', 'found ' + r.word);
    r.el.classList.remove('is-hint');
    r.el.classList.add('is-lit');                             // the engines light
    MW.audio.sfx('chime');
    findPod.face('got-it');
    findPod.celebrate();
    MW.sparkles(findFx, r.cx, 420, 175);
    if (!moments.engineer(r.cx)) moments.lookoutDown();        // the engineer taps the rocket's clamp
    await MW.wait(550);
    if (!(await W.ok(token))) return;
    st.praise = st.praise.length ? st.praise : MW.shuffle(PRAISE);
    await W.speak([[st.praise.pop()]]);
    if (!(await W.ok(token))) return;
    await MW.wait(300);
    if (!(await W.ok(token))) return;
    askBuild();
  }

  // ---------------------------------------------------------------- Build
  function tileW(k) { return k === 1 ? D : D + (k - 1) * 0.46 * D; }
  function kOf(text, mode) { return mode === 'tiles' ? Math.min(text.length, 4) : 1; }

  function clearBoard() {
    if (dragger) dragger.cancel();
    clearTimers();
    st.tiles.forEach(function (c) { c.remove(); });
    st.tiles = []; st.places = []; st.next = 0; st.plan = null; st.lamps = [];
    if (st.ship) { st.ship.el.remove(); st.ship = null; }
  }

  // The rocket on its side, made for this word: the back, as much hull as its portholes need, the nose, a socket per
  // place. Scaled down only if a long word would run off the stage.
  function makeShip(places, mode) {
    const widths = places.map(function (p) { return tileW(kOf(p.text, mode)); });
    const L = widths.reduce(function (a, b) { return a + b; }, 0) + GAP * (widths.length - 1) + 96;
    const scale = Math.min(1, (SHIP.right - SHIP.x) / (L + NOSE));
    const el = MW.make('div', 'words-ship mw-abs');
    el.style.left = SHIP.x + 'px'; el.style.top = SHIP.y + 'px';
    el.style.width = ((L + NOSE) * scale) + 'px'; el.style.height = (H * scale) + 'px';
    const inner = MW.make('div', 'words-ship-inner');
    inner.style.transform = 'scale(' + scale + ')';
    el.appendChild(inner);
    const back = MW.art('words-ship-back');
    back.setAttribute('class', 'words-part'); back.style.left = (-BACK[0]) + 'px'; back.style.top = (-BACK[1]) + 'px';
    inner.appendChild(back);
    const hull = MW.art('words-ship-hull');
    hull.setAttribute('class', 'words-part');
    hull.setAttribute('width', L + 4); hull.setAttribute('height', H + 8);
    hull.setAttribute('viewBox', '-4 -4 ' + (L + 4) + ' ' + (H + 8));
    hull.style.left = '-4px'; hull.style.top = '-4px';
    inner.appendChild(hull);
    const nose = MW.art('words-ship-nose');
    nose.setAttribute('class', 'words-part'); nose.style.left = (L - NOSE_X) + 'px'; nose.style.top = '0px';
    inner.appendChild(nose);
    st.lamps = makeLamps(inner, L);
    const slots = [];
    let x = 78;
    widths.forEach(function (w, i) {
      const sock = MW.art('words-socket-' + kOf(places[i].text, mode));
      sock.setAttribute('class', 'words-part'); sock.style.left = (x - 8) + 'px'; sock.style.top = (H / 2 - D / 2 - 8) + 'px';
      inner.appendChild(sock);
      slots.push({ x: x + w / 2, y: H / 2 });                // its middle, in the rocket's own units
      x += w + GAP;
    });
    shipLayer.appendChild(el);
    return { el: el, inner: inner, scale: scale, L: L, slots: slots,
      box: { x: SHIP.x, y: SHIP.y, w: (L + NOSE) * scale, h: H * scale } };
  }
  // The launch lights along this rocket's hull (LAMPS): off until the engines light, then the groups chase (game.css).
  function makeLamps(inner, L) {
    const pts = [];
    LAMPS.rows.forEach(function (row) { for (let x = row[0]; x < L - LAMPS.end; x += LAMPS.step) pts.push([x, row[1]]); });
    pts.sort(function (a, b) { return a[0] - b[0]; });
    return pts.map(function (p, i) {
      const lamp = MW.art('words-lamp');
      const g = i % LAMPS.groups;
      lamp.setAttribute('class', 'words-part words-lamp');
      lamp.setAttribute('data-group', g);
      lamp.style.left = (p[0] - LAMPS.art) + 'px'; lamp.style.top = (p[1] - LAMPS.art) + 'px';
      lamp.querySelector('.words-lamp-on').style.animationDelay = Math.round(g * LAMPS.stagger) + 'ms';
      inner.appendChild(lamp);
      return { x: p[0], y: p[1], group: g, el: lamp };
    });
  }
  function onShip(x, y) {
    const b = st.ship.box;
    return x >= b.x - SHIP.slack && x <= b.x + b.w + SHIP.slack && y >= b.y - SHIP.slack && y <= b.y + b.h + SHIP.slack;
  }

  function makeTile(t, k) {
    const w = tileW(k);
    const el = MW.make('div', 'words-tile' + (t.tricky ? ' is-tricky' : ''), { role: 'img', 'aria-label': t.text });
    el.style.width = w + 'px'; el.style.height = D + 'px';
    el.style.marginLeft = (-w / 2) + 'px'; el.style.marginTop = (-D / 2) + 'px';
    const body = MW.make('div', 'words-tile-body');
    body.appendChild(MW.art('words-tile-' + k));
    body.appendChild(MW.make('span', 'words-tile-text', null, MW.esc(t.text)));
    el.appendChild(body);
    tileLayer.appendChild(el);
    // its pick-up box (MW.dragger): 10 px each side, so neighbours' boxes meet halfway across the tray's 20 px gap and a
    // finger anywhere on a long tile picks that tile; 20 px above and below, for a forgiving pick-up
    const c = { el: el, text: t.text, tricky: t.tricky, spare: t.spare, sound: t.sound || null, k: k, w: w, x: 0, y: 0, draggable: true,
      placed: false, home: null, grab: { w: w + TRAY.gap, h: D + 40 } };
    c.moveTo = function (x, y, size, animate) {
      c.x = x; c.y = y;
      el.classList.toggle('is-moving', !!animate && !MW.reduceMotion);
      el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    };
    c.lift = function (on) { c.lifted = !!on; el.classList.toggle('is-lifted', !!on); };
    c.glow = function (on) { el.classList.toggle('is-glow', !!on); };
    c.remove = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    return c;
  }

  // The tiles in the tray: one row while they fit (up to five); otherwise two rows of up to five, and always two for
  // harder letters. Each tile keeps its own place in the tray; the tray itself never moves.
  function layTray(tiles) {
    const inner = TRAY.w - 2 * TRAY.pad;
    const rowWidth = function (row) { return row.reduce(function (a, c) { return a + c.w; }, 0) + TRAY.gap * Math.max(0, row.length - 1); };
    const one = st.plan.mode !== 'harder' && tiles.length <= TRAY.perRow && rowWidth(tiles) <= inner;
    const half = Math.ceil(tiles.length / 2);
    const rows = one ? [tiles] : [tiles.slice(0, half), tiles.slice(half)];
    const ys = one ? TRAY.one : TRAY.two;
    rows.forEach(function (row, ri) {
      let x = TRAY.x + TRAY.pad;
      row.forEach(function (c) {
        c.home = { x: x + c.w / 2, y: TRAY.y + ys[ri] };
        c.moveTo(c.home.x, c.home.y, 0, false);
        x += c.w + TRAY.gap;
      });
    });
  }

  async function askBuild() {
    showBuild(st.item);
    await W.speak(st.prompt);
  }
  function showBuild(item) {
    st.item = item;
    clearBoard();
    st.plan = S.plan(BOOK, item.word, item.step, S.fillFrom(BOOK, roundWeek(), item.word, roundPool()));
    st.places = st.plan.places;
    st.next = 0;
    st.drops = 0;
    st.ship = makeShip(st.places, st.plan.mode);
    st.tiles = st.plan.tray.map(function (t) { return makeTile(t, kOf(t.text, st.plan.mode)); });
    layTray(st.tiles);
    buildPod.face('thinking');
    buildPod.lightsOff();
    MW.shell.show(BUILD);
    setStars(buildStars, st.qi);
    st.prompt = [['words-build', line(item.word)]];
    W.st.phase = 'words-build';
    MW.log('words', 'build ' + item.word + ' ' + st.plan.mode + ': ' + st.plan.tray.map(function (t) { return t.text; }).join(' '));
  }

  function onDrop(c, x, y, cancelled) {
    if (st.tiles.indexOf(c) < 0 || c.placed) return;           // left over from a word that has ended
    if (cancelled || W.st.paused || W.st.phase !== 'words-build') { floatHome(c); return; }
    if (!onShip(x, y)) {                                        // not on the word: back to the tray, not a try
      const far = Math.hypot(x - c.home.x, y - c.home.y) > 70;
      floatHome(c);
      if (far) MW.audio.sfx('whoosh');
      return;
    }
    const need = st.places[st.next];
    if (c.text === need.text) { place(c, x, y); return; }    // a tile with the same letters is just as good
    floatHome(c);
    MW.audio.sfx('whoosh');
    wrongDrop(c);
  }
  function floatHome(c) { c.moveTo(c.home.x, c.home.y, 0, true); }

  // In the sound tiles step only, a tile says its sound as it is picked up, once per pick-up (not again as it snaps in).
  // A recorded sound stops anything being said; one not recorded yet does nothing and stops nothing; the e of a split
  // pair says nothing (answers 13, 21 and 22 of the 0.6.0 PRD).
  function sayTile(c) {
    if (!st.plan || st.plan.mode !== 'tiles') return;
    const id = S.soundLine(c.sound);
    if (!id) { MW.log('words', 'sound ' + c.text + ': none'); return; }
    if (!MW.audio.recorded(id)) { MW.log('words', 'sound ' + id + ' not recorded yet'); return; }
    MW.log('words', 'sound ' + id);
    W.speak([[id]]);
  }

  function wrongDrop(c) {
    st.drops++;
    MW.log('words', 'drop ' + c.text + ' (wrong ' + st.drops + (c.spare ? ', a spare' : '') + ')');
    tryAgainFace(buildPod);
    if (st.drops === 1) { W.speak([['words-try-again']]); return; }
    // the second wrong drop: "Let's look together." and the next tile glows; after that, each wrong drop lights it again
    st.hinted = true;
    hintTile();
    if (st.drops === 2) W.speak([['words-look-together']]);
  }
  function hintTile() {
    const need = st.places[st.next];
    const free = st.tiles.filter(function (t) { return !t.placed && t.text === need.text; });
    const pick = free.filter(function (t) { return t.tricky === need.tricky; })[0] || free[0];
    st.tiles.forEach(function (t) { t.glow(t === pick); });
    if (pick) MW.log('words', 'hint ' + pick.text);
  }

  function place(c, x, y) {
    const i = st.next;
    const ship = st.ship, slot = ship.slots[i], need = st.places[i];
    c.placed = true; c.draggable = false;
    st.tiles.forEach(function (t) { t.glow(false); });
    MW.audio.sfx('pop');
    // into the rocket: from where it was dropped to its porthole (it now moves with the rocket)
    ship.inner.appendChild(c.el);
    c.el.classList.add('is-set');
    c.el.classList.toggle('is-tricky', need.tricky);          // the place's marking (a same-letter spare takes it)
    c.moveTo((x - SHIP.x) / ship.scale, (y - SHIP.y) / ship.scale, 0, false);
    void c.el.offsetWidth;
    c.moveTo(slot.x, slot.y, 0, true);
    st.next++;
    MW.log('words', 'place ' + c.text + ' ' + st.next + ' of ' + st.places.length);
    const tricky = need.tricky && !st.trickySaid;
    if (tricky) st.trickySaid = true;                          // "That's the tricky bit." once a round
    if (st.next === st.places.length) { built(tricky); return; }
    if (tricky) W.speak([['words-tricky-bit']]);
  }

  async function built(tricky) {
    const token = W.st.token, item = st.item;
    W.st.phase = 'words-built';
    clearTimers();
    record(item);
    buildPod.face('got-it');
    buildPod.celebrate();
    MW.audio.sfx('chime');
    await MW.wait(280);                                         // the last tile settles, then the engines light
    if (!(await W.ok(token))) return;
    st.ship.el.classList.add('is-launch');
    MW.sparkles(buildFx, SHIP.x + st.ship.box.w / 2, SHIP.y + st.ship.box.h / 2 - 40, Math.min(330, st.ship.box.w / 2));
    if (tricky) {
      await W.speak([['words-tricky-bit']]);
      if (!(await W.ok(token))) return;
    }
    if (!(await sayThrough([['words-you-built', line(item.word)]], token))) return;
    setStars(buildStars, st.qi + 1);
    MW.audio.sfx('twinkle');
    moments.navigator(st.qi + 1 < st.round.length ? st.qi + 1 : null);   // the navigator points the way to the next star
    await MW.wait(700);
    if (!(await W.ok(token))) return;
    st.ship.el.classList.add('is-away');                       // off it goes
    await MW.wait(1300);
    if (!(await W.ok(token))) return;
    st.qi++;
    if (st.qi < st.round.length) {
      setFind(st.round[st.qi]);
      askFind();
    } else endRound(token);
  }

  // Say lines to the end: if a pause cuts them off, say them again once it is over. False if the player left.
  async function sayThrough(lines, token) {
    for (;;) {
      const pauses = st.pauses;
      const heard = await W.speak(lines);
      if (!(await W.ok(token))) return false;
      if (heard || st.pauses === pauses) return true;          // said, or can't be (not recorded yet): carry on
    }
  }

  function record(item) {
    const a = { t: Date.now(), w: item.word, step: item.step, mode: st.plan.mode, tapped: st.tapped, drops: st.drops, hint: st.hinted };
    const g = MW.store.game(ID);
    g.answers = Array.isArray(g.answers) ? g.answers : [];
    g.answers.push(a);
    if (g.answers.length > 3000) g.answers.splice(0, g.answers.length - 3000);
    MW.store.save();
    MW.log('words', 'built ' + JSON.stringify(a));
  }

  // ---------------------------------------------------------------- the end of a round
  async function endRound(token) {
    W.st.phase = 'words-done';
    clearBoard();
    MW.shell.show(END);
    const n = st.round.length;
    endStars.set(n, n);
    endRockets.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const r = MW.make('div', 'words-end-rocket');
      r.appendChild(MW.art('words-rocket-mini'));
      r.style.animationDelay = (i * 160) + 'ms';
      endRockets.appendChild(r);
    }
    endRockets.style.left = Math.round(580 - (100 * n + 24 * (n - 1)) / 2) + 'px';
    again.classList.remove('mw-pulse');
    MW.audio.sfx('tune');
    endPod.celebrate();
    await MW.wait(300);
    if (!(await W.ok(token))) return;
    await W.speak([['words-round-done']]);
    if (!(await W.ok(token))) return;
    await MW.wait(500);
    if (!(await W.ok(token))) return;
    if (moments.cook()) {                                      // the cook brings a pan of fish for the MeeMee
      await MW.wait(1300);
      if (!(await W.ok(token))) return;
    }
    again.classList.add('mw-pulse');                           // tap here for another go
    await W.speak([['words-round-another']]);
  }

  function hearAgain() {
    if (W.st.paused) return;
    if (W.st.phase === 'words-find' || W.st.phase === 'words-build') W.speak(st.prompt);
  }

  // Home (from any screen, this game's or the world's): put everything away. The world has moved the token on.
  function leave() {
    clearBoard();
    st.rockets.forEach(function (r) { r.el.classList.remove('is-lit', 'is-hint'); });
    [findPod, buildPod, endPod].forEach(function (p) { if (p) p.lightsOff(); });
    if (again) again.classList.remove('mw-pulse');
    if (moments) moments.clear();
    st.item = null; st.prompt = null; st.pool = null; st.week = null; st.repeat = null;
  }

  // ---------------------------------------------------------------- grown-ups: the Words tab
  const TAGS = { tiles: 'ay', letters: 'a·y', harder: 'a·y+' };
  function cell(step, text) {
    const c = MW.make('span', 'words-cell is-' + step);
    if (step === 'secure') {
      const tick = MW.art('icon-tick'); tick.setAttribute('width', 16); tick.setAttribute('height', 16);
      c.appendChild(tick);
    } else if (TAGS[step]) c.appendChild(MW.make('span', 'words-tag', null, TAGS[step]));
    c.appendChild(document.createTextNode(text));
    return c;
  }
  function weeksText(list) {
    if (list.length === 1) return 'Week ' + list[0];
    const run = list.every(function (w, i) { return i === 0 || w === list[i - 1] + 1; });
    return 'Weeks ' + (run ? list[0] + ' to ' + list[list.length - 1] : list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1]);
  }
  const COUNT = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
  function pickWeek(GU, value) {
    const g = MW.store.game(ID); g.week = value; MW.store.save();
    MW.log('words', 'week ' + value);
    GU.show('words-progress');
  }
  function renderProgress(el) {
    const GU = MW.grownups;
    const map = S.statuses(answers());
    const wk = week();
    const all = wk === S.ALL;
    const allLabel = S.allLabel(BOOK);
    GU.h3(el, 'Week in play');
    const r = GU.row(el);
    BOOK.weeks.forEach(function (x) {
      GU.btn(r, 'Week ' + x.week, function () { pickWeek(GU, x.week); }, 'gu-choice words-week' + (x.week === wk ? ' is-on' : ''));
    });
    // after the last week, every week together ("Weeks 1–5", named from the words file)
    if (allLabel) GU.btn(r, allLabel, function () { pickWeek(GU, S.ALL); }, 'gu-choice words-week words-week-all' + (all ? ' is-on' : ''));
    if (all) {
      const n = BOOK.weeks.length;
      GU.p(el, MW.esc(allLabel) + ' plays every word from all ' + (COUNT[n] || n) + ' weeks, leaning on the ones that need the most work. '
        + 'A change starts with the next round.', 'gu-note');
    } else {
      const tricky = BOOK.weeks.filter(function (x) { return !x.other.length; }).map(function (x) { return x.week; });
      GU.p(el, (tricky.length ? weeksText(tricky) + ': tricky words only until their other words are recorded. ' : '') + 'A change starts with the next round.', 'gu-note');
    }

    const grid = MW.make('div', 'words-grid');
    const row = function (label, words) {
      if (!words.length) return;
      grid.appendChild(MW.make('div', 'words-grid-label label', null, MW.esc(label)));
      const cells = MW.make('div', 'words-grid-cells');
      words.forEach(function (w) { cells.appendChild(cell(S.step(map, w), w)); });
      grid.appendChild(cells);
    };
    const flat = function (weeks, pick) { return [].concat.apply([], weeks.map(pick)); };
    if (all) {
      // every week: every tricky word, then every other word
      row('Tricky words', flat(BOOK.weeks, function (x) { return x.tricky; }));
      row('Other words', flat(BOOK.weeks, function (x) { return x.other; }));
    } else {
      const now = BOOK.weeks.filter(function (x) { return x.week === wk; })[0] || { tricky: [], other: [] };
      row('Tricky words', now.tricky);
      row('Week ' + wk + ' words', now.other);
      row('Earlier weeks', flat(BOOK.weeks.filter(function (x) { return x.week < wk; }), function (x) { return x.tricky; }));
      row('Later weeks', flat(BOOK.weeks.filter(function (x) { return x.week > wk; }), function (x) { return x.tricky.concat(x.other); }));
    }
    el.appendChild(grid);
    const legend = MW.make('div', 'words-legend');
    S.STEPS.forEach(function (s) { legend.appendChild(cell(s, S.NAMES[s])); });
    el.appendChild(legend);
    const earlierOther = !all && BOOK.weeks.some(function (x) { return x.week < wk && x.other.length; });
    GU.p(el, 'Each word is built with <b>sound tiles</b> until it is right first time (no wrong tap or drop, no hint) on three different days. '
      + 'Then it moves to <b>letters</b>: one tile per letter, with a spare or two; then to <b>harder letters</b>, with the tray filled to '
      + BOOK.harderTray + ' tiles. Three more days right first time at each step; after harder letters it is <b>secure</b>. '
      + 'A secure word goes back to harder letters after two slips in a row (answers not right first time); a right answer in between clears the first slip. '
      + (all ? 'Each round has five words: one or two secure ones to review, then the words on the lowest step first. '
        : 'Each round has five words, at least three of them from the week in play (all of its words, if fewer are recorded): '
          + 'one or two secure ones to review and the rest needing work. ')
      + 'When there aren\'t enough words that need work, more secure ones fill the round.'
      + (!all && BOOK.weeks.some(function (x) { return x.week > wk; }) ? ' Later weeks are not in play.' : '')
      + (earlierOther && allLabel ? ' Earlier weeks\' other words come up with ' + MW.esc(allLabel) + '.' : ''), 'gu-note');
    const waiting = BOOK.order.filter(function (w) { return !recorded(w); });
    if (waiting.length) GU.p(el, 'Waiting for a recording, so not in play yet: ' + MW.esc(waiting.join(', ')) + '.', 'gu-note');
    const quiet = S.soundLines(BOOK).filter(function (id) { return !MW.audio.recorded(id); });
    if (quiet.length) GU.p(el, 'Tile sounds waiting for a recording (those tiles are quiet until then): '
      + MW.esc(quiet.map(function (id) { return id.slice(8); }).join(', ')) + '.', 'gu-note');
    if (BOOK.problems.length) GU.p(el, 'To fix in the words file (games/words/words.js): ' + MW.esc(BOOK.problems.join('; ')) + '.', 'gu-note');
    const n = answers().length;
    GU.p(el, n ? 'Words built on this tablet: ' + n + '.' : 'No words built on this tablet yet.', 'gu-note');
    const clear = GU.row(el);
    let armed = 0;
    GU.btn(clear, 'Clear this tablet\'s progress', function (b) {
      if (Date.now() - armed < 4000) {
        const g = MW.store.game(ID); delete g.answers; MW.store.save();   // this game's answers only; the week stays
        MW.log('words', 'progress cleared');
        GU.show('words-progress');
      } else {
        armed = Date.now(); b.textContent = 'Tap again to clear';
        setTimeout(function () { b.textContent = 'Clear this tablet\'s progress'; }, 4000);
      }
    }, 'gu-quiet');
  }

  // ---------------------------------------------------------------- test hooks
  G.start = startRound; G.showFind = showFind; G.showBuild = showBuild; G.setFind = setFind; G.drop = onDrop; G.tapRocket = tapRocket; G.home = W.home; G.makeRound = makeRound;
  G.inPlay = inPlay; G.week = week; G.answers = answers; G.sayTile = sayTile; G.LAMPS = LAMPS;
})();

</script>
</body>
